        run: |
          set -e

          if [ -z "$GEMINI_API_KEY" ]; then

            echo "ERRO: secret GEMINI_API_KEY nao configurado."

            exit 1

          fi


          mkdir -p output/stage06_ai


          cat > /tmp/ai_director_gemini.py <<'PY'
          import json
          import os
          import re
          import time

          from pathlib import Path

          from google import genai
          from google.genai import types


          client = genai.Client(
              api_key=os.environ[
                  "GEMINI_API_KEY"
              ]
          )


          user_context = os.getenv(
              "USER_CONTEXT",
              ""
          ).strip()


          user_mode = os.getenv(
              "USER_MODE",
              "AUTO"
          ).strip().upper()


          user_tempo = os.getenv(
              "USER_TEMPO",
              "AUTO"
          ).strip().upper()


          manifest = json.loads(
              Path(
                  "output/stage05/scene_manifest.json"
              ).read_text(
                  encoding="utf-8"
              )
          )


          original_transcript = Path(
              "output/stage05/transcript.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()


          transcript_meta = json.loads(
              Path(
                  "output/stage05/transcript.json"
              ).read_text(
                  encoding="utf-8"
              )
          )


          source_language = str(
              transcript_meta.get(
                  "language"
              )
              or
              "unknown"
          ).strip().lower()


          source_language_probability = float(
              transcript_meta.get(
                  "language_probability"
              )
              or
              0
          )


          total_duration = sum(
              float(
                  s["duration"]
              )
              for s in manifest
          )


          # =====================================================
          # TEMPO
          # =====================================================

          if user_tempo == "SHORT_CURTO":

              target_min = min(
                  10.0,
                  total_duration
              )

              target_max = min(
                  20.0,
                  total_duration
              )

              narration_target = max(
                  target_max - 1.0,
                  3.0
              )


              tempo_instruction = f"""
              MODO DE DURACAO: SHORT_CURTO.

              ESTA REGRA TEM PRIORIDADE.

              O video final precisa ficar entre:
              {target_min:.2f} e {target_max:.2f} segundos.

              Selecione somente os momentos essenciais.

              Corte repeticoes.

              Crie gancho rapido.

              Nao entregue timeline acima de:
              {target_max:.2f}s.
              """


          elif user_tempo == "PRESERVAR":

              target_min = (
                  total_duration *
                  0.90
              )

              target_max = (
                  total_duration
              )

              narration_target = max(
                  target_max - 2.0,
                  8.0
              )


              tempo_instruction = f"""
              MODO DE DURACAO: PRESERVAR.

              ESTA REGRA TEM PRIORIDADE ABSOLUTA.

              O usuario pediu para preservar aproximadamente
              a duracao original.

              Video original:
              {total_duration:.2f}s.

              Final precisa ficar entre:
              {target_min:.2f}s e {target_max:.2f}s.

              Pode reorganizar e fazer pequenos cortes,
              mas nao pode resumir drasticamente.

              Nao transforme 60 segundos em 20 segundos.

              Se uma cena longa for necessaria,
              ela pode permanecer longa.

              A regra de 8 segundos por cena nao e obrigatoria
              neste modo.
              """


          else:

              target_min = 0.0

              target_max = total_duration

              narration_target = max(
                  total_duration - 2.0,
                  8.0
              )


              tempo_instruction = """
              MODO DE DURACAO: AUTO.

              Use liberdade editorial normal.

              O video pode terminar antes da duracao original
              se isso melhorar o ritmo.
              """


          target_words = max(
              10,
              int(
                  narration_target *
                  2.05
              )
          )


          instructions = f"""
          Voce e o DIRETOR EDITORIAL MULTIMODAL
          do canal PARECE MENTIRA.

          Sua tarefa e editar a historia de forma audiovisual.

          DADOS:

          Duracao:
          {total_duration:.2f}s

          Narracao:
          {user_mode}

          Tempo:
          {user_tempo}

          Narracao alvo:
          ate {narration_target:.2f}s

          Palavras aproximadas:
          no maximo {target_words}

          Contexto:
          {user_context or "[nao informado]"}

          Idioma original:
          {source_language}

          Confianca:
          {source_language_probability:.3f}

          Transcricao original:
          {original_transcript or "[sem narracao detectada]"}


          REGRA DE TEMPO:

          {tempo_instruction}


          REGRAS:

          1. Leia o video visualmente.

          2. Imagem, legenda visivel e narracao
             precisam ser coerentes.

          3. No modo AUTO:
             pode remover cenas dispensaveis.

          4. No modo SHORT_CURTO:
             mantenha apenas o essencial.

          5. No modo PRESERVAR:
             remova apenas material realmente dispensavel.
             A duracao final precisa ficar em 90-100%.

          6. Nao use freeze frame.

          7. Modo SEM_NARRACAO:
             todos os narration vazios.

          8. Video sem audio:
             use contexto + imagem.
             Nao invente fatos.

          9. Incremento:
             no maximo 1.
             map, fact_card ou none.

          10. Toda narracao nova deve ser em PORTUGUES DO BRASIL.

          11. Se o audio original estiver em outro idioma:
              traduza/adapte a narracao para PT-BR.

          12. Legenda queimada original:
              - nao apagar
              - nao traduzir visualmente
              - nao cobrir
              - nao substituir
              - nao contradizer

          13. Legenda visivel tem prioridade sobre reordenacao.

          14. Termine naturalmente, quando houver narracao:
              "Parece mentira. Mas aconteceu."

          15. Cada item deve ter reason.

          16. A narracao precisa caber no tempo visual.

          17. Use aproximadamente ate 2 palavras por segundo.

          18. Antes de responder, some a duracao da timeline.

          19. SHORT_CURTO:
              {min(10.0,total_duration):.2f}
              a
              {min(20.0,total_duration):.2f}s.

          20. PRESERVAR:
              {total_duration*0.90:.2f}
              a
              {total_duration:.2f}s.


          RETORNE SOMENTE JSON VALIDO:

          {{
            "story_summary": "resumo curto",

            "mode_used": "AUTO|ORIGINAL|NOVA|SEM_NARRACAO",

            "research_notes": [
              {{
                "fact": "",
                "source": ""
              }}
            ],

            "increment": {{
              "type": "none|map|fact_card",
              "title": "",
              "subtitle": "",
              "duration": 0,
              "narration": "",
              "points": [
                {{
                  "label": "",
                  "lat": 0.0,
                  "lon": 0.0
                }}
              ]
            }},

            "timeline": [
              {{
                "kind": "scene|increment",
                "scene": 1,
                "duration": 4.5,
                "narration": "",
                "reason": ""
              }}
            ]
          }}

          Para increment:
          scene=null.
          """


          contents = [
              instructions
          ]


          for scene in manifest:

              num = int(
                  scene["scene"]
              )


              sheet = Path(
                  f"output/stage06_vision/sheets/"
                  f"scene_{num:03d}.jpg"
              )


              scene_info = (
                  f"CENA {num:03d} | "
                  f"duracao={float(scene['duration']):.2f}s | "
                  f"fala_original="
                  f"{scene.get('transcript') or '[sem fala]'}"
              )


              contents.append(
                  scene_info
              )


              contents.append(
                  types.Part.from_bytes(
                      data=sheet.read_bytes(),
                      mime_type="image/jpeg"
                  )
              )


          models_to_try = [
              "gemini-3.7-flash",
              "gemini-3.6-flash",
              "gemini-3.5-flash",
              "gemini-3.8-flash",
          ]


          response = None

          selected_model = None

          last_error = None


          for model_name in models_to_try:

              for attempt in range(
                  1,
                  5
              ):

                  try:

                      print(
                          f"Tentando {model_name} "
                          f"(tentativa {attempt}/4)..."
                      )


                      response = client.models.generate_content(
                          model=model_name,
                          contents=contents,
                          config=types.GenerateContentConfig(
                              response_mime_type="application/json",
                              temperature=0.35
                          )
                      )


                      if (
                          response
                          and
                          (
                              response.text or ""
                          ).strip()
                      ):

                          selected_model = model_name

                          break


                  except Exception as exc:

                      last_error = exc

                      msg = str(exc)

                      msg_lower = msg.lower()


                      retryable = (
                          "503" in msg
                          or
                          "UNAVAILABLE" in msg
                          or
                          "429" in msg
                          or
                          "RESOURCE_EXHAUSTED" in msg
                          or
                          "high demand" in msg_lower
                          or
                          "server disconnected" in msg_lower
                          or
                          "remoteprotocolerror" in msg_lower
                          or
                          "connection reset" in msg_lower
                          or
                          "connection aborted" in msg_lower
                          or
                          "connection error" in msg_lower
                          or
                          "read timeout" in msg_lower
                          or
                          "write timeout" in msg_lower
                          or
                          "connect timeout" in msg_lower
                          or
                          "timed out" in msg_lower
                          or
                          "temporarily unavailable" in msg_lower
                      )


                      print(
                          f"Falha em {model_name}: {exc}"
                      )


                      if not retryable:

                          raise


                      if attempt < 4:

                          wait_seconds = (
                              10 *
                              attempt
                          )

                          time.sleep(
                              wait_seconds
                          )


              if selected_model:

                  break


          if (
              response is None
              or
              selected_model is None
          ):

              raise RuntimeError(
                  "Nenhum modelo Gemini respondeu. "
                  f"Ultimo erro: {last_error}"
              )


          raw = (
              response.text
              or
              ""
          ).strip()


          raw = re.sub(
              r"^```(?:json)?\s*",
              "",
              raw,
              flags=re.I
          )


          raw = re.sub(
              r"\s*```$",
              "",
              raw
          )


          try:

              plan = json.loads(
                  raw
              )

          except json.JSONDecodeError:

              match = re.search(
                  r"\{.*\}",
                  raw,
                  flags=re.S
              )

              if not match:

                  raise RuntimeError(
                      "Gemini nao retornou JSON valido."
                  )

              plan = json.loads(
                  match.group(0)
              )


          timeline = plan.get(
              "timeline",
              []
          )


          if not timeline:

              raise RuntimeError(
                  "Gemini retornou timeline vazia."
              )


          valid_scenes = {
              int(
                  s["scene"]
              )
              for s in manifest
          }


          original_durations = {
              int(s["scene"]):
              float(s["duration"])
              for s in manifest
          }


          for item in timeline:

              kind = item.get(
                  "kind"
              )


              if kind not in (
                  "scene",
                  "increment"
              ):

                  raise RuntimeError(
                      f"kind invalido: {kind}"
                  )


              duration = float(
                  item.get(
                      "duration",
                      0
                  )
              )


              if duration <= 0:

                  raise RuntimeError(
                      "Item com duracao invalida."
                  )


              if kind == "scene":

                  scene = int(
                      item.get(
                          "scene"
                      )
                  )


                  if scene not in valid_scenes:

                      raise RuntimeError(
                          f"Cena invalida: {scene}"
                      )


                  original_duration = (
                      original_durations[
                          scene
                      ]
                  )


                  max_allowed = (
                      original_duration *
                      1.10
                  )


                  if user_tempo == "PRESERVAR":

                      if (
                          duration >
                          original_duration
                      ):

                          item[
                              "duration"
                          ] = round(
                              original_duration,
                              3
                          )


                  else:

                      if (
                          duration >
                          max_allowed + 0.05
                      ):

                          item[
                              "duration"
                          ] = round(
                              max_allowed,
                              3
                          )


                      if (
                          float(
                              item["duration"]
                          ) >
                          8.0
                      ):

                          item[
                              "duration"
                          ] = 8.0


                  narration = str(
                      item.get(
                          "narration",
                          ""
                      )
                  ).strip()


                  if narration:

                      words = len(
                          narration.split()
                      )

                      estimated_voice = (
                          words /
                          2.05
                      )

                      current_duration = float(
                          item[
                              "duration"
                          ]
                      )


                      if (
                          estimated_voice >
                          current_duration
                      ):

                          desired = (
                              estimated_voice *
                              1.03
                          )


                          if user_tempo == "PRESERVAR":

                              editorial_cap = (
                                  original_duration
                              )

                          else:

                              editorial_cap = min(
                                  max_allowed,
                                  8.0
                              )


                          item[
                              "duration"
                          ] = round(
                              min(
                                  desired,
                                  editorial_cap
                              ),
                              3
                          )


          def timeline_total(items):

              return sum(
                  float(
                      i.get(
                          "duration",
                          0
                      )
                  )
                  for i in items
              )


          timeline_duration = timeline_total(
              timeline
          )


          # =====================================================
          # SHORT
          # =====================================================

          if user_tempo == "SHORT_CURTO":

              short_min = min(
                  10.0,
                  total_duration
              )

              short_max = min(
                  20.0,
                  total_duration
              )


              if (
                  timeline_duration >
                  short_max
              ):

                  trimmed = []

                  remaining = short_max


                  for item in timeline:

                      if remaining <= 0.05:

                          break


                      item_duration = float(
                          item[
                              "duration"
                          ]
                      )


                      use_duration = min(
                          item_duration,
                          remaining
                      )


                      if use_duration > 0.05:

                          new_item = dict(
                              item
                          )

                          new_item[
                              "duration"
                          ] = round(
                              use_duration,
                              3
                          )

                          trimmed.append(
                              new_item
                          )

                          remaining -= (
                              use_duration
                          )


                  timeline = trimmed


              timeline_duration = timeline_total(
                  timeline
              )


              if (
                  timeline_duration <
                  short_min
              ):

                  used = {
                      int(
                          i["scene"]
                      )
                      for i in timeline
                      if (
                          i.get(
                              "kind"
                          ) == "scene"
                          and
                          i.get(
                              "scene"
                          ) is not None
                      )
                  }


                  for scene_data in manifest:

                      if (
                          timeline_duration >=
                          short_min
                      ):

                          break


                      scene_num = int(
                          scene_data[
                              "scene"
                          ]
                      )


                      if scene_num in used:

                          continue


                      available = min(
                          float(
                              scene_data[
                                  "duration"
                              ]
                          ),
                          short_max -
                          timeline_duration
                      )


                      if available <= 0.05:

                          continue


                      timeline.append({
                          "kind":
                              "scene",

                          "scene":
                              scene_num,

                          "duration":
                              round(
                                  available,
                                  3
                              ),

                          "narration":
                              "",

                          "reason":
                              "Complemento visual automatico para cumprir SHORT_CURTO."
                      })


                      used.add(
                          scene_num
                      )


                      timeline_duration = timeline_total(
                          timeline
                      )


              final_short = timeline_total(
                  timeline
              )


              if (
                  final_short <
                  short_min - 0.20
                  or
                  final_short >
                  short_max + 0.20
              ):

                  raise RuntimeError(
                      "Nao foi possivel ajustar SHORT_CURTO."
                  )


          # =====================================================
          # PRESERVAR
          # =====================================================

          elif user_tempo == "PRESERVAR":

              preserve_min = (
                  total_duration *
                  0.90
              )


              preserve_max = (
                  total_duration
              )


              timeline_duration = timeline_total(
                  timeline
              )


              if (
                  timeline_duration >
                  preserve_max
              ):

                  trimmed = []

                  remaining = preserve_max


                  for item in timeline:

                      if remaining <= 0.05:

                          break


                      item_duration = float(
                          item[
                              "duration"
                          ]
                      )


                      use_duration = min(
                          item_duration,
                          remaining
                      )


                      if use_duration > 0.05:

                          new_item = dict(
                              item
                          )


                          new_item[
                              "duration"
                          ] = round(
                              use_duration,
                              3
                          )


                          trimmed.append(
                              new_item
                          )


                          remaining -= (
                              use_duration
                          )


                  timeline = trimmed


              timeline_duration = timeline_total(
                  timeline
              )


              if (
                  timeline_duration <
                  preserve_min
              ):

                  print(
                      "Ativando protecao PRESERVAR."
                  )


                  narration_parts = []


                  for item in timeline:

                      text = str(
                          item.get(
                              "narration",
                              ""
                          )
                      ).strip()


                      if text:

                          narration_parts.append(
                              text
                          )


                  preserved_timeline = []


                  for scene_data in manifest:

                      duration = (
                          float(
                              scene_data[
                                  "duration"
                              ]
                          ) *
                          0.95
                      )


                      preserved_timeline.append({
                          "kind":
                              "scene",

                          "scene":
                              int(
                                  scene_data[
                                      "scene"
                                  ]
                              ),

                          "duration":
                              round(
                                  duration,
                                  3
                              ),

                          "narration":
                              "",

                          "reason":
                              "Cena mantida para preservar aproximadamente a duracao original."
                      })


                  if (
                      narration_parts
                      and
                      preserved_timeline
                      and
                      user_mode !=
                      "SEM_NARRACAO"
                  ):

                      preserved_timeline[
                          0
                      ][
                          "narration"
                      ] = " ".join(
                          narration_parts
                      )


                  timeline = preserved_timeline


              final_preserve = timeline_total(
                  timeline
              )


              if (
                  final_preserve <
                  preserve_min - 0.25
                  or
                  final_preserve >
                  preserve_max + 0.25
              ):

                  raise RuntimeError(
                      "Protecao PRESERVAR nao conseguiu atingir 90-100%."
                  )


          plan[
              "timeline"
          ] = timeline


          plan[
              "tempo_mode"
          ] = user_tempo


          plan[
              "source_duration"
          ] = round(
              total_duration,
              3
          )


          plan[
              "timeline_duration"
          ] = round(
              timeline_total(
                  timeline
              ),
              3
          )


          Path(
              "output/stage06_ai/director_plan.json"
          ).write_text(
              json.dumps(
                  plan,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )


          Path(
              "output/stage06_ai/director_raw.txt"
          ).write_text(
              raw,
              encoding="utf-8"
          )


          Path(
              "output/stage06_ai/provider.txt"
          ).write_text(
              selected_model + "\n",
              encoding="utf-8"
          )


          print(
              json.dumps(
                  plan,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

          python3 /tmp/ai_director_gemini.py

          test -s output/stage06_ai/director_plan.json
          test -s output/stage06_ai/provider.txt


