      # =========================================================
      # STAGE 08 - NARRACAO POR BLOCO VISUAL
      #
      # Cada bloco recebe:
      # - a narracao original correspondente a imagem
      # - OU narracao factual propria, no caso do incremento externo
      #
      # Isso evita narracao global fora de sincronia.
      # =========================================================

      - name: Stage 08 - Instalar TTS
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y espeak-ng
          python3 -m pip install edge-tts gTTS

      - name: Stage 08 - Criar Roteiro por Blocos
        shell: bash
        run: |
          set -e

          mkdir -p output/stage08/blocks

          cat > /tmp/build_block_script.py <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("output/stage05/scene_manifest.json").read_text(
                  encoding="utf-8"
              )
          )

          transcript = json.loads(
              Path("output/stage05/transcript.json").read_text(
                  encoding="utf-8"
              )
          )

          increment = json.loads(
              Path("output/stage07/increment_context.json").read_text(
                  encoding="utf-8"
              )
          )

          by_scene = {
              int(s["scene"]): s for s in manifest
          }

          def words_between(start, end):
              words = []
              for seg in transcript.get("segments", []):
                  for w in seg.get("words", []):
                      ws = w.get("start")
                      we = w.get("end")
                      if ws is None or we is None:
                          continue

                      midpoint = (ws + we) / 2

                      if start <= midpoint < end:
                          words.append(w.get("word", ""))

              return "".join(words).strip()

          scene6 = by_scene[6]
          scene6_start = float(scene6["start"])

          s6a = words_between(
              scene6_start,
              scene6_start + 8.8
          )

          s6b = words_between(
              scene6_start + 8.8,
              float(scene6["end"])
          )

          blocks = [
              {
                  "id": "001",
                  "video": "output/stage04_clips/scene_001.mp4",
                  "text": by_scene[1]["transcript"]
              },
              {
                  "id": "002",
                  "video": "output/stage04_clips/scene_002.mp4",
                  "text": by_scene[2]["transcript"]
              },
              {
                  "id": "004",
                  "video": "output/stage04_clips/scene_004.mp4",
                  "text": by_scene[4]["transcript"]
              },
              {
                  "id": "006a",
                  "video": "output/stage06/parts/06a_combustivel.mp4",
                  "text": s6a or by_scene[6]["transcript"]
              },
              {
                  "id": "map",
                  "video": "output/stage07/map_insert.mp4",
                  "text": increment["narration"]
              },
              {
                  "id": "006b",
                  "video": "output/stage06/parts/06b_preparacao.mp4",
                  "text": s6b or by_scene[6]["transcript"]
              },
              {
                  "id": "007",
                  "video": "output/stage04_clips/scene_007.mp4",
                  "text": by_scene[7]["transcript"]
              },
              {
                  "id": "008",
                  "video": "output/stage04_clips/scene_008.mp4",
                  "text": by_scene[8]["transcript"]
              },
              {
                  "id": "009",
                  "video": "output/stage04_clips/scene_009.mp4",
                  "text": by_scene[9]["transcript"]
              },
              {
                  "id": "010",
                  "video": "output/stage04_clips/scene_010.mp4",
                  "text": by_scene[10]["transcript"]
              },
              {
                  "id": "011",
                  "video": "output/stage04_clips/scene_011.mp4",
                  "text": "Parece mentira. Mas aconteceu."
              },
          ]

          Path(
              "output/stage08/block_script.json"
          ).write_text(
              json.dumps(
                  blocks,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          with open(
              "output/stage08/block_script.txt",
              "w",
              encoding="utf-8"
          ) as f:
              for b in blocks:
                  f.write(f"BLOCO {b['id']}\n")
                  f.write(f"VIDEO: {b['video']}\n")
                  f.write(f"NARRACAO: {b['text']}\n")
                  f.write("----------------------------------------\n")
          PY

          python3 /tmp/build_block_script.py

          test -s output/stage08/block_script.json
          test -s output/stage08/block_script.txt

      # =========================================================
      # GERAR TTS BLOCO A BLOCO
      # =========================================================

      - name: Stage 08 - Gerar Narracoes dos Blocos
        shell: bash
        run: |
          set -e

          cat > /tmp/tts_blocks.py <<'PY'
          import json
          import subprocess
          from pathlib import Path

          blocks = json.loads(
              Path(
                  "output/stage08/block_script.json"
              ).read_text(encoding="utf-8")
          )

          out_dir = Path("output/stage08/blocks")
          out_dir.mkdir(parents=True, exist_ok=True)

          for block in blocks:
              bid = block["id"]
              text = (block["text"] or "").strip()

              txt_path = out_dir / f"{bid}.txt"
              mp3_path = out_dir / f"{bid}_raw.mp3"

              txt_path.write_text(text, encoding="utf-8")

              if not text:
                  continue

              cmd = [
                  "edge-tts",
                  "--voice", "pt-BR-AntonioNeural",
                  "--rate=-4%",
                  "--text", text,
                  "--write-media", str(mp3_path)
              ]

              result = subprocess.run(
                  cmd,
                  check=False
              )

              if result.returncode != 0 or not mp3_path.exists():
                  # Fallback simples e local.
                  wav_path = out_dir / f"{bid}_fallback.wav"

                  subprocess.run([
                      "espeak-ng",
                      "-v", "pt-br",
                      "-s", "158",
                      "-f", str(txt_path),
                      "-w", str(wav_path)
                  ], check=True)

                  subprocess.run([
                      "ffmpeg", "-y",
                      "-i", str(wav_path),
                      "-c:a", "libmp3lame",
                      "-b:a", "160k",
                      str(mp3_path)
                  ], check=True)

          print("TTS por blocos concluido.")
          PY

          python3 /tmp/tts_blocks.py

      # =========================================================
      # AJUSTAR CADA NARRACAO AO SEU PROPRIO BLOCO VISUAL
      # =========================================================

      - name: Stage 08 - Sincronizar Narracao por Cena
        shell: bash
        run: |
          set -e

          cat > /tmp/fit_blocks.py <<'PY'
          import json
          import subprocess
          from pathlib import Path

          blocks = json.loads(
              Path(
                  "output/stage08/block_script.json"
              ).read_text(encoding="utf-8")
          )

          out_dir = Path("output/stage08/blocks")

          concat_lines = []

          for block in blocks:
              bid = block["id"]
              video = Path(block["video"])
              audio = out_dir / f"{bid}_raw.mp3"
              fitted = out_dir / f"{bid}_fitted.m4a"
              rendered = out_dir / f"{bid}_narrated.mp4"

              def duration(path):
                  p = subprocess.run(
                      [
                          "ffprobe",
                          "-v", "error",
                          "-show_entries", "format=duration",
                          "-of", "default=noprint_wrappers=1:nokey=1",
                          str(path)
                      ],
                      capture_output=True,
                      text=True,
                      check=True
                  )
                  return float(p.stdout.strip())

              vd = duration(video)

              if audio.exists() and audio.stat().st_size > 0:
                  ad = duration(audio)

                  # Fator necessario para caber no bloco.
                  target = max(vd - 0.20, 0.5)
                  tempo = ad / target

                  # Limites naturais.
                  tempo = max(0.88, min(1.22, tempo))

                  subprocess.run([
                      "ffmpeg", "-y",
                      "-i", str(audio),
                      "-filter:a",
                      f"atempo={tempo:.6f},volume=1.05",
                      "-c:a", "aac",
                      "-b:a", "160k",
                      str(fitted)
                  ], check=True)

                  # Se ainda faltar audio para completar o bloco,
                  # o apad preenche com silencio.
                  subprocess.run([
                      "ffmpeg", "-y",
                      "-i", str(video),
                      "-i", str(fitted),
                      "-filter_complex",
                      "[1:a]apad[a]",
                      "-map", "0:v:0",
                      "-map", "[a]",
                      "-c:v", "copy",
                      "-c:a", "aac",
                      "-b:a", "160k",
                      "-t", f"{vd:.3f}",
                      "-movflags", "+faststart",
                      str(rendered)
                  ], check=True)
              else:
                  subprocess.run([
                      "ffmpeg", "-y",
                      "-i", str(video),
                      "-f", "lavfi",
                      "-i", "anullsrc=r=48000:cl=stereo",
                      "-map", "0:v:0",
                      "-map", "1:a:0",
                      "-c:v", "copy",
                      "-c:a", "aac",
                      "-b:a", "160k",
                      "-t", f"{vd:.3f}",
                      "-movflags", "+faststart",
                      str(rendered)
                  ], check=True)

              concat_lines.append(
                  "file '" + str(rendered.resolve()) + "'"
              )

          Path(
              "output/stage08/final_narrated_concat.txt"
          ).write_text(
              "\n".join(concat_lines) + "\n",
              encoding="utf-8"
          )
          PY

          python3 /tmp/fit_blocks.py

          test -s output/stage08/final_narrated_concat.txt

      # =========================================================
      # JUNTAR BLOCOS JA NARRADOS
      # =========================================================

      - name: Stage 08 - Renderizar Video Narrado Coerente
        shell: bash
        run: |
          set -e

          ffmpeg -y \
