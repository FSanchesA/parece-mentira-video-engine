name: Parece Mentira - Video Engine V15.25 Logo Control

run-name: ${{ inputs.app_job_tag != '' && format('APP {0}', inputs.app_job_tag) || 'Execucao manual' }}

on:
  workflow_dispatch:
    inputs:

      contexto:
        description: "Contexto do episodio (opcional)"
        required: false
        type: string
        default: ""

      etapa:
        description: "Etapa do processamento"
        required: true
        type: choice
        default: "COMPLETO_IA"
        options:
          - COMPLETO_IA
          - ACABAMENTO_SEM_IA

      modo:
        description: "Modo de narracao"
        required: true
        type: choice
        default: "AUTO"
        options:
          - AUTO
          - ORIGINAL
          - NOVA
          - SEM_NARRACAO
          - PLANO_MANUAL

      tempo:
        description: "Controle de duracao"
        required: true
        type: choice
        default: "AUTO"
        options:
          - AUTO
          - SHORT_CURTO
          - PRESERVAR

      logo_posicao:
        description: "Posicao da logo pequena"
        required: true
        type: choice
        default: "NORMAL"
        options:
          - NORMAL
          - LATERAL
          - VERTICAL
          - LATERAL_VERTICAL

      app_job_tag:
        description: "Tag do job criado pelo app"
        required: false
        type: string
        default: ""

      app_release_id:
        description: "Release ID do job criado pelo app"
        required: false
        type: string
        default: ""

      app_source_asset_id:
        description: "Asset ID do video enviado pelo app"
        required: false
        type: string
        default: ""

      app_source_filename:
        description: "Nome do video enviado pelo app"
        required: false
        type: string
        default: ""


permissions:
  contents: write
  actions: read


concurrency:
  group: parece-mentira-video-engine
  cancel-in-progress: true


jobs:

  render-video:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:


      # =========================================================
      # SETUP
      # =========================================================

      - name: Baixar repositorio
        uses: actions/checkout@v4


      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip


      # =========================================================
      # APP - BAIXAR VIDEO TEMPORARIO
      # =========================================================

      - name: App - Baixar video enviado
        if: ${{ inputs.app_source_asset_id != '' }}
        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ASSET_ID: ${{ inputs.app_source_asset_id }}
          SOURCE_FILENAME: ${{ inputs.app_source_filename }}

        run: |
          set -e

          mkdir -p app_input

          SAFE_NAME=$(printf "%s" "${SOURCE_FILENAME:-video.mp4}" \
            | sed 's/[^A-Za-z0-9._-]/_/g')

          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="video.mp4"
          fi

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${SOURCE_ASSET_ID}" \
            -o "app_input/$SAFE_NAME"

          test -s "app_input/$SAFE_NAME"

          echo "APP_VIDEO=app_input/$SAFE_NAME" >> "$GITHUB_ENV"

          echo "VIDEO DO APP BAIXADO: app_input/$SAFE_NAME"


      # =========================================================
      # LOCALIZAR ARQUIVOS
      # =========================================================

      - name: Localizar arquivos
        shell: bash

        run: |
          set -e

          if [ -n "${APP_VIDEO:-}" ] && [ -s "$APP_VIDEO" ]; then

            VIDEO="$APP_VIDEO"

          else

            VIDEO=$(find . \
              -maxdepth 2 \
              -type f \
              -iname "*.mp4" \
              ! -path "./output/*" \
              ! -path "./app_input/*" \
              | head -1)

          fi

          if [ -z "$VIDEO" ]; then
            echo "ERRO: nenhum MP4 encontrado."
            exit 1
          fi

          if [ ! -f "./logo_parece_mentira.png" ]; then
            echo "ERRO: logo_parece_mentira.png nao encontrada."
            exit 1
          fi

          echo "VIDEO=$VIDEO" >> "$GITHUB_ENV"

          echo "========================================"
          echo "ARQUIVOS LOCALIZADOS"
          echo "Video: $VIDEO"
          echo "Logo: ./logo_parece_mentira.png"
          echo "Tempo: ${{ inputs.tempo }}"
          echo "Logo posicao: ${{ inputs.logo_posicao }}"
          echo "========================================"


      # =========================================================
      # ANALISE DO VIDEO
      # =========================================================

      - name: Analisar video original
        shell: bash

        env:
          USER_TEMPO: ${{ inputs.tempo }}

        run: |
          set -e

          mkdir -p output

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$VIDEO")

          if [ -z "$DURATION" ]; then
            echo "ERRO: duracao nao identificada."
            exit 1
          fi

          FINAL_START=$(awk -v d="$DURATION" 'BEGIN { printf "%.3f", d-5.0 }')
          FINAL_FULL=$(awk -v d="$DURATION" 'BEGIN { printf "%.3f", d-4.0 }')
          SMALL_FADE_START=$(awk -v d="$DURATION" 'BEGIN { printf "%.3f", d-4.0 }')
          SMALL_FADE_END=$(awk -v d="$DURATION" 'BEGIN { printf "%.3f", d-3.0 }')


          if [ "$USER_TEMPO" = "PRESERVAR" ]; then

            TARGET_MIN=$(awk -v d="$DURATION" \
              'BEGIN { printf "%.3f", d*0.90 }')

            TARGET_MAX=$(awk -v d="$DURATION" \
              'BEGIN { printf "%.3f", d }')

          elif [ "$USER_TEMPO" = "SHORT_CURTO" ]; then

            TARGET_MIN=$(awk -v d="$DURATION" '
              BEGIN {
                if (d < 10.0) printf "%.3f", d;
                else printf "%.3f", 10.0
              }')

            TARGET_MAX=$(awk -v d="$DURATION" '
              BEGIN {
                if (d < 20.0) printf "%.3f", d;
                else printf "%.3f", 20.0
              }')

          else

            TARGET_MIN="0.000"
            TARGET_MAX="$DURATION"

          fi


          echo "DURATION=$DURATION" >> "$GITHUB_ENV"
          echo "FINAL_START=$FINAL_START" >> "$GITHUB_ENV"
          echo "FINAL_FULL=$FINAL_FULL" >> "$GITHUB_ENV"
          echo "SMALL_FADE_START=$SMALL_FADE_START" >> "$GITHUB_ENV"
          echo "SMALL_FADE_END=$SMALL_FADE_END" >> "$GITHUB_ENV"

          echo "TARGET_MIN=$TARGET_MIN" >> "$GITHUB_ENV"
          echo "TARGET_MAX=$TARGET_MAX" >> "$GITHUB_ENV"


          ffprobe \
            -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$VIDEO" \
            > output/source_report.txt


          echo "========================================"
          echo "VIDEO ORIGINAL"
          echo "Duracao: $DURATION s"
          echo "Modo tempo: $USER_TEMPO"
          echo "Faixa alvo: $TARGET_MIN - $TARGET_MAX s"
          echo "========================================"


      # =========================================================
      # STAGE 01 - DEFINIR POSICAO DA LOGO
      # =========================================================

      - name: Stage 01 - Configurar Posicao da Logo
        shell: bash

        env:
          LOGO_POSITION: ${{ inputs.logo_posicao }}

        run: |
          set -e

          # -----------------------------------------------------
          # POSICAO NORMAL APROVADA
          # -----------------------------------------------------

          TOP_X="W-w-28"
          BOTTOM_X="28"

          TOP_Y="420"
          BOTTOM_Y="H-h-625"


          # -----------------------------------------------------
          # DESLOCAMENTO LATERAL
          #
          # Superior: 40 px para esquerda
          # Inferior: 40 px para direita
          # -----------------------------------------------------

          if [ "$LOGO_POSITION" = "LATERAL" ]; then

            TOP_X="W-w-68"
            BOTTOM_X="68"

          fi


          # -----------------------------------------------------
          # DESLOCAMENTO VERTICAL
          #
          # Superior: 30 px para cima
          # Inferior: 30 px para baixo
          # -----------------------------------------------------

          if [ "$LOGO_POSITION" = "VERTICAL" ]; then

            TOP_Y="390"
            BOTTOM_Y="H-h-595"

          fi


          # -----------------------------------------------------
          # LATERAL + VERTICAL
          # -----------------------------------------------------

          if [ "$LOGO_POSITION" = "LATERAL_VERTICAL" ]; then

            TOP_X="W-w-68"
            BOTTOM_X="68"

            TOP_Y="390"
            BOTTOM_Y="H-h-595"

          fi


          echo "LOGO_TOP_X=$TOP_X" >> "$GITHUB_ENV"
          echo "LOGO_BOTTOM_X=$BOTTOM_X" >> "$GITHUB_ENV"
          echo "LOGO_TOP_Y=$TOP_Y" >> "$GITHUB_ENV"
          echo "LOGO_BOTTOM_Y=$BOTTOM_Y" >> "$GITHUB_ENV"


          echo "========================================"
          echo "POSICAO DA LOGO"
          echo "Modo: $LOGO_POSITION"
          echo "Superior X: $TOP_X"
          echo "Superior Y: $TOP_Y"
          echo "Inferior X: $BOTTOM_X"
          echo "Inferior Y: $BOTTOM_Y"
          echo "========================================"


      # =========================================================
      # STAGE 01 - SOURCE BRANDING
      # =========================================================

      - name: Stage 01 - Branding Ajustado Final
        shell: bash

        run: |
          set -e

          echo "========================================"
          echo "STAGE 01 - BRANDING"
          echo "Logo pequena configuravel pelo app"
          echo "Logo final central: NAO ALTERADA"
          echo "========================================"

          ffmpeg -y \
            -i "$VIDEO" \
            -loop 1 -framerate 30 -i "./logo_parece_mentira.png" \
            -loop 1 -framerate 30 -i "./logo_parece_mentira.png" \
            -filter_complex "\
            [0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1[base];\
            \
            [1:v]scale=270:160,format=rgba,split=9[l1][l2][l3][l4][l5][l6][l7][l8][l9];\
            \
            [l1]fade=t=out:st=8.95:d=0.55:alpha=1[top0];\
            [l2]fade=t=in:st=8.60:d=0.40:alpha=1,fade=t=out:st=17.95:d=0.55:alpha=1[bottom0];\
            [l3]fade=t=in:st=17.60:d=0.40:alpha=1,fade=t=out:st=26.95:d=0.55:alpha=1[top1];\
            [l4]fade=t=in:st=26.60:d=0.40:alpha=1,fade=t=out:st=35.95:d=0.55:alpha=1[bottom1];\
            [l5]fade=t=in:st=35.60:d=0.40:alpha=1,fade=t=out:st=44.95:d=0.55:alpha=1[top2];\
            [l6]fade=t=in:st=44.60:d=0.40:alpha=1,fade=t=out:st=53.95:d=0.55:alpha=1[bottom2];\
            [l7]fade=t=in:st=53.60:d=0.40:alpha=1,fade=t=out:st=62.95:d=0.55:alpha=1[top3];\
            [l8]fade=t=in:st=62.60:d=0.40:alpha=1,fade=t=out:st=71.95:d=0.55:alpha=1[bottom3];\
            [l9]fade=t=in:st=71.60:d=0.40:alpha=1,fade=t=out:st=${SMALL_FADE_START}:d=1.00:alpha=1[top4];\
            \
            [base][top0]overlay=x=${LOGO_TOP_X}:y=${LOGO_TOP_Y}:enable='between(t,0,9.5)'[v1];\
            [v1][bottom0]overlay=x=${LOGO_BOTTOM_X}:y=${LOGO_BOTTOM_Y}:enable='between(t,8.6,18.5)'[v2];\
            [v2][top1]overlay=x=${LOGO_TOP_X}:y=${LOGO_TOP_Y}:enable='between(t,17.6,27.5)'[v3];\
            [v3][bottom1]overlay=x=${LOGO_BOTTOM_X}:y=${LOGO_BOTTOM_Y}:enable='between(t,26.6,36.5)'[v4];\
            [v4][top2]overlay=x=${LOGO_TOP_X}:y=${LOGO_TOP_Y}:enable='between(t,35.6,45.5)'[v5];\
            [v5][bottom2]overlay=x=${LOGO_BOTTOM_X}:y=${LOGO_BOTTOM_Y}:enable='between(t,44.6,54.5)'[v6];\
            [v6][top3]overlay=x=${LOGO_TOP_X}:y=${LOGO_TOP_Y}:enable='between(t,53.6,63.5)'[v7];\
            [v7][bottom3]overlay=x=${LOGO_BOTTOM_X}:y=${LOGO_BOTTOM_Y}:enable='between(t,62.6,72.5)'[v8];\
            [v8][top4]overlay=x=${LOGO_TOP_X}:y=${LOGO_TOP_Y}:enable='between(t,71.6,${SMALL_FADE_END})'[corners];\
            \
            [2:v]scale=540:540,format=rgba,fade=t=in:st=${FINAL_START}:d=1.0:alpha=1[final_logo];\
            [corners][final_logo]overlay=x=(W-w)/2:y=(H-h)/2:enable='gte(t,${FINAL_START})'[clean]" \
            -map "[clean]" \
            -map 0:a? \
            -t "$DURATION" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -c:a aac \
            -b:a 128k \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/clean_master.mp4


      # =========================================================
      # VALIDAR STAGE 01
      # =========================================================

      - name: Validar Stage 01
        shell: bash

        run: |
          set -e

          test -s output/clean_master.mp4

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            output/clean_master.mp4)

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            output/clean_master.mp4)

          if [ "$WIDTH" != "1080" ] || [ "$HEIGHT" != "1920" ]; then

            echo "ERRO: Stage 01 fora de 1080x1920."

            exit 1

          fi

          echo "STAGE 01 VALIDADO."


      # =========================================================
      # STAGE 02 - EDITORIAL MASTER
      # =========================================================

      - name: Stage 02 - Criar Editorial Master
        shell: bash

        run: |
          set -e

          ffmpeg -y \
            -i output/clean_master.mp4 \
            -map 0:v:0 \
            -an \
            -vf "fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -movflags +faststart \
            output/editorial_master.mp4


      - name: Validar Stage 02
        shell: bash

        run: |
          set -e

          test -s output/editorial_master.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=codec_type,codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            output/editorial_master.mp4 \
            | tee output/editorial_report.txt

          AUDIO_COUNT=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            output/editorial_master.mp4 \
            | wc -l)

          if [ "$AUDIO_COUNT" -ne 0 ]; then

            echo "ERRO: Stage 02 ainda possui audio."

            exit 1

          fi

          echo "STAGE 02 VALIDADO."


      # =========================================================
      # STAGE 03 - DETECCAO DE CENAS
      # =========================================================

      - name: Stage 03 - Detectar Cenas
        shell: bash

        run: |
          set -e

          ffmpeg \
            -hide_banner \
            -i output/editorial_master.mp4 \
            -vf "select='gt(scene,0.32)',showinfo" \
            -an \
            -f null - \
            2> output/scene_detection_raw.txt || true

          grep "showinfo" \
            output/scene_detection_raw.txt \
            | grep "pts_time:" \
            | sed -n 's/.*pts_time:\([^ ]*\).*/\1/p' \
            > output/scene_times.txt || true

          echo "0.000000" > output/scene_report.txt

          if [ -s output/scene_times.txt ]; then
            cat output/scene_times.txt >> output/scene_report.txt
          fi

          echo "$DURATION" >> output/scene_report.txt

          awk '!seen[$0]++' \
            output/scene_report.txt \
            > output/scene_report_unique.txt

          mv \
            output/scene_report_unique.txt \
            output/scene_report.txt

          cat output/scene_report.txt


      # =========================================================
      # STAGE 03 - PREVIEWS
      # =========================================================

      - name: Stage 03 - Gerar Previews
        shell: bash

        run: |
          set -e

          mkdir -p output/scenes

          INDEX=1

          while read TIME; do

            if [ -z "$TIME" ]; then
              continue
            fi

            printf -v NUMBER "%03d" "$INDEX"

            ffmpeg -y \
              -ss "$TIME" \
              -i output/editorial_master.mp4 \
              -frames:v 1 \
              -vf "scale=360:-2" \
              -q:v 3 \
              "output/scenes/scene_${NUMBER}_${TIME}s.jpg" \
              >/dev/null 2>&1 || true

            INDEX=$((INDEX + 1))

          done < output/scene_report.txt


      # =========================================================
      # STAGE 04 - SCENE CUTTER
      # =========================================================

      - name: Stage 04 - Criar Clips de Cena
        shell: bash

        run: |
          set -e

          mkdir -p output/stage04_clips

          mapfile -t TIMES < output/scene_report.txt

          TOTAL_POINTS=${#TIMES[@]}

          if [ "$TOTAL_POINTS" -lt 2 ]; then

            echo "ERRO: pontos insuficientes para cortar cenas."

            exit 1

          fi

          echo "scene,start,end,duration,file" > output/edit_plan.csv
          echo "PARECE MENTIRA - EDIT PLAN" > output/edit_plan.txt

          CREATED=0

          for ((i=0; i<TOTAL_POINTS-1; i++)); do

            START="${TIMES[$i]}"
            END="${TIMES[$((i+1))]}"

            CLIP_DURATION=$(awk \
              -v start="$START" \
              -v end="$END" \
              'BEGIN { printf "%.6f", end-start }')

            VALID=$(awk \
              -v d="$CLIP_DURATION" \
              'BEGIN { if (d > 0.01) print 1; else print 0 }')

            if [ "$VALID" != "1" ]; then
              continue
            fi

            CREATED=$((CREATED + 1))

            printf -v NUMBER "%03d" "$CREATED"

            OUTPUT_FILE="output/stage04_clips/scene_${NUMBER}.mp4"

            ffmpeg -y \
              -ss "$START" \
              -i output/editorial_master.mp4 \
              -t "$CLIP_DURATION" \
              -map 0:v:0 \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -crf 20 \
              -pix_fmt yuv420p \
              -movflags +faststart \
              "$OUTPUT_FILE"

            echo "${NUMBER},${START},${END},${CLIP_DURATION},scene_${NUMBER}.mp4" \
              >> output/edit_plan.csv

            {
              echo ""
              echo "CENA $NUMBER"
              echo "Inicio: $START s"
              echo "Fim: $END s"
              echo "Duracao: $CLIP_DURATION s"
              echo "Arquivo: scene_${NUMBER}.mp4"

            } >> output/edit_plan.txt

          done

          if [ "$CREATED" -lt 1 ]; then

            echo "ERRO: nenhuma cena foi criada."

            exit 1

          fi

          echo "STAGE 04 OK - Cenas: $CREATED"


      # =========================================================
      # STAGE 05 - WHISPER
      # =========================================================

      - name: Stage 05 - Instalar Whisper
        shell: bash

        run: |
          set -e

          python3 -m pip install --upgrade pip
          python3 -m pip install faster-whisper pillow


      - name: Stage 05 - Detectar Audio
        shell: bash

        run: |
          set -e

          mkdir -p output/stage05

          AUDIO_COUNT=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            output/clean_master.mp4 \
            | wc -l)

          if [ "$AUDIO_COUNT" -gt 0 ]; then

            echo "HAS_AUDIO=1" >> "$GITHUB_ENV"

            ffmpeg -y \
              -i output/clean_master.mp4 \
              -vn \
              -ac 1 \
              -ar 16000 \
              -c:a pcm_s16le \
              output/stage05/audio_whisper.wav

          else

            echo "HAS_AUDIO=0" >> "$GITHUB_ENV"

            ffmpeg -y \
              -f lavfi \
              -i anullsrc=r=16000:cl=mono \
              -t 1 \
              -c:a pcm_s16le \
              output/stage05/audio_whisper.wav

          fi

          test -s output/stage05/audio_whisper.wav


      - name: Stage 05 - Transcrever quando houver fala
        shell: bash

        run: |
          set -e

          cat > /tmp/transcribe_v15.py <<'PY'
          import json
          import os
          from pathlib import Path

          has_audio = os.getenv(
              "HAS_AUDIO",
              "0"
          ) == "1"

          out_json = Path(
              "output/stage05/transcript.json"
          )

          out_txt = Path(
              "output/stage05/transcript.txt"
          )

          if not has_audio:

              result = {
                  "language": None,
                  "language_probability": 0,
                  "segments": []
              }

              out_json.write_text(
                  json.dumps(
                      result,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              out_txt.write_text(
                  "",
                  encoding="utf-8"
              )

              print(
                  "Video sem audio: transcricao vazia criada."
              )

              raise SystemExit(0)


          from faster_whisper import WhisperModel

          model = WhisperModel(
              "small",
              device="cpu",
              compute_type="int8"
          )

          segments, info = model.transcribe(
              "output/stage05/audio_whisper.wav",
              language=None,
              task="transcribe",
              beam_size=5,
              vad_filter=True,
              word_timestamps=True
          )

          result = {
              "language":
                  info.language,

              "language_probability":
                  info.language_probability,

              "segments":
                  []
          }

          full_text = []

          for segment in segments:

              item = {
                  "start":
                      round(
                          segment.start,
                          3
                      ),

                  "end":
                      round(
                          segment.end,
                          3
                      ),

                  "text":
                      segment.text.strip(),

                  "words":
                      []
              }

              if segment.words:

                  for word in segment.words:

                      item[
                          "words"
                      ].append({
                          "start":
                              round(
                                  word.start,
                                  3
                              )
                              if word.start is not None
                              else None,

                          "end":
                              round(
                                  word.end,
                                  3
                              )
                              if word.end is not None
                              else None,

                          "word":
                              word.word
                      })

              result[
                  "segments"
              ].append(
                  item
              )

              if segment.text.strip():

                  full_text.append(
                      segment.text.strip()
                  )

          out_json.write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          out_txt.write_text(
              "\n".join(
                  full_text
              ),
              encoding="utf-8"
          )

          print(
              "Transcricao concluida."
          )
          PY

          python3 /tmp/transcribe_v15.py

          test -s output/stage05/transcript.json
          test -f output/stage05/transcript.txt


      - name: Stage 05 - Criar Manifesto de Cenas
        shell: bash

        run: |
          set -e

          cat > /tmp/build_manifest_v15.py <<'PY'
          import csv
          import json
          from pathlib import Path

          transcript = json.loads(
              Path(
                  "output/stage05/transcript.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          segments = transcript.get(
              "segments",
              []
          )

          scenes = []

          with open(
              "output/edit_plan.csv",
              "r",
              encoding="utf-8"
          ) as f:

              reader = csv.DictReader(f)

              for row in reader:

                  start = float(
                      row["start"]
                  )

                  end = float(
                      row["end"]
                  )

                  scene_segments = []

                  for seg in segments:

                      midpoint = (
                          float(seg["start"]) +
                          float(seg["end"])
                      ) / 2

                      if start <= midpoint < end:

                          scene_segments.append(
                              seg
                          )

                  scene_text = " ".join(
                      s["text"].strip()
                      for s in scene_segments
                      if s.get(
                          "text",
                          ""
                      ).strip()
                  ).strip()

                  scenes.append({
                      "scene":
                          int(
                              row["scene"]
                          ),

                      "start":
                          start,

                      "end":
                          end,

                      "duration":
                          float(
                              row["duration"]
                          ),

                      "file":
                          row["file"],

                      "transcript":
                          scene_text,

                      "segments":
                          scene_segments
                  })


          Path(
              "output/stage05/scene_manifest.json"
          ).write_text(
              json.dumps(
                  scenes,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )


          with open(
              "output/stage05/scene_manifest.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for scene in scenes:

                  f.write(
                      f"CENA {scene['scene']:03d}\n"
                      f"Inicio: {scene['start']:.3f}s\n"
                      f"Fim: {scene['end']:.3f}s\n"
                      f"Duracao: {scene['duration']:.3f}s\n"
                      f"Fala: {scene['transcript'] or '[sem fala]'}\n"
                      "----------------------------------------\n"
                  )

          print(
              f"Manifesto criado: {len(scenes)} cenas"
          )
