            output/stage08/narration_raw.mp3


          if edge-tts \
            --voice pt-BR-AntonioNeural \
            --rate="-3%" \
            --text "$TEXT" \
            --write-media output/stage08/narration_raw.mp3; then

            if [ -s output/stage08/narration_raw.mp3 ]; then

              echo "edge-tts" \
                > output/stage08/tts_engine.txt

            fi

          fi


          if [ ! -s output/stage08/narration_raw.mp3 ]; then

            python3 - <<'PY'
          from gtts import gTTS
          from pathlib import Path

          text = Path(
              "output/stage08/narration.txt"
          ).read_text(
              encoding="utf-8"
          )

          try:

              gTTS(
                  text=text,
                  lang="pt",
                  tld="com.br",
                  slow=False
              ).save(
                  "output/stage08/narration_raw.mp3"
              )

          except Exception as exc:

              print(exc)
          PY


            if [ -s output/stage08/narration_raw.mp3 ]; then

              echo "gTTS" \
                > output/stage08/tts_engine.txt

            fi

          fi


          if [ ! -s output/stage08/narration_raw.mp3 ]; then

            espeak-ng \
              -v pt-br \
              -s 158 \
              -f output/stage08/narration.txt \
              -w output/stage08/narration_fallback.wav


            ffmpeg -y \
              -i output/stage08/narration_fallback.wav \
              -c:a libmp3lame \
              -b:a 160k \
              output/stage08/narration_raw.mp3


            echo "espeak-ng" \
              > output/stage08/tts_engine.txt

          fi


          test -s output/stage08/narration_raw.mp3


      # =========================================================
      # FIT GLOBAL
      # =========================================================

      - name: Stage 08 - Ajustar Voz ao Master Visual
        shell: bash

        env:
          USER_TEMPO: ${{ inputs.tempo }}

        run: |
          set -e


          if [ -f output/stage08/no_narration.flag ]; then

            cp \
              output/stage07/ai_visual_master.mp4 \
              output/stage08/final_ai_director.mp4

            exit 0

          fi


          VIDEO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/stage07/ai_visual_master.mp4)


          AUDIO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/stage08/narration_raw.mp3)


          RATIO=$(awk \
            -v a="$AUDIO_DURATION" \
            -v v="$VIDEO_DURATION" \
            'BEGIN { printf "%.6f", a/v }')


          TEMPO=$(awk \
            -v r="$RATIO" '
            BEGIN {
              if (r <= 1.00) t=1.00;
              else if (r <= 1.15) t=r;
              else t=1.15;
              printf "%.6f", t
            }')


          ffmpeg -y \
            -i output/stage08/narration_raw.mp3 \
            -filter:a "atempo=${TEMPO},volume=1.05" \
            -c:a aac \
            -b:a 160k \
            output/stage08/narration_master.m4a


          FITTED_AUDIO=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/stage08/narration_master.m4a)


          TOO_LONG=$(awk \
            -v a="$FITTED_AUDIO" \
            -v v="$VIDEO_DURATION" \
            'BEGIN {
              if (a > v + 0.35)
                print 1;
              else
                print 0
            }')


          if [ "$TOO_LONG" = "1" ]; then


            if [ "$USER_TEMPO" = "SHORT_CURTO" ]; then

              echo "ERRO: narracao maior que SHORT_CURTO."

              exit 1


            else


              SOURCE_DURATION=$(ffprobe \
                -v error \
                -show_entries format=duration \
                -of default=noprint_wrappers=1:nokey=1 \
                output/editorial_master.mp4)


              CAN_FIT=$(awk \
                -v a="$FITTED_AUDIO" \
                -v s="$SOURCE_DURATION" \
                'BEGIN {
                  if (a <= s + 0.35)
                    print 1;
                  else
                    print 0
                }')


              if [ "$CAN_FIT" = "1" ]; then


                cp \
                  output/editorial_master.mp4 \
                  output/stage07/ai_visual_master_fallback.mp4


                if [ "$USER_TEMPO" = "PRESERVAR" ]; then

                  VIDEO_DURATION="$SOURCE_DURATION"

                else

                  VIDEO_DURATION="$FITTED_AUDIO"

                fi


              else

                echo "ERRO: fonte nao comporta narracao."

                exit 1

              fi

            fi

          fi


          VISUAL_INPUT="output/stage07/ai_visual_master.mp4"


          if [ -s output/stage07/ai_visual_master_fallback.mp4 ]; then

            VISUAL_INPUT="output/stage07/ai_visual_master_fallback.mp4"

          fi


          ffmpeg -y \
            -i "$VISUAL_INPUT" \
            -i output/stage08/narration_master.m4a \
            -filter_complex "[1:a]apad[aout]" \
            -map 0:v:0 \
            -map "[aout]" \
            -c:v copy \
            -c:a aac \
            -b:a 160k \
            -t "$VIDEO_DURATION" \
            -movflags +faststart \
            output/stage08/final_ai_director.mp4


          test -s output/stage08/final_ai_director.mp4


      # =========================================================
      # VALIDAR TEMPO FINAL
      # =========================================================

      - name: Stage 08 - Validar Tempo Final
        shell: bash

        env:
          USER_TEMPO: ${{ inputs.tempo }}

        run: |
          set -e


          FINAL_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/stage08/final_ai_director.mp4)


          if [ "$USER_TEMPO" = "PRESERVAR" ]; then


            MIN_ALLOWED=$(awk \
              -v d="$DURATION" \
              'BEGIN {
                printf "%.3f", d*0.90
              }')


            INVALID=$(awk \
              -v f="$FINAL_DURATION" \
              -v min="$MIN_ALLOWED" \
              -v max="$DURATION" \
              'BEGIN {
                if (f < min-0.35 || f > max+0.35)
                  print 1;
                else
                  print 0
              }')


            if [ "$INVALID" = "1" ]; then

              echo "ERRO: final fora de 90-100%."

              exit 1

            fi


          elif [ "$USER_TEMPO" = "SHORT_CURTO" ]; then


            MIN_ALLOWED=$(awk \
              -v d="$DURATION" \
              'BEGIN {
                if (d<10) print d;
                else print 10
              }')


            MAX_ALLOWED=$(awk \
              -v d="$DURATION" \
              'BEGIN {
                if (d<20) print d;
                else print 20
              }')


            INVALID=$(awk \
              -v f="$FINAL_DURATION" \
              -v min="$MIN_ALLOWED" \
              -v max="$MAX_ALLOWED" \
              'BEGIN {
                if (f < min-0.35 || f > max+0.35)
                  print 1;
                else
                  print 0
              }')


            if [ "$INVALID" = "1" ]; then

              echo "ERRO: Short fora da faixa."

              exit 1

            fi

          fi


          echo "TEMPO FINAL VALIDADO."


      # =========================================================
      # STAGE 09 - POLISH
      # =========================================================

      - name: Stage 09 - Aplicar Acabamento Visual
        shell: bash

        run: |
          set -e

          mkdir -p output/stage09

          INPUT="output/stage08/final_ai_director.mp4"

          OUTPUT="output/stage09/final_visual_polish.mp4"

          test -s "$INPUT"


          AUDIO_COUNT=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            "$INPUT" \
            | wc -l)


          if [ "$AUDIO_COUNT" -gt 0 ]; then


            ffmpeg -y \
              -i "$INPUT" \
              -map 0:v:0 \
              -map 0:a:0 \
              -vf "\
                eq=contrast=1.025:brightness=0.003:saturation=1.035,\
                unsharp=3:3:0.22:3:3:0.0,\
                format=yuv420p" \
              -c:v libx264 \
              -preset veryfast \
              -crf 19 \
              -c:a copy \
              -movflags +faststart \
              "$OUTPUT"


          else


            ffmpeg -y \
              -i "$INPUT" \
              -map 0:v:0 \
              -an \
              -vf "\
                eq=contrast=1.025:brightness=0.003:saturation=1.035,\
                unsharp=3:3:0.22:3:3:0.0,\
                format=yuv420p" \
              -c:v libx264 \
              -preset veryfast \
              -crf 19 \
              -movflags +faststart \
              "$OUTPUT"


          fi


          test -s "$OUTPUT"


      - name: Stage 09 - Validar Acabamento Visual
        shell: bash

        run: |
          set -e

          INPUT="output/stage08/final_ai_director.mp4"

          OUTPUT="output/stage09/final_visual_polish.mp4"


          IN_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$INPUT")


          OUT_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$OUTPUT")


          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            "$OUTPUT")


          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            "$OUTPUT")


          DURATION_DIFF=$(awk \
            -v a="$IN_DURATION" \
            -v b="$OUT_DURATION" \
            'BEGIN {
              d=a-b;
              if (d<0) d=-d;
              print d
            }')


          BAD=$(awk \
            -v d="$DURATION_DIFF" \
            'BEGIN {
              if (d>0.10)
                print 1;
              else
                print 0
            }')


          if [ "$WIDTH" != "1080" ] || [ "$HEIGHT" != "1920" ]; then

            exit 1

          fi


          if [ "$BAD" = "1" ]; then

            exit 1

          fi


          echo "STAGE 09 VALIDADO."


      - name: Disponibilizar Stage 09 Acabamento Visual
        uses: actions/upload-artifact@v4

        with:
          name: stage-09-visual-polish

          path: |
            output/stage09/final_visual_polish.mp4

          retention-days: 7

          if-no-files-found: error


      # =========================================================
      # STAGE 10 - QA
      # =========================================================

      - name: Stage 10 - Executar QA Tecnico
        shell: bash

        run: |
          set -e

          mkdir -p output/stage10

          INPUT="output/stage09/final_visual_polish.mp4"

          REFERENCE="output/stage08/final_ai_director.mp4"

          REPORT="output/stage10/qa_report.txt"

          : > "$REPORT"


          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            "$INPUT")


          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            "$INPUT")


          CODEC=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name \
            -of csv=p=0 \
            "$INPUT")


          PIX_FMT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=pix_fmt \
            -of csv=p=0 \
            "$INPUT")


          FPS_RAW=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=avg_frame_rate \
            -of csv=p=0 \
            "$INPUT")


          FPS=$(awk \
            -v r="$FPS_RAW" \
            'BEGIN {
              split(r,a,"/");
              if (a[2]==0 || a[2]=="")
                print 0;
              else
                printf "%.3f",a[1]/a[2]
            }')


          DURATION_FINAL=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$INPUT")


          REF_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$REFERENCE")


          SIZE_BYTES=$(stat -c%s "$INPUT")


          AUDIO_COUNT=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            "$INPUT" \
            | wc -l)


          echo "PARECE MENTIRA - QA" | tee -a "$REPORT"
          echo "Resolucao: ${WIDTH}x${HEIGHT}" | tee -a "$REPORT"
          echo "Codec: $CODEC" | tee -a "$REPORT"
          echo "Pixel: $PIX_FMT" | tee -a "$REPORT"
          echo "FPS: $FPS" | tee -a "$REPORT"
          echo "Duracao: $DURATION_FINAL" | tee -a "$REPORT"
          echo "Logo: ${{ inputs.logo_posicao }}" | tee -a "$REPORT"


          if [ "$WIDTH" != "1080" ] || [ "$HEIGHT" != "1920" ]; then

            exit 1

          fi


          if [ "$CODEC" != "h264" ]; then

            exit 1

          fi


          if [ "$PIX_FMT" != "yuv420p" ]; then

            exit 1

          fi


          FPS_BAD=$(awk \
            -v f="$FPS" \
            'BEGIN {
              if (f<29 || f>31)
                print 1;
              else
                print 0
            }')


          if [ "$FPS_BAD" = "1" ]; then

            exit 1

          fi


          DUR_DIFF=$(awk \
            -v a="$DURATION_FINAL" \
            -v b="$REF_DURATION" \
            'BEGIN {
              d=a-b;
              if(d<0)d=-d;
              print d
            }')


          DUR_BAD=$(awk \
            -v d="$DUR_DIFF" \
            'BEGIN {
              if(d>0.12)
                print 1;
              else
                print 0
            }')


          if [ "$DUR_BAD" = "1" ]; then

            exit 1

          fi


          if [ "$SIZE_BYTES" -lt 500000 ]; then

            exit 1

          fi


          ffmpeg \
            -v error \
            -i "$INPUT" \
            -f null - \
            2> output/stage10/decode_errors.txt || true


          if [ -s output/stage10/decode_errors.txt ]; then

            exit 1

          fi


          if [ -f output/stage08/no_narration.flag ]; then

            EXPECT_AUDIO=0

          else

            EXPECT_AUDIO=1

          fi


          if [ "$EXPECT_AUDIO" = "1" ] && [ "$AUDIO_COUNT" -lt 1 ]; then

            exit 1

          fi


          ffmpeg \
            -hide_banner \
            -i "$INPUT" \
            -vf "freezedetect=n=-55dB:d=2.5" \
            -an \
            -f null - \
            2> output/stage10/freezedetect_raw.txt || true


          grep -E "freeze_(start|duration|end)" \
            output/stage10/freezedetect_raw.txt \
            > output/stage10/freezes.txt || true


          ffmpeg \
            -hide_banner \
            -i "$INPUT" \
            -vf "blackdetect=d=1.0:pix_th=0.10" \
            -an \
            -f null - \
            2> output/stage10/blackdetect_raw.txt || true


          grep "black_start" \
            output/stage10/blackdetect_raw.txt \
            > output/stage10/black_frames.txt || true


          if [ "$AUDIO_COUNT" -gt 0 ]; then

            ffmpeg \
              -hide_banner \
              -i "$INPUT" \
              -map 0:a:0 \
              -af "silencedetect=noise=-45dB:d=2.0" \
              -f null - \
              2> output/stage10/silencedetect_raw.txt || true


            grep -E "silence_(start|end|duration)" \
              output/stage10/silencedetect_raw.txt \
              > output/stage10/silences.txt || true


          else

            : > output/stage10/silences.txt

          fi


          cp \
            "$INPUT" \
            output/stage10/final_master.mp4


          test -s output/stage10/final_master.mp4


          echo "RESULTADO: APROVADO" \
            | tee -a "$REPORT"


      # =========================================================
      # QA JSON
      # =========================================================

      - name: Stage 10 - Criar Relatorio JSON
        shell: bash

        env:
          USER_TEMPO: ${{ inputs.tempo }}
          LOGO_POSITION: ${{ inputs.logo_posicao }}

        run: |
          set -e


          python3 - <<'PY'
          import json
          import os
          import subprocess

          from pathlib import Path


          video = Path(
              "output/stage10/final_master.mp4"
          )


          def probe(args):

              return subprocess.check_output(
                  args,
                  text=True
              ).strip()


          duration = float(
              probe([
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  str(video)
              ])
          )


          width = int(
              probe([
                  "ffprobe",
                  "-v",
                  "error",
                  "-select_streams",
                  "v:0",
                  "-show_entries",
                  "stream=width",
                  "-of",
                  "csv=p=0",
                  str(video)
              ])
          )


          height = int(
              probe([
                  "ffprobe",
                  "-v",
                  "error",
                  "-select_streams",
                  "v:0",
                  "-show_entries",
                  "stream=height",
                  "-of",
                  "csv=p=0",
                  str(video)
              ])
          )


          report = {
              "status":
                  "APROVADO",

              "master":
                  "final_master.mp4",

              "resolution": {
                  "width":
                      width,

                  "height":
                      height
              },

              "duration_seconds":
                  round(
                      duration,
                      3
                  ),

              "tempo_mode":
                  os.getenv(
                      "USER_TEMPO",
                      "AUTO"
                  ),

              "logo_position":
                  os.getenv(
                      "LOGO_POSITION",
                      "NORMAL"
                  ),

              "music":
                  False,

              "visual_polish":
                  True,

              "narration_preserved":
                  True
          }


          Path(
              "output/stage10/qa_report.json"
          ).write_text(
              json.dumps(
                  report,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )
          PY


          test -s output/stage10/qa_report.json


      # =========================================================
      # STAGE 10 ARTIFACT
      # =========================================================

      - name: Disponibilizar Stage 10 QA e Master Final
        uses: actions/upload-artifact@v4

        with:
          name: stage-10-final-master-qa

          path: |
            output/stage10/final_master.mp4
            output/stage10/qa_report.txt
            output/stage10/qa_report.json
            output/stage10/decode_errors.txt
            output/stage10/freezes.txt
            output/stage10/black_frames.txt
            output/stage10/silences.txt

          retention-days: 7

          if-no-files-found: error


      # =========================================================
      # APP - PUBLICAR RESULTADO
      # =========================================================

      - name: App - Publicar master final
        if: ${{ success() && inputs.app_job_tag != '' }}
        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}
          APP_JOB_TAG: ${{ inputs.app_job_tag }}

        run: |
          set -e


          test -s output/stage10/final_master.mp4

          test -s output/stage10/qa_report.json


          gh release upload "$APP_JOB_TAG" \
            "output/stage10/final_master.mp4#final_master.mp4" \
            "output/stage10/qa_report.json#qa_report.json" \
            --repo "${{ github.repository }}" \
            --clobber


      - name: App - Publicar marcador de falha
        if: ${{ failure() && inputs.app_job_tag != '' }}
        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}
          APP_JOB_TAG: ${{ inputs.app_job_tag }}

        run: |
          set +e


          mkdir -p output/app_status


          cat > output/app_status/job_failed.json <<EOF
          {
            "status": "ERRO",
            "job_tag": "${APP_JOB_TAG}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "tempo": "${{ inputs.tempo }}",
            "logo_posicao": "${{ inputs.logo_posicao }}"
          }
          EOF


          gh release upload "$APP_JOB_TAG" \
            "output/app_status/job_failed.json#job_failed.json" \
            --repo "${{ github.repository }}" \
            --clobber || true


      # =========================================================
      # VALIDACAO FINAL
      # =========================================================

      - name: Validar V15.25 Logo Control
        shell: bash

        run: |
          set -e


          test -s output/stage08/final_ai_director.mp4

          test -s output/stage09/final_visual_polish.mp4

          test -s output/stage10/final_master.mp4

          test -s output/stage06_ai/director_plan.json


          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            output/stage10/final_master.mp4)


          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            output/stage10/final_master.mp4)


          FINAL_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/stage10/final_master.mp4)


          if [ "$WIDTH" != "1080" ] || [ "$HEIGHT" != "1920" ]; then

            exit 1

          fi


          echo "========================================"
          echo "V15.25 LOGO CONTROL VALIDADO"
          echo "Tempo: ${{ inputs.tempo }}"
          echo "Logo: ${{ inputs.logo_posicao }}"
          echo "Original: $DURATION s"
          echo "Final: $FINAL_DURATION s"
          echo "Logo NORMAL: suportado"
          echo "Logo LATERAL +40 px: suportado"
          echo "Logo VERTICAL +30 px: suportado"
          echo "Logo LATERAL_VERTICAL: suportado"
          echo "Logo final central: preservada"
          echo "Traducao PT-BR: preservada"
          echo "Legenda original: preservada"
          echo "Trilha sonora: desativada"
          echo "========================================"


      # =========================================================
      # ARTIFACTS
      # =========================================================

      - name: Disponibilizar Stage 01
        uses: actions/upload-artifact@v4

        with:
          name: stage-01-clean-master

          path:
            output/clean_master.mp4

          retention-days: 7

          if-no-files-found: error


      - name: Disponibilizar Stage 03-05
        uses: actions/upload-artifact@v4

        with:
          name: stage-05-understanding

          path: |
            output/scene_report.txt
            output/edit_plan.csv
            output/stage05/transcript.txt
            output/stage05/transcript.json
            output/stage05/scene_manifest.json
            output/stage05/scene_manifest.txt

          retention-days: 7

          if-no-files-found: error


      - name: Disponibilizar Vision Pack
        uses: actions/upload-artifact@v4

        with:
          name: stage-06-vision-pack

          path: |
            output/stage06_vision/sheets/*.jpg

          retention-days: 7

          if-no-files-found: error


      - name: Disponibilizar AI Director
        uses: actions/upload-artifact@v4

        with:
          name: stage-06-gemini-ai-director

          path: |
            output/stage06_ai/director_plan.json
            output/stage06_ai/director_raw.txt
            output/stage06_ai/provider.txt

          retention-days: 7

          if-no-files-found: error


      - name: Disponibilizar Incremento
        uses: actions/upload-artifact@v4

        with:
          name: stage-07-ai-increment

          path: |
            output/stage07/increment_base.png
            output/stage07/increment.mp4
            output/stage07/increment_none.txt

          retention-days: 7

          if-no-files-found: warn


      - name: Disponibilizar Final V15.25
        uses: actions/upload-artifact@v4

        with:
          name: stage-08-final

          path: |
