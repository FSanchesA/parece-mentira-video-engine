      - name: Stage 07 - Criar Incremento do Diretor
        shell: bash

        run: |
          set -e

          mkdir -p output/stage07

          cat > /tmp/build_increment_v15.py <<'PY'
          import io
          import json
          import subprocess
          import requests

          from pathlib import Path

          from PIL import (
              Image,
              ImageDraw,
              ImageFont
          )


          plan = json.loads(
              Path(
                  "output/stage06_ai/director_plan.json"
              ).read_text(
                  encoding="utf-8"
              )
          )


          inc = plan.get(
              "increment",
              {}
          ) or {}


          inc_type = inc.get(
              "type",
              "none"
          )


          duration = max(
              float(
                  inc.get(
                      "duration",
                      0
                  )
                  or
                  0
              ),
              0
          )


          if (
              inc_type == "none"
              or
              duration <= 0
          ):

              Path(
                  "output/stage07/increment_none.txt"
              ).write_text(
                  "Sem incremento.",
                  encoding="utf-8"
              )

              raise SystemExit(0)


          width = 1080
          height = 1920


          def font(size):

              paths = [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
              ]

              for p in paths:

                  if Path(p).exists():

                      return ImageFont.truetype(
                          p,
                          size=size
                      )

              return ImageFont.load_default()


          title_font = font(48)
          body_font = font(34)
          small_font = font(27)


          if inc_type == "map":

              points = inc.get(
                  "points",
                  []
              )


              if not points:

                  raise RuntimeError(
                      "Map sem points."
                  )


              center_lat = sum(
                  float(
                      p["lat"]
                  )
                  for p in points
              ) / len(points)


              center_lon = sum(
                  float(
                      p["lon"]
                  )
                  for p in points
              ) / len(points)


              zoom = (
                  8
                  if len(points) > 1
                  else 10
              )


              url = (
                  "https://staticmap.openstreetmap.de/staticmap.php"
                  f"?center={center_lat},{center_lon}"
                  f"&zoom={zoom}"
                  f"&size={width}x{height}"
                  "&maptype=mapnik"
              )


              img = None


              try:

                  r = requests.get(
                      url,
                      timeout=25,
                      headers={
                          "User-Agent":
                              "PareceMentiraVideoEngine/1.0"
                      }
                  )

                  r.raise_for_status()

                  candidate = Image.open(
                      io.BytesIO(
                          r.content
                      )
                  ).convert(
                      "RGB"
                  )


                  if candidate.size == (
                      width,
                      height
                  ):

                      img = candidate


              except Exception:

                  pass


              if img is None:

                  img = Image.new(
                      "RGB",
                      (
                          width,
                          height
                      ),
                      (
                          18,
                          37,
                          48
                      )
                  )


              draw = ImageDraw.Draw(
                  img,
                  "RGBA"
              )


              draw.rounded_rectangle(
                  (
                      55,
                      70,
                      width - 55,
                      260
                  ),
                  radius=30,
                  fill=(
                      0,
                      0,
                      0,
                      180
                  )
              )


              draw.text(
                  (
                      90,
                      100
                  ),
                  str(
                      inc.get(
                          "title",
                          "MAPA"
                      )
                  ),
                  font=title_font,
                  fill="white"
              )


              draw.text(
                  (
                      90,
                      170
                  ),
                  str(
                      inc.get(
                          "subtitle",
                          ""
                      )
                  ),
                  font=body_font,
                  fill=(
                      255,
                      255,
                      255,
                      225
                  )
              )


              y = height - 350


              draw.rounded_rectangle(
                  (
                      70,
                      y - 30,
                      width - 70,
                      height - 100
                  ),
                  radius=28,
                  fill=(
                      0,
                      0,
                      0,
                      170
                  )
              )


              labels = "  •  ".join(
                  str(
                      p.get(
                          "label",
                          ""
                      )
                  )
                  for p in points
                  if p.get(
                      "label"
                  )
              )


              draw.text(
                  (
                      105,
                      y + 15
                  ),
                  labels[:70],
                  font=small_font,
                  fill="white"
              )


              draw.text(
                  (
                      105,
                      y + 75
                  ),
                  "© OpenStreetMap contributors",
                  font=small_font,
                  fill=(
                      255,
                      255,
                      255,
                      190
                  )
              )


              img.save(
                  "output/stage07/increment_base.png",
                  "PNG"
              )


          elif inc_type == "fact_card":

              img = Image.new(
                  "RGB",
                  (
                      width,
                      height
                  ),
                  (
                      18,
                      37,
                      48
                  )
              )


              draw = ImageDraw.Draw(
                  img,
                  "RGBA"
              )


              draw.rounded_rectangle(
                  (
                      70,
                      300,
                      width - 70,
                      1580
                  ),
                  radius=50,
                  fill=(
                      0,
                      0,
                      0,
                      105
                  )
              )


              draw.text(
                  (
                      110,
                      390
                  ),
                  str(
                      inc.get(
                          "title",
                          "VOCÊ SABIA?"
                      )
                  ),
                  font=title_font,
                  fill="white"
              )


              subtitle = str(
                  inc.get(
                      "subtitle",
                      ""
                  )
              ).strip()


              words = subtitle.split()

              lines = []

              current = []


              for word in words:

                  test = " ".join(
                      current +
                      [word]
                  )


                  if (
                      len(test) > 36
                      and
                      current
                  ):

                      lines.append(
                          " ".join(
                              current
                          )
                      )

                      current = [
                          word
                      ]

                  else:

                      current.append(
                          word
                      )


              if current:

                  lines.append(
                      " ".join(
                          current
                      )
                  )


              y = 540


              for line in lines[:8]:

                  draw.text(
                      (
                          110,
                          y
                      ),
                      line,
                      font=body_font,
                      fill=(
                          255,
                          255,
                          255,
                          235
                      )
                  )

                  y += 70


              img.save(
                  "output/stage07/increment_base.png",
                  "PNG"
              )


          else:

              raise RuntimeError(
                  f"Incremento invalido: {inc_type}"
              )


          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-loop",
                  "1",
                  "-framerate",
                  "30",
                  "-i",
                  "output/stage07/increment_base.png",
                  "-vf",
                  (
                      "scale=1080:1920,"
                      "zoompan="
                      "z='min(zoom+0.0014,1.12)':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d={int(duration*30)}:"
                      "s=1080x1920:fps=30,"
                      "format=yuv420p"
                  ),
                  "-t",
                  f"{duration:.3f}",
                  "-an",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "20",
                  "-movflags",
                  "+faststart",
                  "output/stage07/increment.mp4"
              ],
              check=True
          )
          PY

          python3 /tmp/build_increment_v15.py


      # =========================================================
      # STAGE 07 - TIMELINE
      # =========================================================

      - name: Stage 07 - Renderizar Timeline Visual
        shell: bash

        run: |
          set -e

          mkdir -p output/stage07/segments

          cat > /tmp/render_timeline_v15.py <<'PY'
          import json
          import subprocess

          from pathlib import Path


          plan = json.loads(
              Path(
                  "output/stage06_ai/director_plan.json"
              ).read_text(
                  encoding="utf-8"
              )
          )


          manifest = json.loads(
              Path(
                  "output/stage05/scene_manifest.json"
              ).read_text(
                  encoding="utf-8"
              )
          )


          by_scene = {
              int(
                  s["scene"]
              ):
              s
              for s in manifest
          }


          timeline = plan.get(
              "timeline",
              []
          )


          concat_lines = []


          for idx, item in enumerate(
              timeline,
              start=1
          ):

              kind = item.get(
                  "kind"
              )


              target = float(
                  item[
                      "duration"
                  ]
              )


              out = Path(
                  "output/stage07/segments/"
                  f"{idx:03d}_{kind}.mp4"
              )


              if kind == "increment":

                  source = Path(
                      "output/stage07/increment.mp4"
                  )


                  if not source.exists():

                      continue


                  src_duration = float(
                      subprocess.check_output(
                          [
                              "ffprobe",
                              "-v",
                              "error",
                              "-show_entries",
                              "format=duration",
                              "-of",
                              "default=noprint_wrappers=1:nokey=1",
                              str(source)
                          ],
                          text=True
                      ).strip()
                  )


              else:

                  scene = int(
                      item[
                          "scene"
                      ]
                  )


                  source = Path(
                      "output/stage04_clips/"
                      f"scene_{scene:03d}.mp4"
                  )


                  src_duration = float(
                      by_scene[
                          scene
                      ][
                          "duration"
                      ]
                  )


              if (
                  target <=
                  src_duration
              ):

                  cmd = [
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(source),
                      "-t",
                      f"{target:.3f}",
                      "-an",
                      "-vf",
                      "fps=30,format=yuv420p",
                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-crf",
                      "20",
                      "-pix_fmt",
                      "yuv420p",
                      "-movflags",
                      "+faststart",
                      str(out)
                  ]


              else:

                  factor = (
                      target /
                      src_duration
                  )


                  factor = min(
                      factor,
                      1.10
                  )


                  actual_target = (
                      src_duration *
                      factor
                  )


                  cmd = [
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(source),
                      "-an",
                      "-vf",
                      (
                          f"setpts={factor:.6f}*PTS,"
                          "fps=30,"
                          "format=yuv420p"
                      ),
                      "-t",
                      f"{actual_target:.3f}",
                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-crf",
                      "20",
                      "-pix_fmt",
                      "yuv420p",
                      "-movflags",
                      "+faststart",
                      str(out)
                  ]


              subprocess.run(
                  cmd,
                  check=True
              )


              concat_lines.append(
                  "file '" +
                  str(
                      out.resolve()
                  ) +
                  "'"
              )


          Path(
              "output/stage07/final_concat.txt"
          ).write_text(
              "\n".join(
                  concat_lines
              ) +
              "\n",
              encoding="utf-8"
          )
          PY


          python3 /tmp/render_timeline_v15.py


          test -s output/stage07/final_concat.txt


          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i output/stage07/final_concat.txt \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/stage07/ai_visual_master.mp4


          test -s output/stage07/ai_visual_master.mp4


      # =========================================================
      # VALIDAR TEMPO VISUAL
      # =========================================================

      - name: Stage 07 - Validar Duracao Solicitada
        shell: bash

        env:
          USER_TEMPO: ${{ inputs.tempo }}

        run: |
          set -e

          VISUAL_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/stage07/ai_visual_master.mp4)


          if [ "$USER_TEMPO" = "PRESERVAR" ]; then

            MIN_ALLOWED=$(awk \
              -v d="$DURATION" \
              'BEGIN { printf "%.3f", d*0.90 }')


            INVALID=$(awk \
              -v v="$VISUAL_DURATION" \
              -v min="$MIN_ALLOWED" \
              -v max="$DURATION" \
              'BEGIN {
                if (v < min-0.30 || v > max+0.30)
                  print 1;
                else
                  print 0
              }')


            if [ "$INVALID" = "1" ]; then

              echo "ERRO: PRESERVAR fora de 90-100%."

              exit 1

            fi


          elif [ "$USER_TEMPO" = "SHORT_CURTO" ]; then

            MIN_ALLOWED=$(awk \
              -v d="$DURATION" \
              'BEGIN {
                if (d<10) print d;
                else print 10
              }')


            MAX_ALLOWED=$(awk \
              -v d="$DURATION" \
              'BEGIN {
                if (d<20) print d;
                else print 20
              }')


            INVALID=$(awk \
              -v v="$VISUAL_DURATION" \
              -v min="$MIN_ALLOWED" \
              -v max="$MAX_ALLOWED" \
              'BEGIN {
                if (v < min-0.30 || v > max+0.30)
                  print 1;
                else
                  print 0
              }')


            if [ "$INVALID" = "1" ]; then

              echo "ERRO: SHORT_CURTO fora da faixa."

              exit 1

            fi

          fi


          echo "CONTROLE DE TEMPO VALIDADO."


