name: Parece Mentira - Video Engine V3

on:
  workflow_dispatch:

concurrency:
  group: parece-mentira-video-engine
  cancel-in-progress: true

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:

      # =========================================================
      # SETUP
      # =========================================================

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # =========================================================
      # LOCALIZAR ARQUIVOS
      # =========================================================

      - name: Localizar arquivos
        shell: bash
        run: |
          set -e

          VIDEO=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "*.mp4" \
            ! -path "./output/*" \
            | head -1)

          if [ -z "$VIDEO" ]; then
            echo "ERRO: nenhum MP4 encontrado."
            exit 1
          fi

          if [ ! -f "./logo_parece_mentira.png" ]; then
            echo "ERRO: logo_parece_mentira.png nao encontrada."
            exit 1
          fi

          echo "VIDEO=$VIDEO" >> "$GITHUB_ENV"

          echo "========================================"
          echo "ARQUIVOS LOCALIZADOS"
          echo "Video: $VIDEO"
          echo "Logo: ./logo_parece_mentira.png"
          echo "========================================"

      # =========================================================
      # ANALISE DA FONTE
      # =========================================================

      - name: Analisar video original
        shell: bash
        run: |
          set -e

          mkdir -p output

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$VIDEO")

          if [ -z "$DURATION" ]; then
            echo "ERRO: duracao nao identificada."
            exit 1
          fi

          echo "DURATION=$DURATION" >> "$GITHUB_ENV"

          echo "========================================"
          echo "SOURCE ANALYSIS"
          echo "Duracao: $DURATION segundos"
          echo "========================================"

          ffprobe \
            -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$VIDEO" \
            > output/source_report.txt

          cat output/source_report.txt

      # =========================================================
      # STAGE 01
      # SOURCE CLEANING / BRANDING
      #
      # Timeline original permanece intacta.
      #
      # Ciclo Instagram observado:
      #
      # 00-08  superior
      # 08-09  transicao
      # 09-17  inferior
      # 17-18  transicao
      #
      # repete a cada 18 segundos.
      #
      # Durante a transicao existe sobreposicao das duas logos
      # para impedir que a marca original fique descoberta.
      # =========================================================

      - name: Stage 01 - Branding Animado
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STAGE 01 - BRANDING ANIMADO"
          echo "Timeline original preservada"
          echo "Logo 180x135"
          echo "Transicao cruzada de 1 segundo"
          echo "========================================"

          ffmpeg -y \
            -i "$VIDEO" \
            -loop 1 -framerate 30 -i "./logo_parece_mentira.png" \
            -filter_complex "\
            [0:v]\
            scale=1080:1920:force_original_aspect_ratio=increase,\
            crop=1080:1920,\
            setsar=1\
            [base];\
            \
            [1:v]\
            scale=180:135,\
            format=rgba,\
            split=2\
            [topraw][bottomraw];\
            \
            [topraw]\
            colorchannelmixer=aa='\
            if(lt(mod(t,18),8),1,\
            if(lt(mod(t,18),9),9-mod(t,18),\
            if(lt(mod(t,18),17),0,\
            if(lt(mod(t,18),18),mod(t,18)-17,1))))'\
            [top];\
            \
            [bottomraw]\
            colorchannelmixer=aa='\
            if(lt(mod(t,18),8),0,\
            if(lt(mod(t,18),9),mod(t,18)-8,\
            if(lt(mod(t,18),17),1,\
            if(lt(mod(t,18),18),18-mod(t,18),0))))'\
            [bottom];\
            \
            [base][top]\
            overlay=\
            x=W-w-55:\
            y=420:\
            eof_action=repeat\
            [v1];\
            \
            [v1][bottom]\
            overlay=\
            x=105:\
            y=H-h-610:\
            eof_action=repeat\
            [clean]" \
            -map "[clean]" \
            -map 0:a? \
            -t "$DURATION" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -c:a aac \
            -b:a 128k \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/clean_master.mp4

      # =========================================================
      # VALIDAR STAGE 01
      # =========================================================

      - name: Validar Stage 01
        shell: bash
        run: |
          set -e

          test -s output/clean_master.mp4

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            output/clean_master.mp4)

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            output/clean_master.mp4)

          CLEAN_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/clean_master.mp4)

          echo "Resolucao: ${WIDTH}x${HEIGHT}"
          echo "Duracao: $CLEAN_DURATION"

          if [ "$WIDTH" != "1080" ] || [ "$HEIGHT" != "1920" ]; then
            echo "ERRO: Stage 01 fora de 1080x1920."
            exit 1
          fi

          echo "STAGE 01 VALIDADO."

      # =========================================================
      # STAGE 02
      # EDITORIAL MASTER
      #
      # A partir daqui podemos modificar a timeline.
      # Audio original removido.
      # =========================================================

      - name: Stage 02 - Criar Editorial Master
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STAGE 02 - EDITORIAL MASTER"
          echo "Audio original sera removido"
          echo "========================================"

          ffmpeg -y \
            -i output/clean_master.mp4 \
            -map 0:v:0 \
            -an \
            -vf "fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -movflags +faststart \
            output/editorial_master.mp4

      # =========================================================
      # VALIDAR STAGE 02
      # =========================================================

      - name: Validar Stage 02
        shell: bash
        run: |
          set -e

          test -s output/editorial_master.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=codec_type,codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            output/editorial_master.mp4 \
            | tee output/editorial_report.txt

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            output/editorial_master.mp4)

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            output/editorial_master.mp4)

          AUDIO_COUNT=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            output/editorial_master.mp4 \
            | wc -l)

          if [ "$WIDTH" != "1080" ] || [ "$HEIGHT" != "1920" ]; then
            echo "ERRO: Editorial Master fora de 1080x1920."
            exit 1
          fi

          if [ "$AUDIO_COUNT" -ne 0 ]; then
            echo "ERRO: audio original ainda presente."
            exit 1
          fi

          echo "STAGE 02 VALIDADO."

      # =========================================================
      # STAGE 03
      # SCENE DETECTION
      #
      # Analisa mudancas visuais significativas.
      #
      # Ainda NAO corta o video.
      # Ainda NAO reordena cenas.
      #
      # Apenas cria o mapa editorial.
      # =========================================================

      - name: Stage 03 - Detectar Cenas
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STAGE 03 - SCENE DETECTION"
          echo "Analisando mudancas visuais..."
          echo "========================================"

          ffmpeg \
            -hide_banner \
            -i output/editorial_master.mp4 \
            -vf "select='gt(scene,0.32)',showinfo" \
            -an \
            -f null - \
            2> output/scene_detection_raw.txt || true

          grep "showinfo" \
            output/scene_detection_raw.txt \
            | grep "pts_time:" \
            | sed -n 's/.*pts_time:\([^ ]*\).*/\1/p' \
            > output/scene_times.txt || true

          echo "0.000000" > output/scene_report.txt

          if [ -s output/scene_times.txt ]; then
            cat output/scene_times.txt >> output/scene_report.txt
          fi

          echo "$DURATION" >> output/scene_report.txt

          awk '!seen[$0]++' \
            output/scene_report.txt \
            > output/scene_report_unique.txt

          mv \
            output/scene_report_unique.txt \
            output/scene_report.txt

          SCENE_COUNT=$(wc -l < output/scene_report.txt)

          echo "========================================"
          echo "PONTOS EDITORIAIS DETECTADOS"
          echo "========================================"

          cat output/scene_report.txt

          echo "========================================"
          echo "Total de pontos: $SCENE_COUNT"
          echo "========================================"

      # =========================================================
      # STAGE 03 - GERAR PREVIEWS
      #
      # Cria uma imagem de cada ponto detectado.
      # Isso vai permitir validar visualmente as cenas.
      # =========================================================

      - name: Stage 03 - Gerar Previews
        shell: bash
        run: |
          set -e

          mkdir -p output/scenes

          INDEX=1

          while read TIME; do

            if [ -z "$TIME" ]; then
              continue
            fi

            printf -v NUMBER "%03d" "$INDEX"

            ffmpeg -y \
              -ss "$TIME" \
              -i output/editorial_master.mp4 \
              -frames:v 1 \
              -vf "scale=360:-2" \
              -q:v 3 \
              "output/scenes/scene_${NUMBER}_${TIME}s.jpg" \
              >/dev/null 2>&1 || true

            INDEX=$((INDEX + 1))

          done < output/scene_report.txt

          echo "Previews gerados:"

          find output/scenes \
            -type f \
            -iname "*.jpg" \
            | sort

      # =========================================================
      # PACOTES
      # =========================================================

      - name: Disponibilizar Stage 01
        uses: actions/upload-artifact@v4
        with:
          name: stage-01-clean-master
          path: output/clean_master.mp4
          retention-days: 7
          if-no-files-found: error

      - name: Disponibilizar Stage 02
        uses: actions/upload-artifact@v4
        with:
          name: stage-02-editorial-master
          path: |
            output/editorial_master.mp4
            output/source_report.txt
            output/editorial_report.txt
          retention-days: 7
          if-no-files-found: error

      - name: Disponibilizar Stage 03
        uses: actions/upload-artifact@v4
        with:
          name: stage-03-scene-analysis
          path: |
            output/scene_report.txt
            output/scene_times.txt
            output/scene_detection_raw.txt
            output/scenes/*.jpg
          retention-days: 7
          if-no-files-found: error
