          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            output/stage08/remontagem_narrada_coerente.mp4)

          AUDIO_COUNT=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            output/stage08/remontagem_narrada_coerente.mp4 \
            | wc -l)

          if [ "$WIDTH" != "1080" ] || [ "$HEIGHT" != "1920" ]; then
            echo "ERRO: Stage 08 V13 fora de 1080x1920."
            exit 1
          fi

          if [ "$AUDIO_COUNT" -lt 1 ]; then
            echo "ERRO: Stage 08 V13 sem audio."
            exit 1
          fi

          echo "========================================"
          echo "STAGE 08 V13 VALIDADO"
          echo "Narracao por bloco visual: OK"
          echo "Incremento narrado: OK"
          echo "Pesquisa factual: OK"
          echo "========================================"

