name: Parece Mentira - Video Engine V3.1

on:
  workflow_dispatch:

concurrency:
  group: parece-mentira-video-engine
  cancel-in-progress: true

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:

      # =========================================================
      # SETUP
      # =========================================================

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # =========================================================
      # LOCALIZAR ARQUIVOS
      # =========================================================

      - name: Localizar arquivos
        shell: bash
        run: |
          set -e

          VIDEO=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "*.mp4" \
            ! -path "./output/*" \
            | head -1)

          if [ -z "$VIDEO" ]; then
            echo "ERRO: nenhum MP4 encontrado."
            exit 1
          fi

          if [ ! -f "./logo_parece_mentira.png" ]; then
            echo "ERRO: logo_parece_mentira.png nao encontrada."
            exit 1
          fi

          echo "VIDEO=$VIDEO" >> "$GITHUB_ENV"

          echo "========================================"
          echo "ARQUIVOS LOCALIZADOS"
          echo "Video: $VIDEO"
          echo "Logo: ./logo_parece_mentira.png"
          echo "========================================"

      # =========================================================
      # ANALISE DA FONTE
      # =========================================================

      - name: Analisar video original
        shell: bash
        run: |
          set -e

          mkdir -p output

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$VIDEO")

          if [ -z "$DURATION" ]; then
            echo "ERRO: duracao nao identificada."
            exit 1
          fi

          echo "DURATION=$DURATION" >> "$GITHUB_ENV"

          ffprobe \
            -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$VIDEO" \
            > output/source_report.txt

          echo "========================================"
          echo "SOURCE ANALYSIS"
          echo "Duracao: $DURATION segundos"
          echo "========================================"

          cat output/source_report.txt

      # =========================================================
      # STAGE 01
      # BRANDING
      #
      # IMPORTANTE:
      # - timeline original preservada
      # - sem cortes
      # - sem reordenacao
      #
      # A logo foi achatada para 190x130.
      #
      # O movimento ocorre em blocos independentes.
      # Cada bloco da logo recebe fade IN e OUT.
      #
      # Isso evita depender de expressoes dinamicas
      # de alpha incompatíveis com colorchannelmixer.
      # =========================================================

      - name: Stage 01 - Branding Animado
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STAGE 01 - BRANDING ANIMADO"
          echo "Logo: 190x130"
          echo "Fade progressivo"
          echo "Timeline original preservada"
          echo "========================================"

          ffmpeg -y \
            -i "$VIDEO" \
            -loop 1 -framerate 30 -i "./logo_parece_mentira.png" \
            -filter_complex "\
            [0:v]\
            scale=1080:1920:force_original_aspect_ratio=increase,\
            crop=1080:1920,\
            setsar=1\
            [base];\
            \
            [1:v]\
            scale=190:130,\
            format=rgba,\
            split=10\
            [l0][l1][l2][l3][l4][l5][l6][l7][l8][l9];\
            \
            [l0]fade=t=out:st=7.6:d=1.4:alpha=1[top0];\
            \
            [l1]\
            fade=t=in:st=7.6:d=1.4:alpha=1,\
            fade=t=out:st=16.6:d=1.4:alpha=1\
            [bottom0];\
            \
            [l2]\
            fade=t=in:st=16.6:d=1.4:alpha=1,\
            fade=t=out:st=25.6:d=1.4:alpha=1\
            [top1];\
            \
            [l3]\
            fade=t=in:st=25.6:d=1.4:alpha=1,\
            fade=t=out:st=34.6:d=1.4:alpha=1\
            [bottom1];\
            \
            [l4]\
            fade=t=in:st=34.6:d=1.4:alpha=1,\
            fade=t=out:st=43.6:d=1.4:alpha=1\
            [top2];\
            \
            [l5]\
            fade=t=in:st=43.6:d=1.4:alpha=1,\
            fade=t=out:st=52.6:d=1.4:alpha=1\
            [bottom2];\
            \
            [l6]\
            fade=t=in:st=52.6:d=1.4:alpha=1,\
            fade=t=out:st=61.6:d=1.4:alpha=1\
            [top3];\
            \
            [l7]\
            fade=t=in:st=61.6:d=1.4:alpha=1,\
            fade=t=out:st=70.6:d=1.4:alpha=1\
            [bottom3];\
            \
            [l8]\
            fade=t=in:st=70.6:d=1.4:alpha=1,\
            fade=t=out:st=79.6:d=1.4:alpha=1\
            [top4];\
            \
            [l9]\
            fade=t=in:st=79.6:d=1.4:alpha=1\
            [bottom4];\
            \
            [base][top0]\
            overlay=x=W-w-45:y=415:enable='between(t,0,9)'\
            [v1];\
            \
            [v1][bottom0]\
            overlay=x=95:y=H-h-605:enable='between(t,7.6,18)'\
            [v2];\
            \
            [v2][top1]\
            overlay=x=W-w-45:y=415:enable='between(t,16.6,27)'\
            [v3];\
            \
            [v3][bottom1]\
            overlay=x=95:y=H-h-605:enable='between(t,25.6,36)'\
            [v4];\
            \
            [v4][top2]\
            overlay=x=W-w-45:y=415:enable='between(t,34.6,45)'\
            [v5];\
            \
            [v5][bottom2]\
            overlay=x=95:y=H-h-605:enable='between(t,43.6,54)'\
            [v6];\
            \
            [v6][top3]\
            overlay=x=W-w-45:y=415:enable='between(t,52.6,63)'\
            [v7];\
            \
            [v7][bottom3]\
            overlay=x=95:y=H-h-605:enable='between(t,61.6,72)'\
            [v8];\
            \
            [v8][top4]\
            overlay=x=W-w-45:y=415:enable='between(t,70.6,81)'\
            [v9];\
            \
            [v9][bottom4]\
            overlay=x=95:y=H-h-605:enable='gte(t,79.6)'\
            [clean]" \
            -map "[clean]" \
            -map 0:a? \
            -t "$DURATION" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -c:a aac \
            -b:a 128k \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/clean_master.mp4

      # =========================================================
      # VALIDAR STAGE 01
      # =========================================================

      - name: Validar Stage 01
        shell: bash
        run: |
          set -e

          test -s output/clean_master.mp4

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            output/clean_master.mp4)

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            output/clean_master.mp4)

          CLEAN_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/clean_master.mp4)

          echo "Resolucao: ${WIDTH}x${HEIGHT}"
          echo "Duracao: $CLEAN_DURATION"

          if [ "$WIDTH" != "1080" ] || [ "$HEIGHT" != "1920" ]; then
            echo "ERRO: Stage 01 fora de 1080x1920."
            exit 1
          fi

          echo "STAGE 01 VALIDADO."

      # =========================================================
      # STAGE 02
      # EDITORIAL MASTER
      # =========================================================

      - name: Stage 02 - Criar Editorial Master
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STAGE 02 - EDITORIAL MASTER"
          echo "Removendo audio original"
          echo "========================================"

          ffmpeg -y \
            -i output/clean_master.mp4 \
            -map 0:v:0 \
            -an \
            -vf "fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -movflags +faststart \
            output/editorial_master.mp4

      # =========================================================
      # VALIDAR STAGE 02
      # =========================================================

      - name: Validar Stage 02
        shell: bash
        run: |
          set -e

          test -s output/editorial_master.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=codec_type,codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            output/editorial_master.mp4 \
            | tee output/editorial_report.txt

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            output/editorial_master.mp4)

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            output/editorial_master.mp4)

          AUDIO_COUNT=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            output/editorial_master.mp4 \
            | wc -l)

          if [ "$WIDTH" != "1080" ] || [ "$HEIGHT" != "1920" ]; then
            echo "ERRO: resolucao Stage 02 incorreta."
            exit 1
          fi

          if [ "$AUDIO_COUNT" -ne 0 ]; then
            echo "ERRO: Stage 02 ainda possui audio."
            exit 1
          fi

          echo "STAGE 02 VALIDADO."

      # =========================================================
      # STAGE 03
      # DETECCAO DE CENAS
      # =========================================================

      - name: Stage 03 - Detectar Cenas
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STAGE 03 - SCENE DETECTION"
          echo "========================================"

          ffmpeg \
            -hide_banner \
            -i output/editorial_master.mp4 \
            -vf "select='gt(scene,0.32)',showinfo" \
            -an \
            -f null - \
            2> output/scene_detection_raw.txt || true

          grep "showinfo" \
            output/scene_detection_raw.txt \
            | grep "pts_time:" \
            | sed -n 's/.*pts_time:\([^ ]*\).*/\1/p' \
            > output/scene_times.txt || true

          echo "0.000000" > output/scene_report.txt

          if [ -s output/scene_times.txt ]; then
            cat output/scene_times.txt >> output/scene_report.txt
          fi

          echo "$DURATION" >> output/scene_report.txt

          awk '!seen[$0]++' \
            output/scene_report.txt \
            > output/scene_report_unique.txt

          mv \
            output/scene_report_unique.txt \
            output/scene_report.txt

          echo "========================================"
          echo "PONTOS DETECTADOS"
          echo "========================================"

          cat output/scene_report.txt

      # =========================================================
      # PREVIEWS DAS CENAS
      # =========================================================

      - name: Stage 03 - Gerar Previews
        shell: bash
        run: |
          set -e

          mkdir -p output/scenes

          INDEX=1

          while read TIME; do

            if [ -z "$TIME" ]; then
              continue
            fi

            printf -v NUMBER "%03d" "$INDEX"

            ffmpeg -y \
              -ss "$TIME" \
              -i output/editorial_master.mp4 \
              -frames:v 1 \
              -vf "scale=360:-2" \
              -q:v 3 \
              "output/scenes/scene_${NUMBER}_${TIME}s.jpg" \
              >/dev/null 2>&1 || true

            INDEX=$((INDEX + 1))

          done < output/scene_report.txt

          echo "Previews:"
          find output/scenes -type f -iname "*.jpg" | sort

      # =========================================================
      # ARTIFACTS
      # =========================================================

      - name: Disponibilizar Stage 01
        uses: actions/upload-artifact@v4
        with:
          name: stage-01-clean-master
          path: output/clean_master.mp4
          retention-days: 7
          if-no-files-found: error

      - name: Disponibilizar Stage 02
        uses: actions/upload-artifact@v4
        with:
          name: stage-02-editorial-master
          path: |
            output/editorial_master.mp4
            output/source_report.txt
            output/editorial_report.txt
          retention-days: 7
          if-no-files-found: error

      - name: Disponibilizar Stage 03
        uses: actions/upload-artifact@v4
        with:
          name: stage-03-scene-analysis
          path: |
            output/scene_report.txt
            output/scene_times.txt
            output/scene_detection_raw.txt
            output/scenes/*.jpg
          retention-days: 7
          if-no-files-found: error
