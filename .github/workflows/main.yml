      - name: Stage 06B - Validar Plano Manual
        if: ${{ inputs.etapa != 'ACABAMENTO_SEM_IA' && inputs.modo == 'PLANO_MANUAL' }}
        shell: bash

        run: |
          set -e

          cat > /tmp/validate_manual_plan.py <<'PY'
          import json
          from pathlib import Path

          plan_path = Path(
              "output/stage06_ai/director_plan.json"
          )

          manifest_path = Path(
              "output/stage05/scene_manifest.json"
          )

          plan = json.loads(
              plan_path.read_text(
                  encoding="utf-8"
              )
          )

          manifest = json.loads(
              manifest_path.read_text(
                  encoding="utf-8"
              )
          )

          timeline = plan.get(
              "timeline",
              []
          )

          if not timeline:

              raise RuntimeError(
                  "Plano manual sem timeline."
              )

          valid_scenes = {
              int(
                  s["scene"]
              )
              for s in manifest
          }

          original_durations = {
              int(s["scene"]):
              float(s["duration"])
              for s in manifest
          }


          for item in timeline:

              kind = item.get(
                  "kind"
              )

              if kind not in (
                  "scene",
                  "increment"
              ):

                  raise RuntimeError(
                      "kind invalido."
                  )


              duration = float(
                  item.get(
                      "duration",
                      0
                  )
              )


              if duration <= 0:

                  raise RuntimeError(
                      "duration invalida."
                  )


              if kind == "scene":

                  scene = item.get(
                      "scene"
                  )


                  if scene not in valid_scenes:

                      raise RuntimeError(
                          "Cena inexistente."
                      )


                  max_allowed = (
                      original_durations[
                          scene
                      ] *
                      1.10
                  )


                  if (
                      duration >
                      max_allowed + 0.05
                  ):

                      raise RuntimeError(
                          "Duracao da cena acima do limite."
                      )


              if kind == "increment":

                  item[
                      "scene"
                  ] = None


          plan[
              "mode_used"
          ] = "PLANO_MANUAL"


          if (
              "story_summary"
              not in plan
          ):

              plan[
                  "story_summary"
              ] = ""


          if (
              "research_notes"
              not in plan
          ):

              plan[
                  "research_notes"
              ] = []


          if (
              "increment"
              not in plan
          ):

              plan[
                  "increment"
              ] = {
                  "type":
                      "none",

                  "title":
                      "",

                  "subtitle":
                      "",

                  "duration":
                      0,

                  "narration":
                      "",

                  "points":
                      []
              }


          plan_path.write_text(
              json.dumps(
                  plan,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )
          PY

          python3 /tmp/validate_manual_plan.py


