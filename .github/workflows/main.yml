      - name: Stage 06 - AI Director Gemini
        if: ${{ inputs.etapa != 'ACABAMENTO_SEM_IA' && inputs.modo != 'PLANO_MANUAL' }}
        shell: bash

        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_CONTEXT: ${{ inputs.contexto }}
