name: Parece Mentira - Video Engine V12
on:
  workflow_dispatch:

concurrency:
  group: parece-mentira-video-engine
  cancel-in-progress: true

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:

      # =========================================================
      # SETUP
      # =========================================================

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip

      # =========================================================
      # LOCALIZAR ARQUIVOS
      # =========================================================

      - name: Localizar arquivos
        shell: bash
        run: |
          set -e

          VIDEO=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "*.mp4" \
            ! -path "./output/*" \
            | head -1)

          if [ -z "$VIDEO" ]; then
            echo "ERRO: nenhum MP4 encontrado."
            exit 1
          fi

          if [ ! -f "./logo_parece_mentira.png" ]; then
            echo "ERRO: logo_parece_mentira.png nao encontrada."
            exit 1
          fi

          echo "VIDEO=$VIDEO" >> "$GITHUB_ENV"

          echo "========================================"
          echo "ARQUIVOS LOCALIZADOS"
          echo "Video: $VIDEO"
          echo "Logo: ./logo_parece_mentira.png"
          echo "========================================"

      # =========================================================
      # ANALISE DO VIDEO
      # =========================================================

      - name: Analisar video original
        shell: bash
        run: |
          set -e

          mkdir -p output

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$VIDEO")

          if [ -z "$DURATION" ]; then
            echo "ERRO: duracao nao identificada."
            exit 1
          fi

          FINAL_START=$(awk -v d="$DURATION" 'BEGIN { printf "%.3f", d-5.0 }')
          FINAL_FULL=$(awk -v d="$DURATION" 'BEGIN { printf "%.3f", d-4.0 }')
          SMALL_FADE_START=$(awk -v d="$DURATION" 'BEGIN { printf "%.3f", d-4.0 }')
          SMALL_FADE_END=$(awk -v d="$DURATION" 'BEGIN { printf "%.3f", d-3.0 }')

          echo "DURATION=$DURATION" >> "$GITHUB_ENV"
          echo "FINAL_START=$FINAL_START" >> "$GITHUB_ENV"
          echo "FINAL_FULL=$FINAL_FULL" >> "$GITHUB_ENV"
          echo "SMALL_FADE_START=$SMALL_FADE_START" >> "$GITHUB_ENV"
          echo "SMALL_FADE_END=$SMALL_FADE_END" >> "$GITHUB_ENV"

          ffprobe \
            -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$VIDEO" \
            > output/source_report.txt

          echo "Duracao: $DURATION"

      # =========================================================
      # STAGE 01 - SOURCE BRANDING
      # CONGELADO / APROVADO
      # =========================================================

      - name: Stage 01 - Branding Ajustado Final
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STAGE 01 - BRANDING APROVADO"
          echo "NAO ALTERAR"
          echo "========================================"

          ffmpeg -y \
            -i "$VIDEO" \
            -loop 1 -framerate 30 -i "./logo_parece_mentira.png" \
            -loop 1 -framerate 30 -i "./logo_parece_mentira.png" \
            -filter_complex "\
            [0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1[base];\
            \
            [1:v]scale=270:160,format=rgba,split=9[l1][l2][l3][l4][l5][l6][l7][l8][l9];\
            \
            [l1]fade=t=out:st=8.95:d=0.55:alpha=1[top0];\
            [l2]fade=t=in:st=8.60:d=0.40:alpha=1,fade=t=out:st=17.95:d=0.55:alpha=1[bottom0];\
            [l3]fade=t=in:st=17.60:d=0.40:alpha=1,fade=t=out:st=26.95:d=0.55:alpha=1[top1];\
            [l4]fade=t=in:st=26.60:d=0.40:alpha=1,fade=t=out:st=35.95:d=0.55:alpha=1[bottom1];\
            [l5]fade=t=in:st=35.60:d=0.40:alpha=1,fade=t=out:st=44.95:d=0.55:alpha=1[top2];\
            [l6]fade=t=in:st=44.60:d=0.40:alpha=1,fade=t=out:st=53.95:d=0.55:alpha=1[bottom2];\
            [l7]fade=t=in:st=53.60:d=0.40:alpha=1,fade=t=out:st=62.95:d=0.55:alpha=1[top3];\
            [l8]fade=t=in:st=62.60:d=0.40:alpha=1,fade=t=out:st=71.95:d=0.55:alpha=1[bottom3];\
            [l9]fade=t=in:st=71.60:d=0.40:alpha=1,fade=t=out:st=${SMALL_FADE_START}:d=1.00:alpha=1[top4];\
            \
            [base][top0]overlay=x=W-w-18:y=420:enable='between(t,0,9.5)'[v1];\
            [v1][bottom0]overlay=x=18:y=H-h-625:enable='between(t,8.6,18.5)'[v2];\
            [v2][top1]overlay=x=W-w-18:y=420:enable='between(t,17.6,27.5)'[v3];\
            [v3][bottom1]overlay=x=18:y=H-h-625:enable='between(t,26.6,36.5)'[v4];\
            [v4][top2]overlay=x=W-w-18:y=420:enable='between(t,35.6,45.5)'[v5];\
            [v5][bottom2]overlay=x=18:y=H-h-625:enable='between(t,44.6,54.5)'[v6];\
            [v6][top3]overlay=x=W-w-18:y=420:enable='between(t,53.6,63.5)'[v7];\
            [v7][bottom3]overlay=x=18:y=H-h-625:enable='between(t,62.6,72.5)'[v8];\
            [v8][top4]overlay=x=W-w-18:y=420:enable='between(t,71.6,${SMALL_FADE_END})'[corners];\
            \
            [2:v]scale=540:540,format=rgba,fade=t=in:st=${FINAL_START}:d=1.0:alpha=1[final_logo];\
            [corners][final_logo]overlay=x=(W-w)/2:y=(H-h)/2:enable='gte(t,${FINAL_START})'[clean]" \
            -map "[clean]" \
            -map 0:a? \
            -t "$DURATION" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -c:a aac \
            -b:a 128k \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/clean_master.mp4

      # =========================================================
      # VALIDAR STAGE 01
      # =========================================================

      - name: Validar Stage 01
        shell: bash
        run: |
          set -e

          test -s output/clean_master.mp4

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            output/clean_master.mp4)

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            output/clean_master.mp4)

          if [ "$WIDTH" != "1080" ] || [ "$HEIGHT" != "1920" ]; then
            echo "ERRO: Stage 01 fora de 1080x1920."
            exit 1
          fi

          echo "STAGE 01 VALIDADO."

      # =========================================================
      # STAGE 02 - EDITORIAL MASTER
      # =========================================================

      - name: Stage 02 - Criar Editorial Master
        shell: bash
        run: |
          set -e

          ffmpeg -y \
            -i output/clean_master.mp4 \
            -map 0:v:0 \
            -an \
            -vf "fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -movflags +faststart \
            output/editorial_master.mp4

      - name: Validar Stage 02
        shell: bash
        run: |
          set -e

          test -s output/editorial_master.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=codec_type,codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            output/editorial_master.mp4 \
            | tee output/editorial_report.txt

          AUDIO_COUNT=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            output/editorial_master.mp4 \
            | wc -l)

          if [ "$AUDIO_COUNT" -ne 0 ]; then
            echo "ERRO: Stage 02 ainda possui audio."
            exit 1
          fi

          echo "STAGE 02 VALIDADO."

      # =========================================================
      # STAGE 03 - DETECCAO DE CENAS
      # =========================================================

      - name: Stage 03 - Detectar Cenas
        shell: bash
        run: |
          set -e

          ffmpeg \
            -hide_banner \
            -i output/editorial_master.mp4 \
            -vf "select='gt(scene,0.32)',showinfo" \
            -an \
            -f null - \
            2> output/scene_detection_raw.txt || true

          grep "showinfo" \
            output/scene_detection_raw.txt \
            | grep "pts_time:" \
            | sed -n 's/.*pts_time:\([^ ]*\).*/\1/p' \
            > output/scene_times.txt || true

          echo "0.000000" > output/scene_report.txt

          if [ -s output/scene_times.txt ]; then
            cat output/scene_times.txt >> output/scene_report.txt
          fi

          echo "$DURATION" >> output/scene_report.txt

          awk '!seen[$0]++' \
            output/scene_report.txt \
            > output/scene_report_unique.txt

          mv \
            output/scene_report_unique.txt \
            output/scene_report.txt

          cat output/scene_report.txt

      # =========================================================
      # STAGE 03 - PREVIEWS
      # =========================================================

      - name: Stage 03 - Gerar Previews
        shell: bash
        run: |
          set -e

          mkdir -p output/scenes

          INDEX=1

          while read TIME; do

            if [ -z "$TIME" ]; then
              continue
            fi

            printf -v NUMBER "%03d" "$INDEX"

            ffmpeg -y \
              -ss "$TIME" \
              -i output/editorial_master.mp4 \
              -frames:v 1 \
              -vf "scale=360:-2" \
              -q:v 3 \
              "output/scenes/scene_${NUMBER}_${TIME}s.jpg" \
              >/dev/null 2>&1 || true

            INDEX=$((INDEX + 1))

          done < output/scene_report.txt

      # =========================================================
      # STAGE 04 - SCENE CUTTER
      # =========================================================

      - name: Stage 04 - Criar Clips de Cena
        shell: bash
        run: |
          set -e

          mkdir -p output/stage04_clips

          mapfile -t TIMES < output/scene_report.txt

          TOTAL_POINTS=${#TIMES[@]}

          if [ "$TOTAL_POINTS" -lt 2 ]; then
            echo "ERRO: pontos insuficientes para cortar cenas."
            exit 1
          fi

          echo "scene,start,end,duration,file" > output/edit_plan.csv
          echo "PARECE MENTIRA - EDIT PLAN" > output/edit_plan.txt

          CREATED=0

          for ((i=0; i<TOTAL_POINTS-1; i++)); do

            START="${TIMES[$i]}"
            END="${TIMES[$((i+1))]}"

            CLIP_DURATION=$(awk \
              -v start="$START" \
              -v end="$END" \
              'BEGIN { printf "%.6f", end-start }')

            VALID=$(awk \
              -v d="$CLIP_DURATION" \
              'BEGIN { if (d > 0.01) print 1; else print 0 }')

            if [ "$VALID" != "1" ]; then
              continue
            fi

            CREATED=$((CREATED + 1))

            printf -v NUMBER "%03d" "$CREATED"

            OUTPUT_FILE="output/stage04_clips/scene_${NUMBER}.mp4"

            ffmpeg -y \
              -ss "$START" \
              -i output/editorial_master.mp4 \
              -t "$CLIP_DURATION" \
              -map 0:v:0 \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -crf 20 \
              -pix_fmt yuv420p \
              -movflags +faststart \
              "$OUTPUT_FILE"

            echo "${NUMBER},${START},${END},${CLIP_DURATION},scene_${NUMBER}.mp4" \
              >> output/edit_plan.csv

            {
              echo ""
              echo "CENA $NUMBER"
              echo "Inicio: $START s"
              echo "Fim: $END s"
              echo "Duracao: $CLIP_DURATION s"
              echo "Arquivo: scene_${NUMBER}.mp4"
            } >> output/edit_plan.txt

          done

          if [ "$CREATED" -lt 1 ]; then
            echo "ERRO: nenhuma cena foi criada."
            exit 1
          fi

          echo "STAGE 04 OK - Cenas: $CREATED"

      # =========================================================
      # STAGE 05 - TRANSCRICAO / ENTENDIMENTO
      # =========================================================

      - name: Stage 05 - Instalar Whisper
        shell: bash
        run: |
          set -e

          python3 -m pip install --upgrade pip
          python3 -m pip install faster-whisper

      # =========================================================
      # Extrair audio leve para acelerar Whisper
      # =========================================================

      - name: Stage 05 - Preparar Audio
        shell: bash
        run: |
          set -e

          mkdir -p output/stage05

          ffmpeg -y \
            -i output/clean_master.mp4 \
            -vn \
            -ac 1 \
            -ar 16000 \
            -c:a pcm_s16le \
            output/stage05/audio_whisper.wav

          test -s output/stage05/audio_whisper.wav

      # =========================================================
      # TRANSCRICAO
      # =========================================================

      - name: Stage 05 - Transcrever com Whisper
        shell: bash
        run: |
          set -e

          cat > /tmp/transcribe.py <<'PY'
          import json
          from faster_whisper import WhisperModel

          audio_path = "output/stage05/audio_whisper.wav"

          print("Carregando Whisper...")
          model = WhisperModel(
              "small",
              device="cpu",
              compute_type="int8"
          )

          segments, info = model.transcribe(
              audio_path,
              language="pt",
              beam_size=5,
              vad_filter=True,
              word_timestamps=True
          )

          result = {
              "language": info.language,
              "language_probability": info.language_probability,
              "segments": []
          }

          full_text = []

          for segment in segments:
              item = {
                  "start": round(segment.start, 3),
                  "end": round(segment.end, 3),
                  "text": segment.text.strip(),
                  "words": []
              }

              if segment.words:
                  for word in segment.words:
                      item["words"].append({
                          "start": round(word.start, 3) if word.start is not None else None,
                          "end": round(word.end, 3) if word.end is not None else None,
                          "word": word.word
                      })

              result["segments"].append(item)
              full_text.append(segment.text.strip())

              print(
                  f"[{segment.start:.2f} -> {segment.end:.2f}] "
                  f"{segment.text.strip()}"
              )

          with open(
              "output/stage05/transcript.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              "output/stage05/transcript.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(full_text))

          print("Transcricao concluida.")
          PY

          python3 /tmp/transcribe.py

          test -s output/stage05/transcript.json
          test -s output/stage05/transcript.txt

      # =========================================================
      # ASSOCIAR FALAS AS CENAS
      # =========================================================

      - name: Stage 05 - Criar Manifesto de Cenas
        shell: bash
        run: |
          set -e

          cat > /tmp/build_manifest.py <<'PY'
          import csv
          import json

          edit_plan = "output/edit_plan.csv"
          transcript_file = "output/stage05/transcript.json"

          with open(
              transcript_file,
              "r",
              encoding="utf-8"
          ) as f:
              transcript = json.load(f)

          segments = transcript.get("segments", [])

          scenes = []

          with open(
              edit_plan,
              "r",
              encoding="utf-8"
          ) as f:
              reader = csv.DictReader(f)

              for row in reader:
                  start = float(row["start"])
                  end = float(row["end"])

                  scene_segments = []

                  for seg in segments:
                      seg_start = float(seg["start"])
                      seg_end = float(seg["end"])

                      midpoint = (seg_start + seg_end) / 2

                      if start <= midpoint < end:
                          scene_segments.append(seg)

                  text = " ".join(
                      s["text"].strip()
                      for s in scene_segments
                      if s["text"].strip()
                  ).strip()

                  scene = {
                      "scene": int(row["scene"]),
                      "start": start,
                      "end": end,
                      "duration": float(row["duration"]),
                      "file": row["file"],
                      "transcript": text,
                      "segments": scene_segments
                  }

                  scenes.append(scene)

          with open(
              "output/stage05/scene_manifest.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  scenes,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              "output/stage05/scene_manifest.csv",
              "w",
              encoding="utf-8",
              newline=""
          ) as f:

              writer = csv.writer(f)

              writer.writerow([
                  "scene",
                  "start",
                  "end",
                  "duration",
                  "file",
                  "transcript"
              ])

              for scene in scenes:
                  writer.writerow([
                      f"{scene['scene']:03d}",
                      scene["start"],
                      scene["end"],
                      scene["duration"],
                      scene["file"],
                      scene["transcript"]
                  ])

          with open(
              "output/stage05/scene_manifest.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "PARECE MENTIRA - SCENE MANIFEST\n"
              )

              f.write(
                  "========================================\n\n"
              )

              for scene in scenes:

                  f.write(
                      f"CENA {scene['scene']:03d}\n"
                  )

                  f.write(
                      f"Inicio: {scene['start']:.3f}s\n"
                  )

                  f.write(
                      f"Fim: {scene['end']:.3f}s\n"
                  )

                  f.write(
                      f"Duracao: {scene['duration']:.3f}s\n"
                  )

                  f.write(
                      f"Arquivo: {scene['file']}\n"
                  )

                  f.write(
                      f"Fala: {scene['transcript'] or '[sem fala detectada]'}\n"
                  )

                  f.write(
                      "----------------------------------------\n"
                  )

          print("")
          print("========================================")
          print("SCENE MANIFEST")
          print("========================================")

          for scene in scenes:
              print(
                  f"CENA {scene['scene']:03d} | "
                  f"{scene['start']:.2f}-{scene['end']:.2f}s | "
                  f"{scene['transcript'] or '[sem fala]'}"
              )
          PY

          python3 /tmp/build_manifest.py

          test -s output/stage05/scene_manifest.json
          test -s output/stage05/scene_manifest.csv
          test -s output/stage05/scene_manifest.txt

      # =========================================================
      # VALIDAR STAGE 05
      # =========================================================

      - name: Validar Stage 05
        shell: bash
        run: |
          set -e

          SCENE_COUNT=$(find output/stage04_clips \
            -type f \
            -name "scene_*.mp4" \
            | wc -l)

          MANIFEST_COUNT=$(python3 - <<'PY'
          import json

          with open(
              "output/stage05/scene_manifest.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(len(data))
          PY
          )

          echo "Cenas Stage 04: $SCENE_COUNT"
          echo "Cenas Manifesto: $MANIFEST_COUNT"

          if [ "$SCENE_COUNT" -ne "$MANIFEST_COUNT" ]; then
            echo "ERRO: numero de cenas nao corresponde."
            exit 1
          fi

          echo "========================================"
          echo "STAGE 05 VALIDADO"
          echo "Transcricao: OK"
          echo "Sincronizacao com cenas: OK"
          echo "Manifesto: OK"
          echo "========================================"

      # =========================================================
      # STAGE 06 - REMONTAGEM EDITORIAL REAL
      #
      # Nesta versao o video muda de verdade:
      # - cria um cold open curto a partir do climax
      # - remove os respiros mudos 003 e 005
      # - quebra a cena longa 006 em dois blocos
      # - desloca o bloco "TV/passsageiros" para antes do mapa
      # - preserva o encerramento 011 no final
      #
      # O Stage 01 permanece congelado.
      # =========================================================

      - name: Stage 06 - Criar Subcortes e Plano Real
        shell: bash
        run: |
          set -e

          mkdir -p output/stage06/parts

          echo "========================================"
          echo "STAGE 06 - REMONTAGEM EDITORIAL REAL"
          echo "========================================"

          # -----------------------------------------------------
          # COLD OPEN:
          # usa os 3.2s finais da cena 010 como teaser visual.
          # -----------------------------------------------------

          SCENE10_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/stage04_clips/scene_010.mp4)

          COLD_START=$(awk -v d="$SCENE10_DURATION" \
            'BEGIN { s=d-3.2; if (s<0) s=0; printf "%.3f", s }')

          ffmpeg -y \
            -ss "$COLD_START" \
            -i output/stage04_clips/scene_010.mp4 \
            -t 3.2 \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/stage06/parts/00_cold_open.mp4

          # -----------------------------------------------------
          # CENA 006:
          # separa a explicacao do combustivel/espera
          # do restante da preparacao para o pouso.
          # -----------------------------------------------------

          ffmpeg -y \
            -ss 0 \
            -i output/stage04_clips/scene_006.mp4 \
            -t 8.8 \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/stage06/parts/06a_combustivel.mp4

          ffmpeg -y \
            -ss 8.8 \
            -i output/stage04_clips/scene_006.mp4 \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/stage06/parts/06b_preparacao.mp4

          # -----------------------------------------------------
          # PLANO EDITORIAL REAL
          #
          # NOVA ORDEM:
          #
          # cold open do climax
          # problema
          # piloto
          # passageiros/TV
          # combustivel
          # MAPA (Stage 07)
          # preparacao
          # pouso completo
          # encerramento
          # -----------------------------------------------------

          cat > output/stage06/remontage_plan.txt <<'EOF'
          PARECE MENTIRA - REMONTAGEM REAL V11
          ========================================

          ORDEM VISUAL

          00  cold open - trecho final da cena 010
          01  cena 001 - descoberta do problema
          02  cena 002 - risco do pouso
          03  cena 004 - piloto mantem a calma
          04  cena 007 - passageiros e TV
          05  cena 008 - tensao
          06  cena 009 - TV ao vivo
          07  cena 006A - combustivel / espera
          08  incremento externo - MAPA ANIMADO
          09  cena 006B - preparacao para o pouso
          10  cena 010 - pouso e desfecho
          11  cena 011 - assinatura final

          REMOVIDAS DO CORTE PRINCIPAL

          cena 003 - respiro mudo
          cena 005 - respiro mudo

          OBSERVACAO

          O cold open e propositalmente um teaser curto do climax.
          A narracao final sera refeita posteriormente e nao depende
          da ordem do audio original.
          EOF

          test -s output/stage06/parts/00_cold_open.mp4
          test -s output/stage06/parts/06a_combustivel.mp4
          test -s output/stage06/parts/06b_preparacao.mp4
          test -s output/stage06/remontage_plan.txt

      # =========================================================
      # STAGE 07 - MAPA REAL + ANIMACAO
      #
      # Episodio atual:
      # JetBlue Flight 292
      # Burbank -> fly-by Long Beach -> espera sobre SoCal -> LAX
      #
      # Tenta baixar um mapa real OpenStreetMap.
      # Se o servidor nao responder, gera fallback cartografico local.
      # Depois anima zoom/rota por 4.5 segundos.
      # =========================================================

      - name: Stage 07 - Instalar Dependencias do Mapa
        shell: bash
        run: |
          set -e
          python3 -m pip install pillow requests

      - name: Stage 07 - Criar Mapa Base
        shell: bash
        run: |
          set -e

          mkdir -p output/stage07

          cat > /tmp/build_map.py <<'PY'
          import io
          import math
          import os
          import requests
          from PIL import Image, ImageDraw, ImageFont

          OUT = "output/stage07/map_base.png"

          # Centro aproximado do corredor Burbank -> Long Beach -> LAX.
          center_lat = 33.98
          center_lon = -118.18
          zoom = 9
          width = 1080
          height = 1920

          # Pontos reais aproximados.
          points = [
              ("BURBANK", 34.2007, -118.3587),
              ("LONG BEACH", 33.8177, -118.1516),
              ("LAX", 33.9416, -118.4085),
          ]

          def mercator_px(lat, lon, z):
              n = 2 ** z
              x = (lon + 180.0) / 360.0 * 256 * n
              lat_rad = math.radians(lat)
              y = (
                  1.0
                  - math.asinh(math.tan(lat_rad)) / math.pi
              ) / 2.0 * 256 * n
              return x, y

          def get_font(size):
              candidates = [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf",
              ]
              for path in candidates:
                  if os.path.exists(path):
                      return ImageFont.truetype(path, size=size)
              return ImageFont.load_default()

          font_big = get_font(46)
          font_small = get_font(34)
          font_tiny = get_font(28)

          def fallback_map():
              img = Image.new("RGB", (width, height), (18, 37, 48))
              draw = ImageDraw.Draw(img, "RGBA")

              # grade cartografica sutil
              for x in range(0, width, 120):
                  draw.line((x, 0, x, height), fill=(255,255,255,20), width=1)
              for y in range(0, height, 120):
                  draw.line((0, y, width, y), fill=(255,255,255,20), width=1)

              # costa estilizada
              coast = [
                  (0, 520), (170, 560), (260, 650), (320, 780),
                  (360, 920), (420, 1080), (520, 1200),
                  (690, 1320), (820, 1500), (1080, 1620)
              ]
              draw.line(coast, fill=(96, 185, 190, 180), width=7)
              return img

          img = None

          # Tenta mapa real via staticmap.openstreetmap.de
          url = (
              "https://staticmap.openstreetmap.de/staticmap.php"
              f"?center={center_lat},{center_lon}"
              f"&zoom={zoom}"
              f"&size={width}x{height}"
              "&maptype=mapnik"
          )

          try:
              r = requests.get(
                  url,
                  timeout=25,
                  headers={
                      "User-Agent": "PareceMentiraVideoEngine/1.0"
                  },
              )
              r.raise_for_status()
              candidate = Image.open(io.BytesIO(r.content)).convert("RGB")
              if candidate.size == (width, height):
                  img = candidate
          except Exception as exc:
              print("Mapa online indisponivel:", exc)

          if img is None:
              print("Usando fallback cartografico local.")
              img = fallback_map()

          draw = ImageDraw.Draw(img, "RGBA")

          cx, cy = mercator_px(center_lat, center_lon, zoom)

          def to_image(lat, lon):
              x, y = mercator_px(lat, lon, zoom)
              return (
                  width / 2 + (x - cx),
                  height / 2 + (y - cy),
              )

          route = [to_image(lat, lon) for _, lat, lon in points]

          # rota principal
          draw.line(
              route,
              fill=(255, 255, 255, 230),
              width=12,
              joint="curve",
          )

          # circulos de espera proximo ao corredor entre Long Beach/LAX
          hold_x = (route[1][0] + route[2][0]) / 2
          hold_y = (route[1][1] + route[2][1]) / 2

          for radius in (75, 105, 135):
              draw.ellipse(
                  (
                      hold_x-radius,
                      hold_y-radius,
                      hold_x+radius,
                      hold_y+radius,
                  ),
                  outline=(255, 255, 255, 80),
                  width=5,
              )

          # marcadores
          for label, lat, lon in points:
              x, y = to_image(lat, lon)

              draw.ellipse(
                  (x-18, y-18, x+18, y+18),
                  fill=(255,255,255,255),
                  outline=(0,0,0,150),
                  width=3,
              )

              draw.rounded_rectangle(
                  (x+28, y-26, x+28+260, y+26),
                  radius=14,
                  fill=(0,0,0,170),
              )

              draw.text(
                  (x+40, y-19),
                  label,
                  font=font_tiny,
                  fill=(255,255,255,255),
              )

          # cabecalho
          draw.rounded_rectangle(
              (55, 80, width-55, 260),
              radius=32,
              fill=(0,0,0,180),
          )

          draw.text(
              (95, 110),
              "JETBLUE 292",
              font=font_big,
              fill=(255,255,255,255),
          )

          draw.text(
              (95, 175),
              "Burbank  ->  Long Beach  ->  LAX",
              font=font_small,
              fill=(255,255,255,230),
          )

          # legenda da espera
          draw.rounded_rectangle(
              (70, height-300, width-70, height-120),
              radius=28,
              fill=(0,0,0,175),
          )

          draw.text(
              (105, height-260),
              "Horas no ar para reduzir o peso",
              font=font_small,
              fill=(255,255,255,255),
          )

          draw.text(
              (105, height-205),
              "antes do pouso de emergencia",
              font=font_small,
              fill=(255,255,255,230),
          )

          img.save(OUT, "PNG")
          print("Mapa criado:", OUT)
          PY

          python3 /tmp/build_map.py
          test -s output/stage07/map_base.png

      - name: Stage 07 - Animar Mapa
        shell: bash
        run: |
          set -e

          # Zoom progressivo de 4.5s.
          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i output/stage07/map_base.png \
            -vf "scale=1080:1920,zoompan=z='min(zoom+0.0018,1.16)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=135:s=1080x1920:fps=30,fade=t=in:st=0:d=0.25,fade=t=out:st=4.15:d=0.35,format=yuv420p" \
            -t 4.5 \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -movflags +faststart \
            output/stage07/map_insert.mp4

          test -s output/stage07/map_insert.mp4

      # =========================================================
      # STAGE 07 - MONTAGEM FINAL DA REMONTAGEM VISUAL
      # =========================================================

      - name: Stage 07 - Montar Rough Cut com Incremento
        shell: bash
        run: |
          set -e

          cat > output/stage07/final_concat.txt <<EOF
          file '$(realpath output/stage06/parts/00_cold_open.mp4)'
          file '$(realpath output/stage04_clips/scene_001.mp4)'
          file '$(realpath output/stage04_clips/scene_002.mp4)'
          file '$(realpath output/stage04_clips/scene_004.mp4)'
          file '$(realpath output/stage04_clips/scene_007.mp4)'
          file '$(realpath output/stage04_clips/scene_008.mp4)'
          file '$(realpath output/stage04_clips/scene_009.mp4)'
          file '$(realpath output/stage06/parts/06a_combustivel.mp4)'
          file '$(realpath output/stage07/map_insert.mp4)'
          file '$(realpath output/stage06/parts/06b_preparacao.mp4)'
          file '$(realpath output/stage04_clips/scene_010.mp4)'
          file '$(realpath output/stage04_clips/scene_011.mp4)'
          EOF

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i output/stage07/final_concat.txt \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/stage07/remontagem_com_mapa.mp4

          test -s output/stage07/remontagem_com_mapa.mp4

      # =========================================================
      # VALIDAR STAGES 06 E 07
      # =========================================================

      - name: Validar Remontagem V11
        shell: bash
        run: |
          set -e

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            output/stage07/remontagem_com_mapa.mp4)

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            output/stage07/remontagem_com_mapa.mp4)

          FINAL_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/stage07/remontagem_com_mapa.mp4)

          AUDIO_COUNT=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            output/stage07/remontagem_com_mapa.mp4 \
            | wc -l)

          if [ "$WIDTH" != "1080" ] || [ "$HEIGHT" != "1920" ]; then
            echo "ERRO: remontagem fora de 1080x1920."
            exit 1
          fi

          if [ "$AUDIO_COUNT" -ne 0 ]; then
            echo "ERRO: remontagem possui audio."
            exit 1
          fi

          echo "========================================"
          echo "V11 VALIDADO"
          echo "Remontagem real: OK"
          echo "Mapa inserido: OK"
          echo "Resolucao: 1080x1920"
          echo "Duracao final: $FINAL_DURATION"
          echo "Audio: removido"
          echo "========================================"

      # =========================================================
      # STAGE 08 - NOVA NARRACAO + SINCRONIZACAO
      #
      # Objetivos:
      # - criar um roteiro novo para a remontagem V11
      # - gerar voz PT-BR com fallback em cascata
      # - ajustar a locucao ao tempo do video
      # - mixar a narracao no video remontado
      #
      # Ordem de TTS:
      # 1) edge-tts
      # 2) gTTS
      # 3) espeak-ng
      #
      # Se um caminho falhar, o proximo e tentado sem perder
      # nenhum dos stages anteriores.
      # =========================================================

      - name: Stage 08 - Instalar TTS
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y espeak-ng

          python3 -m pip install edge-tts gTTS

      - name: Stage 08 - Criar Roteiro Final
        shell: bash
        run: |
          set -e

          mkdir -p output/stage08

          cat > output/stage08/narration_script.txt <<'EOF'
          Este pouso terminou bem. Mas poucos minutos antes, ninguém sabia se as 146 pessoas a bordo sairiam vivas.

          Durante o voo 292 da JetBlue, o piloto percebeu que o trem de pouso dianteiro estava travado de lado. Se tocasse a pista daquele jeito, o avião poderia perder o controle.

          Enquanto a tripulação mantinha a calma, os passageiros assistiam pela televisão do próprio avião à cobertura ao vivo do que poderia ser o acidente deles.

          O Airbus ainda estava pesado demais. Então a tripulação permaneceu no ar, queimando combustível antes da tentativa final.

          Depois de horas de tensão, o comandante Scott Burke iniciou a aproximação para Los Angeles. Ele manteve o nariz do avião suspenso o máximo possível, reduzindo a velocidade antes de deixar as rodas dianteiras tocarem a pista.

          Os pneus se desgastaram, soltaram faíscas, mas o avião permaneceu sob controle.

          Todos os 146 passageiros e tripulantes sobreviveram sem ferimentos graves.

          Parece mentira. Mas aconteceu.
          EOF

          test -s output/stage08/narration_script.txt

      - name: Stage 08 - Gerar Narracao com Fallback
        shell: bash
        run: |
          set -e

          mkdir -p output/stage08
          rm -f output/stage08/narration_raw.mp3
          rm -f output/stage08/tts_engine.txt

          TEXT=$(cat output/stage08/narration_script.txt)

          echo "========================================"
          echo "TENTATIVA 1 - EDGE TTS"
          echo "========================================"

          if edge-tts \
            --voice pt-BR-AntonioNeural \
            --rate="-4%" \
            --text "$TEXT" \
            --write-media output/stage08/narration_raw.mp3; then

            if [ -s output/stage08/narration_raw.mp3 ]; then
              echo "edge-tts" > output/stage08/tts_engine.txt
            fi
          fi

          if [ ! -s output/stage08/narration_raw.mp3 ]; then
            echo "========================================"
            echo "TENTATIVA 2 - GTTS"
            echo "========================================"

            python3 - <<'PY'
          from gtts import gTTS
          from pathlib import Path

          text = Path(
              "output/stage08/narration_script.txt"
          ).read_text(encoding="utf-8")

          try:
              tts = gTTS(
                  text=text,
                  lang="pt",
                  tld="com.br",
                  slow=False
              )
              tts.save(
                  "output/stage08/narration_raw.mp3"
              )
          except Exception as exc:
              print("gTTS falhou:", exc)
          PY

            if [ -s output/stage08/narration_raw.mp3 ]; then
              echo "gTTS" > output/stage08/tts_engine.txt
            fi
          fi

          if [ ! -s output/stage08/narration_raw.mp3 ]; then
            echo "========================================"
            echo "TENTATIVA 3 - ESPEAK-NG"
            echo "========================================"

            espeak-ng \
              -v pt-br \
              -s 158 \
              -f output/stage08/narration_script.txt \
              -w output/stage08/narration_espeak.wav

            ffmpeg -y \
              -i output/stage08/narration_espeak.wav \
              -c:a libmp3lame \
              -b:a 160k \
              output/stage08/narration_raw.mp3

            if [ -s output/stage08/narration_raw.mp3 ]; then
              echo "espeak-ng" > output/stage08/tts_engine.txt
            fi
          fi

          if [ ! -s output/stage08/narration_raw.mp3 ]; then
            echo "ERRO: nenhum motor TTS conseguiu gerar a narracao."
            exit 1
          fi

          echo "Motor utilizado:"
          cat output/stage08/tts_engine.txt

      # =========================================================
      # AJUSTAR A LOCUCAO AO VIDEO
      #
      # A voz nao e cortada.
      # Se estiver longa, acelera de forma moderada.
      # Se estiver curta, preserva pausas naturais.
      # =========================================================

      - name: Stage 08 - Ajustar Duracao da Narracao
        shell: bash
        run: |
          set -e

          VIDEO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/stage07/remontagem_com_mapa.mp4)

          AUDIO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/stage08/narration_raw.mp3)

          # Reserva 1.2s no inicio e 1.5s no fim.
          TARGET=$(awk -v d="$VIDEO_DURATION" \
            'BEGIN { t=d-2.7; if (t<1) t=d; printf "%.3f", t }')

          RATIO=$(awk \
            -v a="$AUDIO_DURATION" \
            -v t="$TARGET" \
            'BEGIN { printf "%.6f", a/t }')

          echo "Video: $VIDEO_DURATION"
          echo "Narracao original: $AUDIO_DURATION"
          echo "Janela alvo: $TARGET"
          echo "Razao: $RATIO"

          # atempo > 1 acelera.
          # Mantemos dentro de uma faixa natural.
          TEMPO=$(awk -v r="$RATIO" '
            BEGIN {
              if (r < 0.90) r = 0.90;
              if (r > 1.18) r = 1.18;
              printf "%.6f", r
            }')

          echo "atempo aplicado: $TEMPO"

          ffmpeg -y \
            -i output/stage08/narration_raw.mp3 \
            -filter:a "atempo=${TEMPO},volume=1.05" \
            -c:a aac \
            -b:a 160k \
            output/stage08/narration_fitted.m4a

          test -s output/stage08/narration_fitted.m4a

      # =========================================================
      # CRIAR AUDIO COM RESPIRO INICIAL
      # =========================================================

      - name: Stage 08 - Posicionar Narracao
        shell: bash
        run: |
          set -e

          ffmpeg -y \
            -i output/stage08/narration_fitted.m4a \
            -filter_complex \
            "[0:a]adelay=1200|1200,apad=pad_dur=2.0[a]" \
            -map "[a]" \
            -c:a aac \
            -b:a 160k \
            output/stage08/narration_timeline.m4a

          test -s output/stage08/narration_timeline.m4a

      # =========================================================
      # MUX FINAL DA NARRACAO
      # =========================================================

      - name: Stage 08 - Criar Video Narrado
        shell: bash
        run: |
          set -e

          ffmpeg -y \
            -i output/stage07/remontagem_com_mapa.mp4 \
            -i output/stage08/narration_timeline.m4a \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v copy \
            -c:a aac \
            -b:a 160k \
            -shortest \
            -movflags +faststart \
            output/stage08/remontagem_narrada.mp4

          test -s output/stage08/remontagem_narrada.mp4

      # =========================================================
      # VALIDAR STAGE 08
      # =========================================================

      - name: Validar Stage 08
        shell: bash
        run: |
          set -e

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            output/stage08/remontagem_narrada.mp4)

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            output/stage08/remontagem_narrada.mp4)

          AUDIO_COUNT=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            output/stage08/remontagem_narrada.mp4 \
            | wc -l)

          FINAL_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/stage08/remontagem_narrada.mp4)

          if [ "$WIDTH" != "1080" ] || [ "$HEIGHT" != "1920" ]; then
            echo "ERRO: Stage 08 fora de 1080x1920."
            exit 1
          fi

          if [ "$AUDIO_COUNT" -lt 1 ]; then
            echo "ERRO: Stage 08 sem narracao."
            exit 1
          fi

          echo "========================================"
          echo "STAGE 08 VALIDADO"
          echo "Narracao: OK"
          echo "Resolucao: 1080x1920"
          echo "Duracao: $FINAL_DURATION"
          echo "Motor TTS:"
          cat output/stage08/tts_engine.txt
          echo "========================================"

      # =========================================================
      # ARTIFACTS
      # =========================================================

      - name: Disponibilizar Stage 01
        uses: actions/upload-artifact@v4
        with:
          name: stage-01-clean-master
          path: output/clean_master.mp4
          retention-days: 7
          if-no-files-found: error

      - name: Disponibilizar Stage 02
        uses: actions/upload-artifact@v4
        with:
          name: stage-02-editorial-master
          path: |
            output/editorial_master.mp4
            output/source_report.txt
            output/editorial_report.txt
          retention-days: 7
          if-no-files-found: error

      - name: Disponibilizar Stage 03
        uses: actions/upload-artifact@v4
        with:
          name: stage-03-scene-analysis
          path: |
            output/scene_report.txt
            output/scene_times.txt
            output/scene_detection_raw.txt
            output/scenes/*.jpg
          retention-days: 7
          if-no-files-found: error

      - name: Disponibilizar Stage 04
        uses: actions/upload-artifact@v4
        with:
          name: stage-04-scene-clips
          path: |
            output/stage04_clips/*.mp4
            output/edit_plan.csv
            output/edit_plan.txt
          retention-days: 7
          if-no-files-found: error

      - name: Disponibilizar Stage 05
        uses: actions/upload-artifact@v4
        with:
          name: stage-05-content-understanding
          path: |
            output/stage05/transcript.txt
            output/stage05/transcript.json
            output/stage05/scene_manifest.txt
            output/stage05/scene_manifest.csv
            output/stage05/scene_manifest.json
          retention-days: 7
          if-no-files-found: error

      - name: Disponibilizar Stage 06
        uses: actions/upload-artifact@v4
        with:
          name: stage-06-real-remontage
          path: |
            output/stage06/remontage_plan.txt
            output/stage06/parts/*.mp4
          retention-days: 7
          if-no-files-found: error

      - name: Disponibilizar Stage 07
        uses: actions/upload-artifact@v4
        with:
          name: stage-07-remontage-with-map
          path: |
            output/stage07/map_base.png
            output/stage07/map_insert.mp4
            output/stage07/final_concat.txt
            output/stage07/remontagem_com_mapa.mp4
          retention-days: 7
          if-no-files-found: error

      - name: Disponibilizar Stage 08
        uses: actions/upload-artifact@v4
        with:
          name: stage-08-narrated-video
          path: |
            output/stage08/narration_script.txt
            output/stage08/tts_engine.txt
            output/stage08/narration_raw.mp3
            output/stage08/narration_fitted.m4a
            output/stage08/narration_timeline.m4a
            output/stage08/remontagem_narrada.mp4
          retention-days: 7
          if-no-files-found: error
