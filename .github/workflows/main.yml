name: Parece Mentira - Video Engine V4

on:
  workflow_dispatch:

concurrency:
  group: parece-mentira-video-engine
  cancel-in-progress: true

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:

      # =========================================================
      # SETUP
      # =========================================================

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # =========================================================
      # LOCALIZAR ARQUIVOS
      # =========================================================

      - name: Localizar arquivos
        shell: bash
        run: |
          set -e

          VIDEO=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "*.mp4" \
            ! -path "./output/*" \
            | head -1)

          if [ -z "$VIDEO" ]; then
            echo "ERRO: nenhum MP4 encontrado."
            exit 1
          fi

          if [ ! -f "./logo_parece_mentira.png" ]; then
            echo "ERRO: logo_parece_mentira.png nao encontrada."
            exit 1
          fi

          echo "VIDEO=$VIDEO" >> "$GITHUB_ENV"

          echo "========================================"
          echo "ARQUIVOS LOCALIZADOS"
          echo "Video: $VIDEO"
          echo "Logo: ./logo_parece_mentira.png"
          echo "========================================"

      # =========================================================
      # ANALISE DO VIDEO
      # =========================================================

      - name: Analisar video original
        shell: bash
        run: |
          set -e

          mkdir -p output

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$VIDEO")

          if [ -z "$DURATION" ]; then
            echo "ERRO: duracao nao identificada."
            exit 1
          fi

          FINAL_START=$(awk -v d="$DURATION" \
            'BEGIN { s=d-2.5; if (s<0) s=0; printf "%.3f", s }')

          echo "DURATION=$DURATION" >> "$GITHUB_ENV"
          echo "FINAL_START=$FINAL_START" >> "$GITHUB_ENV"

          ffprobe \
            -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$VIDEO" \
            > output/source_report.txt

          echo "Duracao: $DURATION"
          echo "Assinatura final inicia em: $FINAL_START"

      # =========================================================
      # STAGE 01 - SOURCE BRANDING
      #
      # REGRA:
      # - timeline preservada
      # - topo desaparece mais devagar
      # - baixo precisa estar 100% visivel no 9s
      # - logo mais larga para cobrir melhor
      # =========================================================

      - name: Stage 01 - Branding Ajustado
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STAGE 01 - BRANDING AJUSTADO"
          echo "Timeline original preservada"
          echo "Logo menor altura / maior largura"
          echo "Topo some devagar"
          echo "Baixo ja entra 100% no 9s"
          echo "========================================"

          ffmpeg -y \
            -i "$VIDEO" \
            -loop 1 -framerate 30 -i "./logo_parece_mentira.png" \
            -loop 1 -framerate 30 -i "./logo_parece_mentira.png" \
            -filter_complex "\
            [0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1[base];\
            \
            [1:v]scale=240:118,format=rgba,split=10[l1][l2][l3][l4][l5][l6][l7][l8][l9][l10];\
            \
            [l1]fade=t=out:st=8.95:d=0.55:alpha=1[top0];\
            [l2]fade=t=in:st=8.60:d=0.40:alpha=1,fade=t=out:st=17.95:d=0.55:alpha=1[bottom0];\
            [l3]fade=t=in:st=17.60:d=0.40:alpha=1,fade=t=out:st=26.95:d=0.55:alpha=1[top1];\
            [l4]fade=t=in:st=26.60:d=0.40:alpha=1,fade=t=out:st=35.95:d=0.55:alpha=1[bottom1];\
            [l5]fade=t=in:st=35.60:d=0.40:alpha=1,fade=t=out:st=44.95:d=0.55:alpha=1[top2];\
            [l6]fade=t=in:st=44.60:d=0.40:alpha=1,fade=t=out:st=53.95:d=0.55:alpha=1[bottom2];\
            [l7]fade=t=in:st=53.60:d=0.40:alpha=1,fade=t=out:st=62.95:d=0.55:alpha=1[top3];\
            [l8]fade=t=in:st=62.60:d=0.40:alpha=1,fade=t=out:st=71.95:d=0.55:alpha=1[bottom3];\
            [l9]fade=t=in:st=71.60:d=0.40:alpha=1,fade=t=out:st=80.95:d=0.55:alpha=1[top4];\
            [l10]fade=t=in:st=80.60:d=0.40:alpha=1[bottom4];\
            \
            [base][top0]overlay=x=W-w-5:y=390:enable='between(t,0,9.5)'[v1];\
            [v1][bottom0]overlay=x=20:y=H-h-605:enable='between(t,8.6,18.5)'[v2];\
            [v2][top1]overlay=x=W-w-5:y=390:enable='between(t,17.6,27.5)'[v3];\
            [v3][bottom1]overlay=x=20:y=H-h-605:enable='between(t,26.6,36.5)'[v4];\
            [v4][top2]overlay=x=W-w-5:y=390:enable='between(t,35.6,45.5)'[v5];\
            [v5][bottom2]overlay=x=20:y=H-h-605:enable='between(t,44.6,54.5)'[v6];\
            [v6][top3]overlay=x=W-w-5:y=390:enable='between(t,53.6,63.5)'[v7];\
            [v7][bottom3]overlay=x=20:y=H-h-605:enable='between(t,62.6,72.5)'[v8];\
            [v8][top4]overlay=x=W-w-5:y=390:enable='between(t,71.6,81.5)'[v9];\
            [v9][bottom4]overlay=x=20:y=H-h-605:enable='gte(t,80.6)'[corner_branding];\
            \
            [2:v]scale=560:560,format=rgba,fade=t=in:st=${FINAL_START}:d=0.60:alpha=1[final_logo];\
            [corner_branding][final_logo]overlay=x=(W-w)/2:y=(H-h)/2:enable='gte(t,${FINAL_START})'[clean]" \
            -map "[clean]" \
            -map 0:a? \
            -t "$DURATION" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -c:a aac \
            -b:a 128k \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/clean_master.mp4

      # =========================================================
      # VALIDAR STAGE 01
      # =========================================================

      - name: Validar Stage 01
        shell: bash
        run: |
          set -e

          test -s output/clean_master.mp4

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            output/clean_master.mp4)

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            output/clean_master.mp4)

          CLEAN_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/clean_master.mp4)

          echo "Stage 01:"
          echo "${WIDTH}x${HEIGHT}"
          echo "$CLEAN_DURATION segundos"

          if [ "$WIDTH" != "1080" ] || [ "$HEIGHT" != "1920" ]; then
            echo "ERRO: Stage 01 fora de 1080x1920."
            exit 1
          fi

          echo "STAGE 01 VALIDADO."

      # =========================================================
      # STAGE 02 - EDITORIAL MASTER
      #
      # remove audio original
      # =========================================================

      - name: Stage 02 - Criar Editorial Master
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STAGE 02 - EDITORIAL MASTER"
          echo "Fonte: clean_master.mp4"
          echo "Audio original sera removido"
          echo "========================================"

          ffmpeg -y \
            -i output/clean_master.mp4 \
            -map 0:v:0 \
            -an \
            -vf "fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -movflags +faststart \
            output/editorial_master.mp4

      - name: Validar Stage 02
        shell: bash
        run: |
          set -e

          test -s output/editorial_master.mp4

          echo "========================================"
          echo "EDITORIAL MASTER"
          echo "========================================"

          ffprobe \
            -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=codec_type,codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            output/editorial_master.mp4 \
            | tee output/editorial_report.txt

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            output/editorial_master.mp4)

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            output/editorial_master.mp4)

          AUDIO_COUNT=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            output/editorial_master.mp4 \
            | wc -l)

          if [ "$WIDTH" != "1080" ] || [ "$HEIGHT" != "1920" ]; then
            echo "ERRO: Editorial Master fora de 1080x1920."
            exit 1
          fi

          if [ "$AUDIO_COUNT" -ne 0 ]; then
            echo "ERRO: audio original ainda presente."
            exit 1
          fi

          echo "========================================"
          echo "STAGE 02 CONCLUIDO"
          echo "1080x1920: OK"
          echo "30 FPS: configurado"
          echo "Audio original: removido"
          echo "Editorial Master pronto"
          echo "========================================"

      # =========================================================
      # STAGE 03 - DETECCAO DE CENAS
      # =========================================================

      - name: Stage 03 - Detectar Cenas
        shell: bash
        run: |
          set -e

          ffmpeg \
            -hide_banner \
            -i output/editorial_master.mp4 \
            -vf "select='gt(scene,0.32)',showinfo" \
            -an \
            -f null - \
            2> output/scene_detection_raw.txt || true

          grep "showinfo" \
            output/scene_detection_raw.txt \
            | grep "pts_time:" \
            | sed -n 's/.*pts_time:\([^ ]*\).*/\1/p' \
            > output/scene_times.txt || true

          echo "0.000000" > output/scene_report.txt

          if [ -s output/scene_times.txt ]; then
            cat output/scene_times.txt >> output/scene_report.txt
          fi

          echo "$DURATION" >> output/scene_report.txt

          awk '!seen[$0]++' output/scene_report.txt > output/scene_report_unique.txt
          mv output/scene_report_unique.txt output/scene_report.txt

          echo "PONTOS DE CENA:"
          cat output/scene_report.txt

      # =========================================================
      # STAGE 03 - PREVIEWS
      # =========================================================

      - name: Stage 03 - Gerar Previews
        shell: bash
        run: |
          set -e

          mkdir -p output/scenes

          INDEX=1

          while read TIME; do

            if [ -z "$TIME" ]; then
              continue
            fi

            printf -v NUMBER "%03d" "$INDEX"

            ffmpeg -y \
              -ss "$TIME" \
              -i output/editorial_master.mp4 \
              -frames:v 1 \
              -vf "scale=360:-2" \
              -q:v 3 \
              "output/scenes/scene_${NUMBER}_${TIME}s.jpg" \
              >/dev/null 2>&1 || true

            INDEX=$((INDEX + 1))

          done < output/scene_report.txt

      # =========================================================
      # ARTIFACTS
      # =========================================================

      - name: Disponibilizar Stage 01
        uses: actions/upload-artifact@v4
        with:
          name: stage-01-clean-master
          path: output/clean_master.mp4
          retention-days: 7
          if-no-files-found: error

      - name: Disponibilizar Stage 02
        uses: actions/upload-artifact@v4
        with:
          name: stage-02-editorial-master
          path: |
            output/editorial_master.mp4
            output/source_report.txt
            output/editorial_report.txt
          retention-days: 7
          if-no-files-found: error

      - name: Disponibilizar Stage 03
        uses: actions/upload-artifact@v4
        with:
          name: stage-03-scene-analysis
          path: |
            output/scene_report.txt
            output/scene_times.txt
            output/scene_detection_raw.txt
            output/scenes/*.jpg
          retention-days: 7
          if-no-files-found: error
