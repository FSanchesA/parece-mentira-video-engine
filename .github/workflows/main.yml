      - name: Stage 06 - Criar Contact Sheets
        shell: bash

        run: |
          set -e

          mkdir -p output/stage06_vision/frames
          mkdir -p output/stage06_vision/sheets

          cat > /tmp/contact_sheets.py <<'PY'
          import json
          import subprocess

          from pathlib import Path

          from PIL import (
              Image,
              ImageOps,
              ImageDraw,
              ImageFont
          )


          manifest = json.loads(
              Path(
                  "output/stage05/scene_manifest.json"
              ).read_text(
                  encoding="utf-8"
              )
          )


          frames_dir = Path(
              "output/stage06_vision/frames"
          )

          sheets_dir = Path(
              "output/stage06_vision/sheets"
          )


          def get_font(size):

              candidates = [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
              ]

              for p in candidates:

                  if Path(p).exists():

                      return ImageFont.truetype(
                          p,
                          size=size
                      )

              return ImageFont.load_default()


          font = get_font(28)


          def probe_duration(path):

              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(path)
                  ],
                  check=True,
                  capture_output=True,
                  text=True
              )

              return max(
                  float(
                      result.stdout.strip() or 0
                  ),
                  0.001
              )


          def extract_frame(
              clip,
              t,
              out
          ):

              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-ss",
                      f"{t:.6f}",
                      "-i",
                      str(clip),
                      "-frames:v",
                      "1",
                      "-vf",
                      "scale=320:-2",
                      "-q:v",
                      "3",
                      str(out)
                  ],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )


              if (
                  out.exists()
                  and
                  out.stat().st_size > 0
              ):

                  return


              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(clip),
                      "-frames:v",
                      "1",
                      "-vf",
                      "scale=320:-2",
                      "-q:v",
                      "3",
                      str(out)
                  ],
                  check=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )


              if (
                  not out.exists()
                  or
                  out.stat().st_size <= 0
              ):

                  raise RuntimeError(
                      f"Nao foi possivel extrair frame de {clip}"
                  )


          for scene in manifest:

              num = int(
                  scene["scene"]
              )

              clip = Path(
                  "output/stage04_clips"
              ) / f"scene_{num:03d}.mp4"


              if (
                  not clip.exists()
                  or
                  clip.stat().st_size <= 0
              ):

                  raise FileNotFoundError(
                      f"Clip ausente ou vazio: {clip}"
                  )


              duration = probe_duration(
                  clip
              )

              frame_paths = []

              for idx, fraction in enumerate(
                  (
                      0.20,
                      0.50,
                      0.80
                  ),
                  start=1
              ):

                  t = duration * fraction

                  t = min(
                      max(
                          t,
                          0.0
                      ),
                      max(
                          duration - 0.001,
                          0.0
                      )
                  )

                  out = frames_dir / (
                      f"scene_{num:03d}_{idx}.jpg"
                  )

                  extract_frame(
                      clip,
                      t,
                      out
                  )

                  frame_paths.append(
                      out
                  )


              imgs = [
                  Image.open(
                      p
                  ).convert(
                      "RGB"
                  )
                  for p in frame_paths
              ]


              height = max(
                  im.height
                  for im in imgs
              )


              canvas = Image.new(
                  "RGB",
                  (
                      320 * 3,
                      height + 56
                  ),
                  "white"
              )


              for i, im in enumerate(
                  imgs
              ):

                  if im.height != height:

                      im = ImageOps.pad(
                          im,
                          (
                              320,
                              height
                          ),
                          color="black"
                      )


                  canvas.paste(
                      im,
                      (
                          i * 320,
                          56
                      )
                  )


              draw = ImageDraw.Draw(
                  canvas
              )


              draw.text(
                  (
                      18,
                      12
                  ),
                  f"CENA {num:03d} | {duration:.1f}s",
                  fill="black",
                  font=font
              )


              sheet = sheets_dir / (
                  f"scene_{num:03d}.jpg"
              )


              canvas.save(
                  sheet,
                  "JPEG",
                  quality=82
              )


          print(
              "Contact sheets criadas."
          )
          PY

          python3 /tmp/contact_sheets.py

          test "$(find output/stage06_vision/sheets -name 'scene_*.jpg' | wc -l)" -gt 0


