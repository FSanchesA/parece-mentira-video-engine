name: Parece Mentira - Video Engine V15.21 Vision Frame Fix
run-name: ${{ inputs.app_job_tag != '' && format('APP {0}', inputs.app_job_tag) || 'Execucao manual' }}
on:
  workflow_dispatch:
    inputs:
      contexto:
        description: "Contexto do episodio (opcional)"
        required: false
        type: string
        default: ""
      etapa:
        description: "Etapa do processamento"
        required: true
        type: choice
        default: "COMPLETO_IA"
        options:
          - COMPLETO_IA
          - ACABAMENTO_SEM_IA
      modo:
        description: "Modo de narracao"
        required: true
        type: choice
        default: "AUTO"
        options:
          - AUTO
          - ORIGINAL
          - NOVA
          - SEM_NARRACAO
          - PLANO_MANUAL
      app_job_tag:
        description: "Tag do job criado pelo app"
        required: false
        type: string
        default: ""
      app_release_id:
        description: "Release ID do job criado pelo app"
        required: false
        type: string
        default: ""
      app_source_asset_id:
        description: "Asset ID do video enviado pelo app"
        required: false
        type: string
        default: ""
      app_source_filename:
        description: "Nome do video enviado pelo app"
        required: false
        type: string
        default: ""
permissions:
  contents: write
  actions: read

concurrency:
  group: parece-mentira-video-engine
  cancel-in-progress: true

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:

      # =========================================================
      # SETUP
      # =========================================================

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip

      # =========================================================
      # APP - BAIXAR VIDEO TEMPORARIO DA RELEASE
      # =========================================================

      - name: App - Baixar video enviado
        if: ${{ inputs.app_source_asset_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ASSET_ID: ${{ inputs.app_source_asset_id }}
          SOURCE_FILENAME: ${{ inputs.app_source_filename }}
        run: |
          set -e

          mkdir -p app_input

          SAFE_NAME=$(printf "%s" "${SOURCE_FILENAME:-video.mp4}" \
            | sed 's/[^A-Za-z0-9._-]/_/g')

          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="video.mp4"
          fi

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${SOURCE_ASSET_ID}" \
            -o "app_input/$SAFE_NAME"

          test -s "app_input/$SAFE_NAME"

          echo "APP_VIDEO=app_input/$SAFE_NAME" >> "$GITHUB_ENV"

          echo "VIDEO DO APP BAIXADO: app_input/$SAFE_NAME"

      # =========================================================
      # LOCALIZAR ARQUIVOS
      # =========================================================

      - name: Localizar arquivos
        shell: bash
        run: |
          set -e

          if [ -n "${APP_VIDEO:-}" ] && [ -s "$APP_VIDEO" ]; then
            VIDEO="$APP_VIDEO"
          else
            VIDEO=$(find . \
              -maxdepth 2 \
              -type f \
              -iname "*.mp4" \
              ! -path "./output/*" \
              ! -path "./app_input/*" \
              | head -1)
          fi

          if [ -z "$VIDEO" ]; then
            echo "ERRO: nenhum MP4 encontrado."
            exit 1
          fi

          if [ ! -f "./logo_parece_mentira.png" ]; then
            echo "ERRO: logo_parece_mentira.png nao encontrada."
            exit 1
          fi

          echo "VIDEO=$VIDEO" >> "$GITHUB_ENV"

          echo "========================================"
          echo "ARQUIVOS LOCALIZADOS"
          echo "Video: $VIDEO"
          echo "Logo: ./logo_parece_mentira.png"
          echo "========================================"

      # =========================================================
      # ANALISE DO VIDEO
      # =========================================================

      - name: Analisar video original
        shell: bash
        run: |
          set -e

          mkdir -p output

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$VIDEO")

          if [ -z "$DURATION" ]; then
            echo "ERRO: duracao nao identificada."
            exit 1
          fi

          FINAL_START=$(awk -v d="$DURATION" 'BEGIN { printf "%.3f", d-5.0 }')
          FINAL_FULL=$(awk -v d="$DURATION" 'BEGIN { printf "%.3f", d-4.0 }')
          SMALL_FADE_START=$(awk -v d="$DURATION" 'BEGIN { printf "%.3f", d-4.0 }')
          SMALL_FADE_END=$(awk -v d="$DURATION" 'BEGIN { printf "%.3f", d-3.0 }')

          echo "DURATION=$DURATION" >> "$GITHUB_ENV"
          echo "FINAL_START=$FINAL_START" >> "$GITHUB_ENV"
          echo "FINAL_FULL=$FINAL_FULL" >> "$GITHUB_ENV"
          echo "SMALL_FADE_START=$SMALL_FADE_START" >> "$GITHUB_ENV"
          echo "SMALL_FADE_END=$SMALL_FADE_END" >> "$GITHUB_ENV"

          ffprobe \
            -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$VIDEO" \
            > output/source_report.txt

          echo "Duracao: $DURATION"

      # =========================================================
      # STAGE 01 - SOURCE BRANDING
      # CONGELADO / APROVADO
      # =========================================================

      - name: Stage 01 - Branding Ajustado Final
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STAGE 01 - BRANDING APROVADO"
          echo "NAO ALTERAR"
          echo "========================================"

          ffmpeg -y \
            -i "$VIDEO" \
            -loop 1 -framerate 30 -i "./logo_parece_mentira.png" \
            -loop 1 -framerate 30 -i "./logo_parece_mentira.png" \
            -filter_complex "\
            [0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1[base];\
            \
            [1:v]scale=270:160,format=rgba,split=9[l1][l2][l3][l4][l5][l6][l7][l8][l9];\
            \
            [l1]fade=t=out:st=8.95:d=0.55:alpha=1[top0];\
            [l2]fade=t=in:st=8.60:d=0.40:alpha=1,fade=t=out:st=17.95:d=0.55:alpha=1[bottom0];\
            [l3]fade=t=in:st=17.60:d=0.40:alpha=1,fade=t=out:st=26.95:d=0.55:alpha=1[top1];\
            [l4]fade=t=in:st=26.60:d=0.40:alpha=1,fade=t=out:st=35.95:d=0.55:alpha=1[bottom1];\
            [l5]fade=t=in:st=35.60:d=0.40:alpha=1,fade=t=out:st=44.95:d=0.55:alpha=1[top2];\
            [l6]fade=t=in:st=44.60:d=0.40:alpha=1,fade=t=out:st=53.95:d=0.55:alpha=1[bottom2];\
            [l7]fade=t=in:st=53.60:d=0.40:alpha=1,fade=t=out:st=62.95:d=0.55:alpha=1[top3];\
            [l8]fade=t=in:st=62.60:d=0.40:alpha=1,fade=t=out:st=71.95:d=0.55:alpha=1[bottom3];\
            [l9]fade=t=in:st=71.60:d=0.40:alpha=1,fade=t=out:st=${SMALL_FADE_START}:d=1.00:alpha=1[top4];\
            \
            [base][top0]overlay=x=W-w-28:y=420:enable='between(t,0,9.5)'[v1];\
            [v1][bottom0]overlay=x=28:y=H-h-625:enable='between(t,8.6,18.5)'[v2];\
            [v2][top1]overlay=x=W-w-28:y=420:enable='between(t,17.6,27.5)'[v3];\
            [v3][bottom1]overlay=x=28:y=H-h-625:enable='between(t,26.6,36.5)'[v4];\
            [v4][top2]overlay=x=W-w-28:y=420:enable='between(t,35.6,45.5)'[v5];\
            [v5][bottom2]overlay=x=28:y=H-h-625:enable='between(t,44.6,54.5)'[v6];\
            [v6][top3]overlay=x=W-w-28:y=420:enable='between(t,53.6,63.5)'[v7];\
            [v7][bottom3]overlay=x=28:y=H-h-625:enable='between(t,62.6,72.5)'[v8];\
            [v8][top4]overlay=x=W-w-28:y=420:enable='between(t,71.6,${SMALL_FADE_END})'[corners];\
            \
            [2:v]scale=540:540,format=rgba,fade=t=in:st=${FINAL_START}:d=1.0:alpha=1[final_logo];\
            [corners][final_logo]overlay=x=(W-w)/2:y=(H-h)/2:enable='gte(t,${FINAL_START})'[clean]" \
            -map "[clean]" \
            -map 0:a? \
            -t "$DURATION" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -c:a aac \
            -b:a 128k \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/clean_master.mp4

      # =========================================================
      # VALIDAR STAGE 01
      # =========================================================

      - name: Validar Stage 01
        shell: bash
        run: |
          set -e

          test -s output/clean_master.mp4

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            output/clean_master.mp4)

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            output/clean_master.mp4)

          if [ "$WIDTH" != "1080" ] || [ "$HEIGHT" != "1920" ]; then
            echo "ERRO: Stage 01 fora de 1080x1920."
            exit 1
          fi

          echo "STAGE 01 VALIDADO."

      # =========================================================
      # STAGE 02 - EDITORIAL MASTER
      # =========================================================

      - name: Stage 02 - Criar Editorial Master
        shell: bash
        run: |
          set -e

          ffmpeg -y \
            -i output/clean_master.mp4 \
            -map 0:v:0 \
            -an \
            -vf "fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -movflags +faststart \
            output/editorial_master.mp4

      - name: Validar Stage 02
        shell: bash
        run: |
          set -e

          test -s output/editorial_master.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=codec_type,codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            output/editorial_master.mp4 \
            | tee output/editorial_report.txt

          AUDIO_COUNT=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            output/editorial_master.mp4 \
            | wc -l)

          if [ "$AUDIO_COUNT" -ne 0 ]; then
            echo "ERRO: Stage 02 ainda possui audio."
            exit 1
          fi

          echo "STAGE 02 VALIDADO."

      # =========================================================
      # STAGE 03 - DETECCAO DE CENAS
      # =========================================================

      - name: Stage 03 - Detectar Cenas
        shell: bash
        run: |
          set -e

          ffmpeg \
            -hide_banner \
            -i output/editorial_master.mp4 \
            -vf "select='gt(scene,0.32)',showinfo" \
            -an \
            -f null - \
            2> output/scene_detection_raw.txt || true

          grep "showinfo" \
            output/scene_detection_raw.txt \
            | grep "pts_time:" \
            | sed -n 's/.*pts_time:\([^ ]*\).*/\1/p' \
            > output/scene_times.txt || true

          echo "0.000000" > output/scene_report.txt

          if [ -s output/scene_times.txt ]; then
            cat output/scene_times.txt >> output/scene_report.txt
          fi

          echo "$DURATION" >> output/scene_report.txt

          awk '!seen[$0]++' \
            output/scene_report.txt \
            > output/scene_report_unique.txt

          mv \
            output/scene_report_unique.txt \
            output/scene_report.txt

          cat output/scene_report.txt

      # =========================================================
      # STAGE 03 - PREVIEWS
      # =========================================================

      - name: Stage 03 - Gerar Previews
        shell: bash
        run: |
          set -e

          mkdir -p output/scenes

          INDEX=1

          while read TIME; do

            if [ -z "$TIME" ]; then
              continue
            fi

            printf -v NUMBER "%03d" "$INDEX"

            ffmpeg -y \
              -ss "$TIME" \
              -i output/editorial_master.mp4 \
              -frames:v 1 \
              -vf "scale=360:-2" \
              -q:v 3 \
              "output/scenes/scene_${NUMBER}_${TIME}s.jpg" \
              >/dev/null 2>&1 || true

            INDEX=$((INDEX + 1))

          done < output/scene_report.txt

      # =========================================================
      # STAGE 04 - SCENE CUTTER
      # =========================================================

      - name: Stage 04 - Criar Clips de Cena
        shell: bash
        run: |
          set -e

          mkdir -p output/stage04_clips

          mapfile -t TIMES < output/scene_report.txt

          TOTAL_POINTS=${#TIMES[@]}

          if [ "$TOTAL_POINTS" -lt 2 ]; then
            echo "ERRO: pontos insuficientes para cortar cenas."
            exit 1
          fi

          echo "scene,start,end,duration,file" > output/edit_plan.csv
          echo "PARECE MENTIRA - EDIT PLAN" > output/edit_plan.txt

          CREATED=0

          for ((i=0; i<TOTAL_POINTS-1; i++)); do

            START="${TIMES[$i]}"
            END="${TIMES[$((i+1))]}"

            CLIP_DURATION=$(awk \
              -v start="$START" \
              -v end="$END" \
              'BEGIN { printf "%.6f", end-start }')

            VALID=$(awk \
              -v d="$CLIP_DURATION" \
              'BEGIN { if (d > 0.01) print 1; else print 0 }')

            if [ "$VALID" != "1" ]; then
              continue
            fi

            CREATED=$((CREATED + 1))

            printf -v NUMBER "%03d" "$CREATED"

            OUTPUT_FILE="output/stage04_clips/scene_${NUMBER}.mp4"

            ffmpeg -y \
              -ss "$START" \
              -i output/editorial_master.mp4 \
              -t "$CLIP_DURATION" \
              -map 0:v:0 \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -crf 20 \
              -pix_fmt yuv420p \
              -movflags +faststart \
              "$OUTPUT_FILE"

            echo "${NUMBER},${START},${END},${CLIP_DURATION},scene_${NUMBER}.mp4" \
              >> output/edit_plan.csv

            {
              echo ""
              echo "CENA $NUMBER"
              echo "Inicio: $START s"
              echo "Fim: $END s"
              echo "Duracao: $CLIP_DURATION s"
              echo "Arquivo: scene_${NUMBER}.mp4"
            } >> output/edit_plan.txt

          done

          if [ "$CREATED" -lt 1 ]; then
            echo "ERRO: nenhuma cena foi criada."
            exit 1
          fi

          echo "STAGE 04 OK - Cenas: $CREATED"

      # =========================================================
      # STAGE 05 - TRANSCRICAO / ENTENDIMENTO
      #
      # Agora suporta:
      # - video com narracao
      # - video sem narracao
      # - video apenas visual / com legenda embutida
      # =========================================================

      - name: Stage 05 - Instalar Whisper
        shell: bash
        run: |
          set -e
          python3 -m pip install --upgrade pip
          python3 -m pip install faster-whisper pillow

      - name: Stage 05 - Detectar Audio
        shell: bash
        run: |
          set -e

          mkdir -p output/stage05

          AUDIO_COUNT=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            output/clean_master.mp4 \
            | wc -l)

          if [ "$AUDIO_COUNT" -gt 0 ]; then
            echo "HAS_AUDIO=1" >> "$GITHUB_ENV"

            ffmpeg -y \
              -i output/clean_master.mp4 \
              -vn \
              -ac 1 \
              -ar 16000 \
              -c:a pcm_s16le \
              output/stage05/audio_whisper.wav
          else
            echo "HAS_AUDIO=0" >> "$GITHUB_ENV"

            # Arquivo de silencio apenas para manter o pipeline uniforme.
            ffmpeg -y \
              -f lavfi \
              -i anullsrc=r=16000:cl=mono \
              -t 1 \
              -c:a pcm_s16le \
              output/stage05/audio_whisper.wav
          fi

          test -s output/stage05/audio_whisper.wav

      - name: Stage 05 - Transcrever quando houver fala
        shell: bash
        run: |
          set -e

          cat > /tmp/transcribe_v15.py <<'PY'
          import json
          import os
          from pathlib import Path

          has_audio = os.getenv("HAS_AUDIO", "0") == "1"

          out_json = Path("output/stage05/transcript.json")
          out_txt = Path("output/stage05/transcript.txt")

          if not has_audio:
              result = {
                  "language": None,
                  "language_probability": 0,
                  "segments": []
              }

              out_json.write_text(
                  json.dumps(result, ensure_ascii=False, indent=2),
                  encoding="utf-8"
              )
              out_txt.write_text("", encoding="utf-8")
              print("Video sem audio: transcricao vazia criada.")
              raise SystemExit(0)

          from faster_whisper import WhisperModel

          model = WhisperModel(
              "small",
              device="cpu",
              compute_type="int8"
          )

          segments, info = model.transcribe(
              "output/stage05/audio_whisper.wav",
              language=None,
              task="transcribe",
              beam_size=5,
              vad_filter=True,
              word_timestamps=True
          )

          result = {
              "language": info.language,
              "language_probability": info.language_probability,
              "segments": []
          }

          full_text = []

          for segment in segments:
              item = {
                  "start": round(segment.start, 3),
                  "end": round(segment.end, 3),
                  "text": segment.text.strip(),
                  "words": []
              }

              if segment.words:
                  for word in segment.words:
                      item["words"].append({
                          "start": round(word.start, 3)
                              if word.start is not None else None,
                          "end": round(word.end, 3)
                              if word.end is not None else None,
                          "word": word.word
                      })

              result["segments"].append(item)

              if segment.text.strip():
                  full_text.append(segment.text.strip())

          out_json.write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          out_txt.write_text(
              "\n".join(full_text),
              encoding="utf-8"
          )

          print("Transcricao concluida.")
          PY

          python3 /tmp/transcribe_v15.py

          test -s output/stage05/transcript.json
          test -f output/stage05/transcript.txt

      - name: Stage 05 - Criar Manifesto de Cenas
        shell: bash
        run: |
          set -e

          cat > /tmp/build_manifest_v15.py <<'PY'
          import csv
          import json
          from pathlib import Path

          transcript = json.loads(
              Path("output/stage05/transcript.json")
              .read_text(encoding="utf-8")
          )

          segments = transcript.get("segments", [])
          scenes = []

          with open(
              "output/edit_plan.csv",
              "r",
              encoding="utf-8"
          ) as f:
              reader = csv.DictReader(f)

              for row in reader:
                  start = float(row["start"])
                  end = float(row["end"])

                  scene_segments = []

                  for seg in segments:
                      midpoint = (
                          float(seg["start"]) + float(seg["end"])
                      ) / 2

                      if start <= midpoint < end:
                          scene_segments.append(seg)

                  scene_text = " ".join(
                      s["text"].strip()
                      for s in scene_segments
                      if s.get("text", "").strip()
                  ).strip()

                  scenes.append({
                      "scene": int(row["scene"]),
                      "start": start,
                      "end": end,
                      "duration": float(row["duration"]),
                      "file": row["file"],
                      "transcript": scene_text,
                      "segments": scene_segments
                  })

          Path(
              "output/stage05/scene_manifest.json"
          ).write_text(
              json.dumps(
                  scenes,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          with open(
              "output/stage05/scene_manifest.txt",
              "w",
              encoding="utf-8"
          ) as f:
              for scene in scenes:
                  f.write(
                      f"CENA {scene['scene']:03d}\n"
                      f"Inicio: {scene['start']:.3f}s\n"
                      f"Fim: {scene['end']:.3f}s\n"
                      f"Duracao: {scene['duration']:.3f}s\n"
                      f"Fala: {scene['transcript'] or '[sem fala]'}\n"
                      "----------------------------------------\n"
                  )

          print(f"Manifesto criado: {len(scenes)} cenas")
          PY

          python3 /tmp/build_manifest_v15.py

          test -s output/stage05/scene_manifest.json
          test -s output/stage05/scene_manifest.txt

      # =========================================================
      # STAGE 06 - VISION PACK
      #
      # Gera uma folha visual por cena com 3 momentos:
      # 20%, 50% e 80%.
      #
      # Isso permite ao modelo multimodal entender o que realmente
      # aparece em cada cena, inclusive videos sem narracao.
      # =========================================================

      - name: Stage 06 - Criar Contact Sheets
        shell: bash
        run: |
          set -e

          mkdir -p output/stage06_vision/frames
          mkdir -p output/stage06_vision/sheets

          cat > /tmp/contact_sheets.py <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw, ImageFont

          manifest = json.loads(
              Path("output/stage05/scene_manifest.json")
              .read_text(encoding="utf-8")
          )

          frames_dir = Path("output/stage06_vision/frames")
          sheets_dir = Path("output/stage06_vision/sheets")

          def get_font(size):
              candidates = [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
              ]
              for p in candidates:
                  if Path(p).exists():
                      return ImageFont.truetype(p, size=size)
              return ImageFont.load_default()

          font = get_font(28)

          def probe_duration(path):
              result = subprocess.run([
                  "ffprobe", "-v", "error",
                  "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1",
                  str(path)
              ], check=True, capture_output=True, text=True)
              return max(float(result.stdout.strip() or 0), 0.001)

          def extract_frame(clip, t, out):
              # Primeiro tenta o ponto solicitado. Em cenas extremamente curtas,
              # o FFmpeg pode terminar sem erro e ainda assim nao gerar imagem.
              subprocess.run([
                  "ffmpeg", "-y",
                  "-ss", f"{t:.6f}",
                  "-i", str(clip),
                  "-frames:v", "1",
                  "-vf", "scale=320:-2",
                  "-q:v", "3",
                  str(out)
              ], check=False, stdout=subprocess.DEVNULL,
                 stderr=subprocess.DEVNULL)

              if out.exists() and out.stat().st_size > 0:
                  return

              # Fallback robusto: primeiro frame real do clip.
              subprocess.run([
                  "ffmpeg", "-y",
                  "-i", str(clip),
                  "-frames:v", "1",
                  "-vf", "scale=320:-2",
                  "-q:v", "3",
                  str(out)
              ], check=True, stdout=subprocess.DEVNULL,
                 stderr=subprocess.DEVNULL)

              if not out.exists() or out.stat().st_size <= 0:
                  raise RuntimeError(f"Nao foi possivel extrair frame de {clip}")

          for scene in manifest:
              num = int(scene["scene"])
              clip = Path("output/stage04_clips") / f"scene_{num:03d}.mp4"

              if not clip.exists() or clip.stat().st_size <= 0:
                  raise FileNotFoundError(f"Clip ausente ou vazio: {clip}")

              # Usa a duracao REAL do arquivo. Nao infla cenas curtas para 0.3 s,
              # pois isso fazia os seeks cairem depois do fim do clip.
              duration = probe_duration(clip)

              frame_paths = []

              for idx, fraction in enumerate((0.20, 0.50, 0.80), start=1):
                  # Mantem o seek estritamente dentro do clip.
                  t = duration * fraction
                  t = min(max(t, 0.0), max(duration - 0.001, 0.0))

                  out = frames_dir / f"scene_{num:03d}_{idx}.jpg"
                  extract_frame(clip, t, out)
                  frame_paths.append(out)

              imgs = [
                  Image.open(p).convert("RGB")
                  for p in frame_paths
              ]

              height = max(im.height for im in imgs)
              canvas = Image.new(
                  "RGB",
                  (320 * 3, height + 56),
                  "white"
              )

              for i, im in enumerate(imgs):
                  if im.height != height:
                      im = ImageOps.pad(
                          im,
                          (320, height),
                          color="black"
                      )

                  canvas.paste(im, (i * 320, 56))

              draw = ImageDraw.Draw(canvas)
              draw.text(
                  (18, 12),
                  f"CENA {num:03d} | {duration:.1f}s",
                  fill="black",
                  font=font
              )

              sheet = sheets_dir / f"scene_{num:03d}.jpg"
              canvas.save(sheet, "JPEG", quality=82)

          print("Contact sheets criadas.")
          PY

          python3 /tmp/contact_sheets.py

          test "$(find output/stage06_vision/sheets -name 'scene_*.jpg' | wc -l)" -gt 0

      # =========================================================
      # STAGE 06 - AI DIRECTOR MULTIMODAL - GEMINI
      #
      # Requer secret no GitHub:
      # GEMINI_API_KEY
      #
      # Usa Gemini 3.8 Flash no Free Tier recorrente,
      # sujeito aos limites de uso definidos pelo Google.
      # =========================================================

      - name: Stage 06 - Instalar Gemini SDK
        if: ${{ inputs.etapa != 'ACABAMENTO_SEM_IA' && inputs.modo != 'PLANO_MANUAL' }}
        shell: bash
        run: |
          set -e
          python3 -m pip install --upgrade google-genai

      - name: Stage 06 - AI Director Gemini
        if: ${{ inputs.etapa != 'ACABAMENTO_SEM_IA' && inputs.modo != 'PLANO_MANUAL' }}
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_CONTEXT: ${{ inputs.contexto }}
          USER_MODE: ${{ inputs.modo }}
        run: |
          set -e

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERRO: secret GEMINI_API_KEY nao configurado."
            echo "GitHub > Settings > Secrets and variables > Actions"
            exit 1
          fi

          mkdir -p output/stage06_ai

          cat > /tmp/ai_director_gemini.py <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          from google import genai
          from google.genai import types

          client = genai.Client(
              api_key=os.environ["GEMINI_API_KEY"]
          )

          user_context = os.getenv(
              "USER_CONTEXT",
              ""
          ).strip()

          user_mode = os.getenv(
              "USER_MODE",
              "AUTO"
          ).strip()

          manifest = json.loads(
              Path(
                  "output/stage05/scene_manifest.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          original_transcript = Path(
              "output/stage05/transcript.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          transcript_meta = json.loads(
              Path(
                  "output/stage05/transcript.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          source_language = str(
              transcript_meta.get("language") or "unknown"
          ).strip().lower()

          source_language_probability = float(
              transcript_meta.get("language_probability") or 0
          )

          total_duration = sum(
              float(s["duration"])
              for s in manifest
          )

          narration_target = max(
              total_duration - 2.0,
              8.0
          )

          target_words = max(
              20,
              int(narration_target * 2.15)
          )

          instructions = f"""
          Voce e o DIRETOR EDITORIAL MULTIMODAL do canal PARECE MENTIRA.

          Sua tarefa NAO e simplesmente reescrever a narracao original.
          Sua tarefa e EDITAR a historia de forma audiovisual.

          Pense como editor de video curto:
          - cada corte precisa ter funcao narrativa
          - a imagem precisa mudar quando a ideia muda
          - cenas repetitivas devem ser reduzidas
          - nao use todas as cenas apenas porque existem
          - nao deixe uma unica tomada longa dominar o video
          - evite sensacao de slideshow lento ou de voz apenas colocada sobre o original

          DADOS DO EPISODIO:
          - Duracao visual disponivel: {total_duration:.2f}s
          - Duracao alvo maxima de narracao: {narration_target:.2f}s
          - Alvo aproximado de palavras: no maximo {target_words}
          - Modo solicitado: {user_mode}
          - Contexto fornecido pelo usuario:
            {user_context or "[nao informado]"}
          - Idioma detectado na fala original: {source_language}
          - Confianca da deteccao de idioma: {source_language_probability:.3f}
          - Transcricao original NO IDIOMA ORIGINAL:
            {original_transcript or "[sem narracao detectada]"}

          PRINCIPIO CENTRAL:
          VIDEO E NARRACAO DEVEM SER PLANEJADOS JUNTOS.
          Nao monte primeiro o video e depois encaixe a voz.
          Nao escreva primeiro toda a fala para depois procurar imagens.

          REGRAS OBRIGATORIAS:

          1. LEIA O VIDEO VISUALMENTE.
             Cada cena vem com uma contact sheet de tres momentos.
             Use as imagens para identificar:
             - assunto da cena
             - acao principal
             - mudanca de enquadramento
             - repeticao visual
             - potencial emocional
             - melhor momento para fala associada

          2. NAO USE TODAS AS CENAS POR OBRIGACAO.
             Se uma cena nao acrescentar informacao, ritmo, emocao ou continuidade,
             OMITA.
             Um bom corte e melhor que preencher tempo.

          3. CONTROLE DE REPETICAO VISUAL.
             Se duas cenas mostram praticamente a mesma coisa:
             - use apenas a melhor
             OU
             - use trechos curtos de cada uma
             OU
             - intercale com outro elemento relevante.
             Nunca mantenha repeticao apenas para ocupar tempo.

          4. LIMITE DE TOMADA CONTINUA.
             Evite deixar uma unica cena por tempo excessivo.
             Como regra editorial:
             - cenas comuns: idealmente 2.0 a 6.5 segundos
             - cenas fortes ou de acao: podem chegar a 8 segundos
             - acima de 8 segundos so se houver motivo visual muito claro
             - cenas acima de 10 segundos devem ser fortemente evitadas

          5. IDEIA NOVA = POSSIVEL MUDANCA VISUAL.
             Quando a narracao muda de assunto, procure uma imagem coerente com
             essa nova ideia.
             Nao deixe a mesma imagem atravessar varios blocos narrativos sem motivo.

          6. FALA E IMAGEM DEVEM COMBINAR.
             Exemplos:
             - ao falar do piloto, mostrar piloto/cockpit
             - ao falar dos passageiros, mostrar cabine/passageiros
             - ao falar de cobertura de TV, mostrar tela/noticiario
             - ao falar de pouso, mostrar aproximacao/pouso
             - ao falar de rota/localizacao, usar mapa

          7. A TROCA DE CENA PODE OCORRER NO MEIO DE UMA FRASE.
             Desde que a nova imagem continue coerente com o que esta sendo dito.
             Isso e desejavel quando melhora o ritmo.

          8. ORDEM.
             Nao e obrigatorio reordenar.
             Mantenha a ordem original se ela for boa.
             Reordene apenas quando houver ganho narrativo claro.

          9. MODO AUTO.
             Use a narracao original como fonte factual quando ela for util,
             mas NAO preserve automaticamente sua distribuicao entre cenas.
             Reescreva e redistribua a fala para casar melhor com o visual.

          10. MODO ORIGINAL.
              Preserve fatos e progressao geral da narracao original,
              mas ainda edite visualmente com liberdade.

          11. MODO NOVA.
              Crie nova narracao natural, factual e audiovisual.

          12. MODO SEM_NARRACAO.
              Todos os campos narration devem ficar vazios.
              Ainda construa a melhor timeline visual possivel.

          13. VIDEO SEM AUDIO.
              Use contexto + imagem.
              Nao invente nomes, locais ou datas que nao estejam sustentados
              pelo material recebido.
              Quando houver incerteza, use linguagem descritiva.

          14. INCREMENTO EXTERNO.
              Use no maximo 1.
              So use se realmente melhorar a compreensao.
              Escolha:
              - map: para rota, localizacao ou regiao
              - fact_card: para contexto factual curto
              - none: se nao houver ganho editorial
              Se houver narracao, o incremento deve ser narrado enquanto aparece.

          15. DURACAO E RITMO.
              Nunca planeje narracao maior que o video.
              Nunca dependa de congelar o ultimo frame.
              Prefira cortes mais vivos e texto mais enxuto.
              E aceitavel terminar o episodio antes da duracao original
              se isso melhorar o ritmo.

          16. NAO ESTIQUE CENA FRACA.
              Se a cena original tiver 20 segundos mas so 5 segundos sao necessarios,
              use apenas 5.
              Nao use slow motion como solucao editorial para preencher tempo.

          17. FINAL.
              O fechamento deve ser o ponto visual mais forte do desfecho.
              Evite deixar o final se arrastar.
              Quando houver narracao, termine naturalmente com:
              "Parece mentira. Mas aconteceu."

          18. SAIDA EDITORIAL.
              Cada item da timeline deve representar uma DECISAO DE EDICAO.
              O campo reason deve explicar por que aquela imagem esta naquele ponto.

          19. DURACAO POR ITEM.
              Para kind=scene:
              - minimo preferencial: 1.5s
              - ideal: 2.0 a 6.5s
              - maximo recomendado: 8.0s
              - nunca ultrapassar 110% da duracao original
              - se a cena original for longa, use apenas o trecho necessario

          20. PRIORIDADE DE QUALIDADE.
              Se precisar escolher entre:
              - usar mais cenas
              OU
              - fazer um video mais curto e coeso,
              escolha o video mais curto e coeso.

          21. SINCRONISMO DE FALA POR ITEM.
              A narracao de cada item PRECISA caber na duracao daquele item.
              Use como referencia maxima aproximadamente 2.0 palavras por segundo.
              Exemplos:
              - 3 segundos: cerca de 6 palavras
              - 5 segundos: cerca de 10 palavras
              - 8 segundos: cerca de 16 palavras
              Se precisar dizer mais, distribua a ideia entre cenas coerentes.
              Nao concentre uma frase longa em uma imagem curta.

          22. SOMA FINAL.
              Antes de responder, confira mentalmente:
              - soma das duracoes da timeline
              - quantidade total de palavras narradas
              - se a narracao cabe confortavelmente no tempo visual
              A voz deve terminar ANTES ou junto do ultimo frame, nunca depois.

          23. LEGENDA ORIGINAL DO VIDEO = ANCORA SEMANTICA.
              A legenda original que ja esta queimada no video SERA MANTIDA.
              NAO tente apagar, substituir ou ignorar esse texto visivel.

              Sempre que uma cena contiver legenda original acompanhando a fala:
              - trate o texto visivel como parte permanente daquela cena
              - a nova narracao deve falar da MESMA IDEIA principal
              - nao precisa repetir palavra por palavra
              - pode ampliar, contextualizar ou deixar a frase mais natural
              - nunca contradiga a legenda
              - nunca fale de outro assunto enquanto aquela legenda estiver visivel
              - nao coloque uma cena com legenda sobre um assunto diferente da fala

              Exemplo:
              legenda visivel: "Ele voou por duas horas"
              narracao aceitavel:
              "Para reduzir o peso da aeronave, Burke permaneceu circulando por quase duas horas."

              O texto muda, mas o sentido continua alinhado.

          24. LEGENDA VISIVEL TEM PRIORIDADE SOBRE REORDENACAO.
              Se reordenar uma cena fizer a legenda original ficar incoerente com
              a nova narracao, NAO reordene essa cena.

              A prioridade e:
              1. coerencia entre imagem
              2. coerencia entre legenda original visivel
              3. nova narracao
              4. ritmo

              Nunca sacrifique coerencia de legenda apenas para criar um corte mais dramatico.

          25. CENAS COM LEGENDA ORIGINAL.
              Ao analisar as contact sheets, observe qualquer texto de legenda
              que acompanha a narracao original.

              Considere esse texto como pista editorial forte para decidir:
              - qual assunto aquela cena suporta
              - onde ela pode entrar na timeline
              - qual trecho da nova narracao pode aparecer sobre ela

          26. IDIOMA E TRADUCAO DA NARRACAO.
              TODA narracao nova gerada pelo diretor deve ser em PORTUGUES DO BRASIL.

              Se o idioma original detectado for diferente de portugues:
              - entenda e preserve o significado da fala original
              - traduza/adapte a narracao para portugues do Brasil natural
              - nao traduza nomes proprios sem necessidade
              - nao altere fatos, numeros, datas ou relacoes causais
              - nao invente informacao ausente
              - mantenha o sentido da fala original e do contexto visual

              IMPORTANTE SOBRE LEGENDA VISIVEL:
              - se o video ja tiver legenda queimada em espanhol, ingles ou outro idioma,
                essa legenda DEVE permanecer exatamente no idioma em que esta
              - NAO traduza, cubra, remova ou substitua a legenda original visivel
              - a narracao em portugues deve continuar semanticamente alinhada
                ao texto estrangeiro que aparece na tela
              - se o video nao tiver legenda visivel, NAO crie legenda nova nesta etapa

          RETORNE SOMENTE JSON VALIDO neste formato:

          {{
            "story_summary": "resumo curto",
            "mode_used": "AUTO|ORIGINAL|NOVA|SEM_NARRACAO",
            "research_notes": [
              {{
                "fact": "fato utilizado",
                "source": "origem do fato ou contexto do usuario"
              }}
            ],
            "increment": {{
              "type": "none|map|fact_card",
              "title": "",
              "subtitle": "",
              "duration": 0,
              "narration": "",
              "points": [
                {{
                  "label": "",
                  "lat": 0.0,
                  "lon": 0.0
                }}
              ]
            }},
            "timeline": [
              {{
                "kind": "scene|increment",
                "scene": 1,
                "duration": 4.5,
                "narration": "trecho natural da narracao",
                "reason": "funcao editorial da cena"
              }}
            ]
          }}

          Para kind=increment, use scene=null.

          IMPORTANTE:
          - timeline pode omitir cenas
          - timeline pode ser mais curta que o video original
          - nao existe obrigacao de usar todo o material
          - nao existe obrigacao de manter a ordem original
          - nao existe obrigacao de ocupar toda a duracao
          - a legenda original permanecera visivel no video final
          - nunca gere uma narracao semanticamente incompatível com a legenda visivel
          - priorize coerencia entre imagem + legenda original + narracao
          """

          contents = [instructions]

          for scene in manifest:
              num = int(scene["scene"])

              sheet = Path(
                  f"output/stage06_vision/sheets/"
                  f"scene_{num:03d}.jpg"
              )

              scene_info = (
                  f"CENA {num:03d} | "
                  f"duracao={float(scene['duration']):.2f}s | "
                  f"fala_original="
                  f"{scene.get('transcript') or '[sem fala]'}"
              )

              contents.append(scene_info)

              contents.append(
                  types.Part.from_bytes(
                      data=sheet.read_bytes(),
                      mime_type="image/jpeg"
                  )
              )

          import time
          from google.genai import errors

          # -------------------------------------------------
          # RESILIENCIA DE MODELO
          #
          # 503 = modelo temporariamente sobrecarregado.
          # Tenta novamente e, se necessario, troca para
          # outro Flash multimodal do Free Tier.
          # -------------------------------------------------

          models_to_try = [
              "gemini-3.7-flash",
              "gemini-3.6-flash",
              "gemini-3.5-flash",
              "gemini-3.8-flash",
          ]

          response = None
          selected_model = None
          last_error = None

          for model_name in models_to_try:
              for attempt in range(1, 5):
                  try:
                      print(
                          f"Tentando {model_name} "
                          f"(tentativa {attempt}/4)..."
                      )

                      response = client.models.generate_content(
                          model=model_name,
                          contents=contents,
                          config=types.GenerateContentConfig(
                              response_mime_type="application/json",
                              temperature=0.35
                          )
                      )

                      if response and (response.text or "").strip():
                          selected_model = model_name
                          break

                  except Exception as exc:
                      last_error = exc
                      msg = str(exc)

                      msg_lower = msg.lower()

                      retryable = (
                          "503" in msg
                          or "UNAVAILABLE" in msg
                          or "429" in msg
                          or "RESOURCE_EXHAUSTED" in msg
                          or "high demand" in msg_lower
                          or "server disconnected" in msg_lower
                          or "remoteprotocolerror" in msg_lower
                          or "connection reset" in msg_lower
                          or "connection aborted" in msg_lower
                          or "connection error" in msg_lower
                          or "read timeout" in msg_lower
                          or "write timeout" in msg_lower
                          or "connect timeout" in msg_lower
                          or "timed out" in msg_lower
                          or "temporarily unavailable" in msg_lower
                      )

                      print(
                          f"Falha em {model_name}: {exc}"
                      )

                      if not retryable:
                          raise

                      if attempt < 4:
                          wait_seconds = 10 * attempt
                          print(
                              f"Aguardando {wait_seconds}s "
                              f"antes de tentar novamente..."
                          )
                          time.sleep(wait_seconds)

              if selected_model:
                  break

              print(
                  f"{model_name} indisponivel. "
                  "Tentando modelo fallback..."
              )

          if response is None or selected_model is None:
              raise RuntimeError(
                  "Nenhum modelo Gemini respondeu. "
                  f"Ultimo erro: {last_error}"
              )

          print(
              f"AI Director executado com: {selected_model}"
          )

          raw = (response.text or "").strip()

          if not raw:
              raise RuntimeError(
                  "Gemini retornou resposta vazia."
              )

          raw = re.sub(
              r"^```(?:json)?\s*",
              "",
              raw,
              flags=re.I
          )

          raw = re.sub(
              r"\s*```$",
              "",
              raw
          )

          try:
              plan = json.loads(raw)
          except json.JSONDecodeError:
              match = re.search(
                  r"\{.*\}",
                  raw,
                  flags=re.S
              )

              if not match:
                  raise RuntimeError(
                      "Gemini nao retornou JSON valido."
                  )

              plan = json.loads(
                  match.group(0)
              )

          timeline = plan.get(
              "timeline",
              []
          )

          if not timeline:
              raise RuntimeError(
                  "Gemini retornou timeline vazia."
              )

          valid_scenes = {
              int(s["scene"])
              for s in manifest
          }

          original_durations = {
              int(s["scene"]): float(s["duration"])
              for s in manifest
          }

          for item in timeline:
              kind = item.get("kind")

              if kind not in (
                  "scene",
                  "increment"
              ):
                  raise RuntimeError(
                      f"kind invalido: {kind}"
                  )

              duration = float(
                  item.get("duration", 0)
              )

              if duration <= 0:
                  raise RuntimeError(
                      "Item com duracao invalida."
                  )

              if kind == "scene":
                  scene = item.get("scene")

                  if scene not in valid_scenes:
                      raise RuntimeError(
                          f"Cena invalida no plano: {scene}"
                      )

                  max_allowed = (
                      original_durations[scene] * 1.10
                  )

                  if duration > max_allowed + 0.05:
                      item["duration"] = round(
                          max_allowed,
                          3
                      )

                  # Regra editorial automatica:
                  # evita que uma tomada comum fique longa demais.
                  if float(item["duration"]) > 8.0:
                      item["duration"] = 8.0

                  # Sincronismo automatico:
                  # se a fala estimada nao couber na cena planejada,
                  # aumenta a duracao apenas dentro do limite visual.
                  # Nunca congela frame.
                  narration = str(
                      item.get("narration", "")
                  ).strip()

                  if narration:
                      words = len(narration.split())
                      estimated_voice = words / 2.05
                      current_duration = float(item["duration"])

                      if estimated_voice > current_duration:
                          desired = estimated_voice * 1.03
                          editorial_cap = min(
                              max_allowed,
                              8.0
                          )

                          item["duration"] = round(
                              min(
                                  desired,
                                  editorial_cap
                              ),
                              3
                          )

          timeline_duration = sum(
              float(i["duration"])
              for i in timeline
          )

          if timeline_duration <= 1:
              raise RuntimeError(
                  "Duracao total da timeline invalida."
              )

          Path(
              "output/stage06_ai/director_plan.json"
          ).write_text(
              json.dumps(
                  plan,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          Path(
              "output/stage06_ai/director_raw.txt"
          ).write_text(
              raw,
              encoding="utf-8"
          )

          Path(
              "output/stage06_ai/provider.txt"
          ).write_text(
              selected_model + "\n",
              encoding="utf-8"
          )

          print(
              json.dumps(
                  plan,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

          python3 /tmp/ai_director_gemini.py

          test -s output/stage06_ai/director_plan.json
          test -s output/stage06_ai/provider.txt

      # =========================================================
      # STAGE 06B - PLANO MANUAL
      #
      # Quando modo=PLANO_MANUAL:
      # - ignora completamente o Gemini
      # - le ./manual_plan.json do repositorio
      # - valida estrutura, cenas e duracoes
      # - copia o plano para o mesmo local usado pelo restante
      #   do pipeline
      #
      # Assim o GitHub/FFmpeg vira apenas EXECUTOR do plano.
      # =========================================================

      - name: Stage 06B - Carregar Plano Manual
        if: ${{ inputs.etapa != 'ACABAMENTO_SEM_IA' && inputs.modo == 'PLANO_MANUAL' }}
        shell: bash
        run: |
          set -e

          if [ ! -s "./manual_plan.json" ]; then
            echo "ERRO: modo PLANO_MANUAL selecionado, mas manual_plan.json nao existe."
            echo "Adicione manual_plan.json na raiz do repositorio."
            exit 1
          fi

          mkdir -p output/stage06_ai

          cp \
            ./manual_plan.json \
            output/stage06_ai/director_plan.json

          cp \
            ./manual_plan.json \
            output/stage06_ai/director_raw.txt

          echo "PLANO_MANUAL" \
            > output/stage06_ai/provider.txt

      - name: Stage 06B - Validar Plano Manual
        if: ${{ inputs.etapa != 'ACABAMENTO_SEM_IA' && inputs.modo == 'PLANO_MANUAL' }}
        shell: bash
        run: |
          set -e

          cat > /tmp/validate_manual_plan.py <<'PY'
          import json
          from pathlib import Path

          plan_path = Path(
              "output/stage06_ai/director_plan.json"
          )

          manifest_path = Path(
              "output/stage05/scene_manifest.json"
          )

          plan = json.loads(
              plan_path.read_text(
                  encoding="utf-8"
              )
          )

          manifest = json.loads(
              manifest_path.read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(plan, dict):
              raise RuntimeError(
                  "manual_plan.json precisa ser um objeto JSON."
              )

          timeline = plan.get(
              "timeline",
              []
          )

          if not isinstance(timeline, list) or not timeline:
              raise RuntimeError(
                  "manual_plan.json precisa conter timeline com pelo menos 1 item."
              )

          valid_scenes = {
              int(s["scene"])
              for s in manifest
          }

          original_durations = {
              int(s["scene"]): float(s["duration"])
              for s in manifest
          }

          increment = plan.get(
              "increment",
              {}
          ) or {}

          inc_type = increment.get(
              "type",
              "none"
          )

          if inc_type not in (
              "none",
              "map",
              "fact_card"
          ):
              raise RuntimeError(
                  f"increment.type invalido: {inc_type}"
              )

          for idx, item in enumerate(
              timeline,
              start=1
          ):
              if not isinstance(item, dict):
                  raise RuntimeError(
                      f"timeline item {idx} invalido."
                  )

              kind = item.get("kind")

              if kind not in (
                  "scene",
                  "increment"
              ):
                  raise RuntimeError(
                      f"timeline item {idx}: kind invalido ({kind})."
                  )

              try:
                  duration = float(
                      item.get(
                          "duration",
                          0
                      )
                  )
              except Exception:
                  raise RuntimeError(
                      f"timeline item {idx}: duration invalida."
                  )

              if duration <= 0:
                  raise RuntimeError(
                      f"timeline item {idx}: duration deve ser > 0."
                  )

              if kind == "scene":
                  scene = item.get(
                      "scene"
                  )

                  if scene not in valid_scenes:
                      raise RuntimeError(
                          f"timeline item {idx}: cena inexistente ({scene})."
                      )

                  max_allowed = (
                      original_durations[scene] * 1.10
                  )

                  if duration > max_allowed + 0.05:
                      raise RuntimeError(
                          f"timeline item {idx}: duracao {duration:.2f}s "
                          f"ultrapassa 110% da cena {scene:03d} "
                          f"({max_allowed:.2f}s)."
                      )

              if kind == "increment":
                  item["scene"] = None

          plan["mode_used"] = "PLANO_MANUAL"

          if "story_summary" not in plan:
              plan["story_summary"] = ""


          if "research_notes" not in plan:
              plan["research_notes"] = []

          if "increment" not in plan:
              plan["increment"] = {
                  "type": "none",
                  "title": "",
                  "subtitle": "",
                  "duration": 0,
                  "narration": "",
                  "points": []
              }

          plan_path.write_text(
              json.dumps(
                  plan,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              "PLANO MANUAL VALIDADO"
          )
          print(
              f"Itens da timeline: {len(timeline)}"
          )
          PY

          python3 /tmp/validate_manual_plan.py

          test -s output/stage06_ai/director_plan.json
          test -s output/stage06_ai/provider.txt

      # =========================================================
      # STAGE 06C - REUTILIZAR PLANO APROVADO
      #
      # Modo temporario para testes de acabamento:
      # - NAO chama Gemini
      # - NAO consome cota de IA
      # - usa ./approved_plan.json salvo no repositorio
      #
      # Para criar approved_plan.json:
      # 1. baixe director_plan.json de uma execucao AUTO aprovada
      # 2. renomeie para approved_plan.json
      # 3. envie para a raiz do repositorio
      #
      # Depois selecione:
      # etapa = ACABAMENTO_SEM_IA
      # =========================================================

      - name: Stage 06C - Carregar Plano Aprovado sem IA
        if: ${{ inputs.etapa == 'ACABAMENTO_SEM_IA' }}
        shell: bash
        run: |
          set -e

          if [ ! -s "./approved_plan.json" ]; then
            echo "ERRO: etapa ACABAMENTO_SEM_IA selecionada."
            echo "Arquivo ./approved_plan.json nao encontrado."
            echo ""
            echo "Baixe director_plan.json da execucao AUTO aprovada,"
            echo "renomeie para approved_plan.json e envie para a raiz do repositorio."
            exit 1
          fi

          mkdir -p output/stage06_ai

          cp \
            ./approved_plan.json \
            output/stage06_ai/director_plan.json

          cp \
            ./approved_plan.json \
            output/stage06_ai/director_raw.txt

          echo "PLANO_APROVADO_SEM_IA" \
            > output/stage06_ai/provider.txt

          echo "========================================"
          echo "PLANO APROVADO CARREGADO"
          echo "Gemini: NAO EXECUTADO"
          echo "Consumo de cota IA: ZERO"
          echo "========================================"

      - name: Stage 06C - Validar Plano Aprovado
        if: ${{ inputs.etapa == 'ACABAMENTO_SEM_IA' }}
        shell: bash
        run: |
          set -e

          cat > /tmp/validate_approved_plan.py <<'PY'
          import json
          from pathlib import Path

          plan_path = Path(
              "output/stage06_ai/director_plan.json"
          )

          manifest_path = Path(
              "output/stage05/scene_manifest.json"
          )

          plan = json.loads(
              plan_path.read_text(
                  encoding="utf-8"
              )
          )

          manifest = json.loads(
              manifest_path.read_text(
                  encoding="utf-8"
              )
          )

          timeline = plan.get(
              "timeline",
              []
          )

          if not isinstance(timeline, list) or not timeline:
              raise RuntimeError(
                  "approved_plan.json nao possui timeline valida."
              )

          valid_scenes = {
              int(s["scene"])
              for s in manifest
          }

          original_durations = {
              int(s["scene"]): float(s["duration"])
              for s in manifest
          }

          for idx, item in enumerate(
              timeline,
              start=1
          ):
              kind = item.get("kind")

              if kind not in (
                  "scene",
                  "increment"
              ):
                  raise RuntimeError(
                      f"Item {idx}: kind invalido ({kind})."
                  )

              duration = float(
                  item.get("duration", 0)
              )

              if duration <= 0:
                  raise RuntimeError(
                      f"Item {idx}: duration invalida."
                  )

              if kind == "scene":
                  scene = item.get("scene")

                  if scene not in valid_scenes:
                      raise RuntimeError(
                          f"Item {idx}: cena {scene} nao existe neste video."
                      )

                  max_allowed = (
                      original_durations[scene] * 1.10
                  )

                  if duration > max_allowed + 0.05:
                      raise RuntimeError(
                          f"Item {idx}: duracao da cena {scene} "
                          f"ultrapassa o limite disponivel."
                      )

              if kind == "increment":
                  item["scene"] = None


          plan_path.write_text(
              json.dumps(
                  plan,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              "PLANO APROVADO VALIDADO - SEM CHAMADA DE IA"
          )
          print(
              f"Itens da timeline: {len(timeline)}"
          )
          PY

          python3 /tmp/validate_approved_plan.py

          test -s output/stage06_ai/director_plan.json
          test -s output/stage06_ai/provider.txt

      # =========================================================
      # STAGE 07 - CRIAR INCREMENTO GENERICO
      #
      # Suporta:
      # - map
      # - fact_card
      # - none
      # =========================================================

      - name: Stage 07 - Criar Incremento do Diretor
        shell: bash
        run: |
          set -e

          mkdir -p output/stage07

          cat > /tmp/build_increment_v15.py <<'PY'
          import io
          import json
          import math
          import os
          import subprocess
          import requests
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          plan = json.loads(
              Path("output/stage06_ai/director_plan.json")
              .read_text(encoding="utf-8")
          )

          inc = plan.get("increment", {}) or {}
          inc_type = inc.get("type", "none")
          duration = max(float(inc.get("duration", 0) or 0), 0)

          out_dir = Path("output/stage07")
          out_dir.mkdir(parents=True, exist_ok=True)

          if inc_type == "none" or duration <= 0:
              Path(
                  "output/stage07/increment_none.txt"
              ).write_text(
                  "AI Director decidiu nao usar incremento.",
                  encoding="utf-8"
              )
              print("Sem incremento.")
              raise SystemExit(0)

          width = 1080
          height = 1920

          def font(size):
              paths = [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
              ]
              for p in paths:
                  if Path(p).exists():
                      return ImageFont.truetype(p, size=size)
              return ImageFont.load_default()

          title_font = font(48)
          body_font = font(34)
          small_font = font(27)

          if inc_type == "map":
              points = inc.get("points", [])

              if not points:
                  raise RuntimeError(
                      "Incremento map sem points."
                  )

              center_lat = sum(
                  float(p["lat"]) for p in points
              ) / len(points)

              center_lon = sum(
                  float(p["lon"]) for p in points
              ) / len(points)

              zoom = 8 if len(points) > 1 else 10

              url = (
                  "https://staticmap.openstreetmap.de/staticmap.php"
                  f"?center={center_lat},{center_lon}"
                  f"&zoom={zoom}"
                  f"&size={width}x{height}"
                  "&maptype=mapnik"
              )

              img = None

              try:
                  r = requests.get(
                      url,
                      timeout=25,
                      headers={
                          "User-Agent":
                              "PareceMentiraVideoEngine/1.0"
                      }
                  )
                  r.raise_for_status()
                  candidate = Image.open(
                      io.BytesIO(r.content)
                  ).convert("RGB")

                  if candidate.size == (width, height):
                      img = candidate
              except Exception as exc:
                  print(
                      "Mapa online indisponivel:",
                      exc
                  )

              if img is None:
                  img = Image.new(
                      "RGB",
                      (width, height),
                      (18, 37, 48)
                  )

              draw = ImageDraw.Draw(img, "RGBA")

              draw.rounded_rectangle(
                  (55, 70, width - 55, 260),
                  radius=30,
                  fill=(0, 0, 0, 180)
              )

              draw.text(
                  (90, 100),
                  str(inc.get("title", "MAPA")),
                  font=title_font,
                  fill="white"
              )

              draw.text(
                  (90, 170),
                  str(inc.get("subtitle", "")),
                  font=body_font,
                  fill=(255,255,255,225)
              )

              # Marcadores aproximados no mapa.
              # O fundo ja e geografico; aqui adicionamos legenda clara.
              y = height - 350

              draw.rounded_rectangle(
                  (70, y - 30, width - 70, height - 100),
                  radius=28,
                  fill=(0, 0, 0, 170)
              )

              labels = "  •  ".join(
                  str(p.get("label", ""))
                  for p in points
                  if p.get("label")
              )

              draw.text(
                  (105, y + 15),
                  labels[:70],
                  font=small_font,
                  fill="white"
              )

              draw.text(
                  (105, y + 75),
                  "© OpenStreetMap contributors",
                  font=small_font,
                  fill=(255,255,255,190)
              )

              img.save(
                  "output/stage07/increment_base.png",
                  "PNG"
              )

          elif inc_type == "fact_card":
              img = Image.new(
                  "RGB",
                  (width, height),
                  (18, 37, 48)
              )

              draw = ImageDraw.Draw(img, "RGBA")

              draw.rounded_rectangle(
                  (70, 300, width - 70, 1580),
                  radius=50,
                  fill=(0, 0, 0, 105)
              )

              draw.text(
                  (110, 390),
                  str(inc.get("title", "VOCÊ SABIA?")),
                  font=title_font,
                  fill="white"
              )

              subtitle = str(
                  inc.get("subtitle", "")
              ).strip()

              # Quebra simples em linhas.
              words = subtitle.split()
              lines = []
              current = []

              for word in words:
                  test = " ".join(current + [word])
                  if len(test) > 36 and current:
                      lines.append(" ".join(current))
                      current = [word]
                  else:
                      current.append(word)

              if current:
                  lines.append(" ".join(current))

              y = 540

              for line in lines[:8]:
                  draw.text(
                      (110, y),
                      line,
                      font=body_font,
                      fill=(255,255,255,235)
                  )
                  y += 70

              img.save(
                  "output/stage07/increment_base.png",
                  "PNG"
              )

          else:
              raise RuntimeError(
                  f"Tipo de incremento nao suportado: {inc_type}"
              )

          # Anima o incremento.
          subprocess.run([
              "ffmpeg", "-y",
              "-loop", "1",
              "-framerate", "30",
              "-i", "output/stage07/increment_base.png",
              "-vf",
              (
                  "scale=1080:1920,"
                  "zoompan="
                  "z='min(zoom+0.0014,1.12)':"
                  "x='iw/2-(iw/zoom/2)':"
                  "y='ih/2-(ih/zoom/2)':"
                  f"d={int(duration*30)}:"
                  "s=1080x1920:fps=30,"
                  "format=yuv420p"
              ),
              "-t", f"{duration:.3f}",
              "-an",
              "-c:v", "libx264",
              "-preset", "veryfast",
              "-crf", "20",
              "-movflags", "+faststart",
              "output/stage07/increment.mp4"
          ], check=True)

          print(
              f"Incremento criado: {inc_type} "
              f"({duration:.2f}s)"
          )
          PY

          python3 /tmp/build_increment_v15.py

      # =========================================================
      # STAGE 07 - RENDER DA TIMELINE DO AI DIRECTOR
      #
      # Cada cena e ajustada a duracao planejada.
      # NAO congela o ultimo frame.
      # Se precisar alongar levemente, usa slow motion suave.
      # =========================================================

      - name: Stage 07 - Renderizar Timeline Visual
        shell: bash
        run: |
          set -e

          mkdir -p output/stage07/segments

          cat > /tmp/render_timeline_v15.py <<'PY'
          import json
          import subprocess
          from pathlib import Path

          plan = json.loads(
              Path("output/stage06_ai/director_plan.json")
              .read_text(encoding="utf-8")
          )

          manifest = json.loads(
              Path("output/stage05/scene_manifest.json")
              .read_text(encoding="utf-8")
          )

          by_scene = {
              int(s["scene"]): s for s in manifest
          }

          timeline = plan.get("timeline", [])
          concat_lines = []

          for idx, item in enumerate(timeline, start=1):
              kind = item.get("kind")
              target = float(item["duration"])

              out = Path(
                  f"output/stage07/segments/"
                  f"{idx:03d}_{kind}.mp4"
              )

              if kind == "increment":
                  source = Path(
                      "output/stage07/increment.mp4"
                  )

                  if not source.exists():
                      # Se a IA colocou increment na timeline mas decidiu
                      # type=none, simplesmente ignora o item.
                      continue

                  src_duration = float(
                      subprocess.check_output([
                          "ffprobe",
                          "-v", "error",
                          "-show_entries",
                          "format=duration",
                          "-of",
                          "default=noprint_wrappers=1:nokey=1",
                          str(source)
                      ], text=True).strip()
                  )

              else:
                  scene = int(item["scene"])
                  source = Path(
                      f"output/stage04_clips/"
                      f"scene_{scene:03d}.mp4"
                  )

                  src_duration = float(
                      by_scene[scene]["duration"]
                  )

              if target <= src_duration:
                  vf = "fps=30,format=yuv420p"

                  cmd = [
                      "ffmpeg", "-y",
                      "-i", str(source),
                      "-t", f"{target:.3f}",
                      "-an",
                      "-vf", vf,
                      "-c:v", "libx264",
                      "-preset", "veryfast",
                      "-crf", "20",
                      "-pix_fmt", "yuv420p",
                      "-movflags", "+faststart",
                      str(out)
                  ]
              else:
                  # Slow motion leve, nunca freeze.
                  factor = target / src_duration
                  factor = min(factor, 1.10)
                  actual_target = src_duration * factor

                  cmd = [
                      "ffmpeg", "-y",
                      "-i", str(source),
                      "-an",
                      "-vf",
                      (
                          f"setpts={factor:.6f}*PTS,"
                          "fps=30,format=yuv420p"
                      ),
                      "-t", f"{actual_target:.3f}",
                      "-c:v", "libx264",
                      "-preset", "veryfast",
                      "-crf", "20",
                      "-pix_fmt", "yuv420p",
                      "-movflags", "+faststart",
                      str(out)
                  ]

              subprocess.run(cmd, check=True)

              concat_lines.append(
                  "file '" + str(out.resolve()) + "'"
              )

          Path(
              "output/stage07/final_concat.txt"
          ).write_text(
              "\n".join(concat_lines) + "\n",
              encoding="utf-8"
          )
          PY

          python3 /tmp/render_timeline_v15.py

          test -s output/stage07/final_concat.txt

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i output/stage07/final_concat.txt \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/stage07/ai_visual_master.mp4

          test -s output/stage07/ai_visual_master.mp4

      # =========================================================
      # STAGE 08 - NARRACAO DO PLANO DA IA
      #
      # Cria UMA voz continua a partir da narracao planejada
      # para todos os itens da timeline.
      # =========================================================

      - name: Stage 08 - Instalar TTS
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          python3 -m pip install edge-tts gTTS

      - name: Stage 08 - Montar Texto Continuo
        shell: bash
        run: |
          set -e

          mkdir -p output/stage08

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(
              Path("output/stage06_ai/director_plan.json")
              .read_text(encoding="utf-8")
          )

          mode = plan.get("mode_used", "AUTO")
          timeline = plan.get("timeline", [])

          if mode == "SEM_NARRACAO":
              text = ""
          else:
              parts = []

              for item in timeline:
                  narration = str(
                      item.get("narration", "")
                  ).strip()

                  if narration:
                      parts.append(narration)

              text = " ".join(parts).strip()

          Path(
              "output/stage08/narration.txt"
          ).write_text(
              text,
              encoding="utf-8"
          )

          print(text)
          PY

      - name: Stage 08 - Gerar Voz Continua
        shell: bash
        run: |
          set -e

          TEXT=$(cat output/stage08/narration.txt)

          if [ -z "$TEXT" ]; then
            echo "SEM_NARRACAO" > output/stage08/tts_engine.txt
            touch output/stage08/no_narration.flag
            exit 0
          fi

          rm -f output/stage08/narration_raw.mp3

          if edge-tts \
            --voice pt-BR-AntonioNeural \
            --rate="-3%" \
            --text "$TEXT" \
            --write-media output/stage08/narration_raw.mp3; then

            if [ -s output/stage08/narration_raw.mp3 ]; then
              echo "edge-tts" > output/stage08/tts_engine.txt
            fi
          fi

          if [ ! -s output/stage08/narration_raw.mp3 ]; then
            python3 - <<'PY'
          from gtts import gTTS
          from pathlib import Path

          text = Path(
              "output/stage08/narration.txt"
          ).read_text(encoding="utf-8")

          try:
              gTTS(
                  text=text,
                  lang="pt",
                  tld="com.br",
                  slow=False
              ).save(
                  "output/stage08/narration_raw.mp3"
              )
          except Exception as exc:
              print(exc)
          PY

            if [ -s output/stage08/narration_raw.mp3 ]; then
              echo "gTTS" > output/stage08/tts_engine.txt
            fi
          fi

          if [ ! -s output/stage08/narration_raw.mp3 ]; then
            espeak-ng \
              -v pt-br \
              -s 158 \
              -f output/stage08/narration.txt \
              -w output/stage08/narration_fallback.wav

            ffmpeg -y \
              -i output/stage08/narration_fallback.wav \
              -c:a libmp3lame \
              -b:a 160k \
              output/stage08/narration_raw.mp3

            echo "espeak-ng" > output/stage08/tts_engine.txt
          fi

          test -s output/stage08/narration_raw.mp3

      # =========================================================
      # STAGE 08 - FIT GLOBAL
      #
      # Se a voz ficar maior que o video:
      # - ajusta a velocidade de forma suave, no maximo 15%
      # - se ainda ficar maior, FALHA em vez de congelar imagem
      #
      # Isso obriga o AI Director a trabalhar dentro do tempo real.
      # =========================================================

      - name: Stage 08 - Ajustar Voz ao Master Visual
        shell: bash
        run: |
          set -e

          if [ -f output/stage08/no_narration.flag ]; then
            cp \
              output/stage07/ai_visual_master.mp4 \
              output/stage08/final_ai_director.mp4
            exit 0
          fi

          VIDEO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/stage07/ai_visual_master.mp4)

          AUDIO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/stage08/narration_raw.mp3)

          RATIO=$(awk \
            -v a="$AUDIO_DURATION" \
            -v v="$VIDEO_DURATION" \
            'BEGIN { printf "%.6f", a/v }')

          TEMPO=$(awk -v r="$RATIO" '
            BEGIN {
              if (r <= 1.00) t=1.00;
              else if (r <= 1.15) t=r;
              else t=1.15;
              printf "%.6f", t
            }')

          ffmpeg -y \
            -i output/stage08/narration_raw.mp3 \
            -filter:a "atempo=${TEMPO},volume=1.05" \
            -c:a aac \
            -b:a 160k \
            output/stage08/narration_master.m4a

          FITTED_AUDIO=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/stage08/narration_master.m4a)

          TOO_LONG=$(awk \
            -v a="$FITTED_AUDIO" \
            -v v="$VIDEO_DURATION" \
            'BEGIN { if (a > v + 0.35) print 1; else print 0 }')

          echo "Duracao visual: $VIDEO_DURATION s"
          echo "Duracao voz original: $AUDIO_DURATION s"
          echo "Atempo aplicado: $TEMPO"
          echo "Duracao voz ajustada: $FITTED_AUDIO s"

          if [ "$TOO_LONG" = "1" ]; then
            echo "AVISO: narracao maior que a timeline visual gerada pela IA."
            echo "Ativando fallback visual seguro com o Editorial Master completo."
            echo "Nao sera usado freeze frame."

            SOURCE_DURATION=$(ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              output/editorial_master.mp4)

            CAN_FIT=$(awk \
              -v a="$FITTED_AUDIO" \
              -v s="$SOURCE_DURATION" \
              'BEGIN { if (a <= s + 0.35) print 1; else print 0 }')

            if [ "$CAN_FIT" = "1" ]; then
              echo "Editorial Master disponivel: $SOURCE_DURATION s"
              echo "Voz ajustada: $FITTED_AUDIO s"
              echo "Fallback: preservando a ordem original do visual limpo para manter coerencia com as legendas."

              cp \
                output/editorial_master.mp4 \
                output/stage07/ai_visual_master_fallback.mp4

              VIDEO_DURATION="$FITTED_AUDIO"

              echo "Fallback visual ativado com sucesso."
            else
              echo "ERRO: nem o Editorial Master completo comporta a narracao."
              echo "Duracao fonte: $SOURCE_DURATION s"
              echo "Duracao voz ajustada: $FITTED_AUDIO s"
              echo "O plano precisa de narracao mais curta."
              exit 1
            fi
          fi

          VISUAL_INPUT="output/stage07/ai_visual_master.mp4"

          if [ -s output/stage07/ai_visual_master_fallback.mp4 ]; then
            VISUAL_INPUT="output/stage07/ai_visual_master_fallback.mp4"
          fi

          ffmpeg -y \
            -i "$VISUAL_INPUT" \
            -i output/stage08/narration_master.m4a \
            -filter_complex "[1:a]apad[aout]" \
            -map 0:v:0 \
            -map "[aout]" \
            -c:v copy \
            -c:a aac \
            -b:a 160k \
            -t "$VIDEO_DURATION" \
            -movflags +faststart \
            output/stage08/final_ai_director.mp4

          test -s output/stage08/final_ai_director.mp4

      # =========================================================
      # STAGE 09 - ACABAMENTO VISUAL CONSERVADOR
      #
      # OBJETIVO:
      # - melhorar nitidez percebida e acabamento
      # - dar leve ganho de contraste e saturacao
      # - manter narracao EXATAMENTE como saiu do Stage 08
      # - manter legenda original queimada no video
      # - manter duracao, cortes, ordem e sincronismo
      #
      # IMPORTANTE:
      # - NAO altera velocidade
      # - NAO cria transicoes que encurtem a timeline
      # - NAO aplica zoom/crop global que possa cortar legenda
      # - NAO mexe no audio
      # =========================================================

      - name: Stage 09 - Aplicar Acabamento Visual
        shell: bash
        run: |
          set -e

          mkdir -p output/stage09

          INPUT="output/stage08/final_ai_director.mp4"
          OUTPUT="output/stage09/final_visual_polish.mp4"

          test -s "$INPUT"

          VIDEO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$INPUT")

          if [ -z "$VIDEO_DURATION" ]; then
            echo "ERRO: duracao do Stage 08 nao identificada."
            exit 1
          fi

          AUDIO_COUNT=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            "$INPUT" \
            | wc -l)

          echo "========================================"
          echo "STAGE 09 - ACABAMENTO VISUAL"
          echo "Duracao de entrada: $VIDEO_DURATION s"
          echo "Audio detectado: $AUDIO_COUNT stream(s)"
          echo "========================================"

          if [ "$AUDIO_COUNT" -gt 0 ]; then

            ffmpeg -y \
              -i "$INPUT" \
              -map 0:v:0 \
              -map 0:a:0 \
              -vf "\
                eq=contrast=1.025:brightness=0.003:saturation=1.035,\
                unsharp=3:3:0.22:3:3:0.0,\
                format=yuv420p" \
              -c:v libx264 \
              -preset veryfast \
              -crf 19 \
              -c:a copy \
              -movflags +faststart \
              "$OUTPUT"

          else

            ffmpeg -y \
              -i "$INPUT" \
              -map 0:v:0 \
              -an \
              -vf "\
                eq=contrast=1.025:brightness=0.003:saturation=1.035,\
                unsharp=3:3:0.22:3:3:0.0,\
                format=yuv420p" \
              -c:v libx264 \
              -preset veryfast \
              -crf 19 \
              -movflags +faststart \
              "$OUTPUT"

          fi

          test -s "$OUTPUT"

      - name: Stage 09 - Validar Acabamento Visual
        shell: bash
        run: |
          set -e

          INPUT="output/stage08/final_ai_director.mp4"
          OUTPUT="output/stage09/final_visual_polish.mp4"

          test -s "$INPUT"
          test -s "$OUTPUT"

          IN_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$INPUT")

          OUT_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$OUTPUT")

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            "$OUTPUT")

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            "$OUTPUT")

          IN_AUDIO=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            "$INPUT" \
            | wc -l)

          OUT_AUDIO=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            "$OUTPUT" \
            | wc -l)

          DURATION_DIFF=$(awk \
            -v a="$IN_DURATION" \
            -v b="$OUT_DURATION" \
            'BEGIN {
              d=a-b;
              if (d < 0) d=-d;
              printf "%.6f", d
            }')

          DURATION_BAD=$(awk \
            -v d="$DURATION_DIFF" \
            'BEGIN { if (d > 0.10) print 1; else print 0 }')

          if [ "$WIDTH" != "1080" ] || [ "$HEIGHT" != "1920" ]; then
            echo "ERRO: Stage 09 fora de 1080x1920."
            exit 1
          fi

          if [ "$DURATION_BAD" = "1" ]; then
            echo "ERRO: Stage 09 alterou a duracao."
            echo "Entrada: $IN_DURATION s"
            echo "Saida:   $OUT_DURATION s"
            exit 1
          fi

          if [ "$IN_AUDIO" != "$OUT_AUDIO" ]; then
            echo "ERRO: Stage 09 alterou a quantidade de streams de audio."
            exit 1
          fi

          echo "========================================"
          echo "STAGE 09 ACABAMENTO VISUAL VALIDADO"
          echo "Resolucao: 1080x1920"
          echo "Duracao preservada: SIM"
          echo "Audio preservado: SIM"
          echo "Narracao reprocessada: NAO"
          echo "Legenda original preservada: SIM"
          echo "Zoom/crop adicional: NAO"
          echo "Trilha sonora: NAO"
          echo "========================================"

      - name: Disponibilizar Stage 09 Acabamento Visual
        uses: actions/upload-artifact@v4
        with:
          name: stage-09-visual-polish
          path: |
            output/stage09/final_visual_polish.mp4
          retention-days: 7
          if-no-files-found: error

      # =========================================================
      # STAGE 10 - QA TECNICO AUTOMATICO
      #
      # Valida o master final sem alterar imagem ou audio.
      #
      # HARD FAIL:
      # - arquivo ausente/corrompido
      # - resolucao diferente de 1080x1920
      # - codec de video inesperado
      # - fps fora do esperado
      # - duracao alterada
      # - audio ausente quando deveria existir
      # - audio praticamente inaudivel
      # - erro de decodificacao
      #
      # SO RELATORIO:
      # - quadros congelados
      # - trechos pretos
      # - silêncios
      #
      # Ao final, copia o video APROVADO para:
      # output/stage10/final_master.mp4
      # =========================================================

      - name: Stage 10 - Executar QA Tecnico
        shell: bash
        run: |
          set -e

          mkdir -p output/stage10

          INPUT="output/stage09/final_visual_polish.mp4"
          REFERENCE="output/stage08/final_ai_director.mp4"
          REPORT="output/stage10/qa_report.txt"

          test -s "$INPUT"
          test -s "$REFERENCE"

          : > "$REPORT"

          echo "PARECE MENTIRA - QA TECNICO AUTOMATICO" | tee -a "$REPORT"
          echo "========================================" | tee -a "$REPORT"

          # -----------------------------------------------------
          # METADADOS PRINCIPAIS
          # -----------------------------------------------------

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            "$INPUT")

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            "$INPUT")

          CODEC=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name \
            -of csv=p=0 \
            "$INPUT")

          PIX_FMT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=pix_fmt \
            -of csv=p=0 \
            "$INPUT")

          FPS_RAW=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=avg_frame_rate \
            -of csv=p=0 \
            "$INPUT")

          FPS=$(awk \
            -v r="$FPS_RAW" \
            'BEGIN {
              split(r,a,"/");
              if (a[2] == 0 || a[2] == "") print 0;
              else printf "%.3f", a[1]/a[2]
            }')

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$INPUT")

          REF_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$REFERENCE")

          SIZE_BYTES=$(stat -c%s "$INPUT")

          AUDIO_COUNT=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            "$INPUT" \
            | wc -l)

          echo "Resolucao: ${WIDTH}x${HEIGHT}" | tee -a "$REPORT"
          echo "Codec video: $CODEC" | tee -a "$REPORT"
          echo "Pixel format: $PIX_FMT" | tee -a "$REPORT"
          echo "FPS: $FPS" | tee -a "$REPORT"
          echo "Duracao final: $DURATION s" | tee -a "$REPORT"
          echo "Duracao referencia: $REF_DURATION s" | tee -a "$REPORT"
          echo "Tamanho: $SIZE_BYTES bytes" | tee -a "$REPORT"
          echo "Streams de audio: $AUDIO_COUNT" | tee -a "$REPORT"

          # -----------------------------------------------------
          # HARD FAILS - VIDEO
          # -----------------------------------------------------

          if [ "$WIDTH" != "1080" ] || [ "$HEIGHT" != "1920" ]; then
            echo "FAIL: resolucao diferente de 1080x1920." | tee -a "$REPORT"
            exit 1
          fi

          if [ "$CODEC" != "h264" ]; then
            echo "FAIL: codec de video inesperado ($CODEC)." | tee -a "$REPORT"
            exit 1
          fi

          if [ "$PIX_FMT" != "yuv420p" ]; then
            echo "FAIL: pixel format inesperado ($PIX_FMT)." | tee -a "$REPORT"
            exit 1
          fi

          FPS_BAD=$(awk \
            -v f="$FPS" \
            'BEGIN {
              if (f < 29.0 || f > 31.0) print 1;
              else print 0
            }')

          if [ "$FPS_BAD" = "1" ]; then
            echo "FAIL: FPS fora da faixa esperada." | tee -a "$REPORT"
            exit 1
          fi

          DUR_DIFF=$(awk \
            -v a="$DURATION" \
            -v b="$REF_DURATION" \
            'BEGIN {
              d=a-b;
              if (d < 0) d=-d;
              printf "%.6f", d
            }')

          DUR_BAD=$(awk \
            -v d="$DUR_DIFF" \
            'BEGIN {
              if (d > 0.12) print 1;
              else print 0
            }')

          if [ "$DUR_BAD" = "1" ]; then
            echo "FAIL: duracao mudou mais de 0.12s." | tee -a "$REPORT"
            echo "Diferenca: $DUR_DIFF s" | tee -a "$REPORT"
            exit 1
          fi

          if [ "$SIZE_BYTES" -lt 500000 ]; then
            echo "FAIL: arquivo final pequeno demais." | tee -a "$REPORT"
            exit 1
          fi

          # -----------------------------------------------------
          # HARD FAIL - DECODIFICACAO
          # -----------------------------------------------------

          ffmpeg \
            -v error \
            -i "$INPUT" \
            -f null - \
            2> output/stage10/decode_errors.txt || true

          if [ -s output/stage10/decode_errors.txt ]; then
            echo "FAIL: FFmpeg encontrou erro de decodificacao." | tee -a "$REPORT"
            cat output/stage10/decode_errors.txt | tee -a "$REPORT"
            exit 1
          fi

          echo "Decodificacao integral: OK" | tee -a "$REPORT"

          # -----------------------------------------------------
          # AUDIO
          # -----------------------------------------------------

          if [ -f output/stage08/no_narration.flag ]; then
            EXPECT_AUDIO=0
          else
            EXPECT_AUDIO=1
          fi

          if [ "$EXPECT_AUDIO" = "1" ] && [ "$AUDIO_COUNT" -lt 1 ]; then
            echo "FAIL: narracao esperada, mas audio ausente." | tee -a "$REPORT"
            exit 1
          fi

          if [ "$AUDIO_COUNT" -gt 0 ]; then

            AUDIO_CODEC=$(ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$INPUT")

            AUDIO_DURATION=$(ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              "$INPUT")

            MEAN_VOLUME=$(ffmpeg \
              -hide_banner \
              -i "$INPUT" \
              -map 0:a:0 \
              -af volumedetect \
              -f null - 2>&1 \
              | sed -n 's/.*mean_volume: \([-0-9.]*\) dB.*/\1/p' \
              | tail -1)

            MAX_VOLUME=$(ffmpeg \
              -hide_banner \
              -i "$INPUT" \
              -map 0:a:0 \
              -af volumedetect \
              -f null - 2>&1 \
              | sed -n 's/.*max_volume: \([-0-9.]*\) dB.*/\1/p' \
              | tail -1)

            echo "Codec audio: $AUDIO_CODEC" | tee -a "$REPORT"
            echo "Duracao audio: ${AUDIO_DURATION:-indisponivel} s" | tee -a "$REPORT"
            echo "Volume medio: ${MEAN_VOLUME:-indisponivel} dB" | tee -a "$REPORT"
            echo "Pico de audio: ${MAX_VOLUME:-indisponivel} dB" | tee -a "$REPORT"

            if [ -n "$MEAN_VOLUME" ]; then
              TOO_QUIET=$(awk \
                -v v="$MEAN_VOLUME" \
                'BEGIN {
                  if (v < -38.0) print 1;
                  else print 0
                }')

              if [ "$TOO_QUIET" = "1" ]; then
                echo "FAIL: audio praticamente inaudivel." | tee -a "$REPORT"
                exit 1
              fi
            fi

          fi

          # -----------------------------------------------------
          # DIAGNOSTICOS - NAO BLOQUEIAM O MASTER
          # -----------------------------------------------------

          echo "" | tee -a "$REPORT"
          echo "DIAGNOSTICOS VISUAIS" | tee -a "$REPORT"
          echo "----------------------------------------" | tee -a "$REPORT"

          ffmpeg \
            -hide_banner \
            -i "$INPUT" \
            -vf "freezedetect=n=-55dB:d=2.5" \
            -an \
            -f null - \
            2> output/stage10/freezedetect_raw.txt || true

          grep -E "freeze_(start|duration|end)" \
            output/stage10/freezedetect_raw.txt \
            > output/stage10/freezes.txt || true

          FREEZE_COUNT=$(grep -c "freeze_start" \
            output/stage10/freezes.txt || true)

          echo "Eventos de freeze >=2.5s: $FREEZE_COUNT" | tee -a "$REPORT"

          ffmpeg \
            -hide_banner \
            -i "$INPUT" \
            -vf "blackdetect=d=1.0:pix_th=0.10" \
            -an \
            -f null - \
            2> output/stage10/blackdetect_raw.txt || true

          grep "black_start" \
            output/stage10/blackdetect_raw.txt \
            > output/stage10/black_frames.txt || true

          BLACK_COUNT=$(wc -l < output/stage10/black_frames.txt)

          echo "Trechos pretos >=1s: $BLACK_COUNT" | tee -a "$REPORT"

          if [ "$AUDIO_COUNT" -gt 0 ]; then

            ffmpeg \
              -hide_banner \
              -i "$INPUT" \
              -map 0:a:0 \
              -af "silencedetect=noise=-45dB:d=2.0" \
              -f null - \
              2> output/stage10/silencedetect_raw.txt || true

            grep -E "silence_(start|end|duration)" \
              output/stage10/silencedetect_raw.txt \
              > output/stage10/silences.txt || true

            SILENCE_COUNT=$(grep -c "silence_start" \
              output/stage10/silences.txt || true)

            echo "Silencios >=2s: $SILENCE_COUNT" | tee -a "$REPORT"

          else
            : > output/stage10/silences.txt
            echo "Silencios: N/A (video sem audio)" | tee -a "$REPORT"
          fi

          # -----------------------------------------------------
          # FRAME COUNT
          # -----------------------------------------------------

          FRAME_COUNT=$(ffprobe \
            -v error \
            -count_frames \
            -select_streams v:0 \
            -show_entries stream=nb_read_frames \
            -of default=noprint_wrappers=1:nokey=1 \
            "$INPUT")

          EXPECTED_FRAMES=$(awk \
            -v d="$DURATION" \
            -v f="$FPS" \
            'BEGIN {
              printf "%.0f", d*f
            }')

          echo "Frames lidos: $FRAME_COUNT" | tee -a "$REPORT"
          echo "Frames esperados aprox.: $EXPECTED_FRAMES" | tee -a "$REPORT"

          # -----------------------------------------------------
          # APROVACAO FINAL
          # -----------------------------------------------------

          cp "$INPUT" output/stage10/final_master.mp4

          test -s output/stage10/final_master.mp4

          echo "" | tee -a "$REPORT"
          echo "========================================" | tee -a "$REPORT"
          echo "RESULTADO: APROVADO" | tee -a "$REPORT"
          echo "Master final: output/stage10/final_master.mp4" | tee -a "$REPORT"
          echo "========================================" | tee -a "$REPORT"

      - name: Stage 10 - Criar Relatorio JSON
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          video = Path(
              "output/stage10/final_master.mp4"
          )

          def probe(args):
              return subprocess.check_output(
                  args,
                  text=True
              ).strip()

          duration = float(
              probe([
                  "ffprobe",
                  "-v", "error",
                  "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1",
                  str(video)
              ])
          )

          width = int(
              probe([
                  "ffprobe",
                  "-v", "error",
                  "-select_streams", "v:0",
                  "-show_entries", "stream=width",
                  "-of", "csv=p=0",
                  str(video)
              ])
          )

          height = int(
              probe([
                  "ffprobe",
                  "-v", "error",
                  "-select_streams", "v:0",
                  "-show_entries", "stream=height",
                  "-of", "csv=p=0",
                  str(video)
              ])
          )

          freezes = Path(
              "output/stage10/freezes.txt"
          ).read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines()

          blacks = Path(
              "output/stage10/black_frames.txt"
          ).read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines()

          silences = Path(
              "output/stage10/silences.txt"
          ).read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines()

          report = {
              "status": "APROVADO",
              "master": "final_master.mp4",
              "resolution": {
                  "width": width,
                  "height": height
              },
              "duration_seconds": round(duration, 3),
              "freeze_events_raw": freezes,
              "black_events_raw": blacks,
              "silence_events_raw": silences,
              "music": False,
              "visual_polish": True,
              "narration_preserved": True
          }

          Path(
              "output/stage10/qa_report.json"
          ).write_text(
              json.dumps(
                  report,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )
          PY

          test -s output/stage10/qa_report.json

      - name: Disponibilizar Stage 10 QA e Master Final
        uses: actions/upload-artifact@v4
        with:
          name: stage-10-final-master-qa
          path: |
            output/stage10/final_master.mp4
            output/stage10/qa_report.txt
            output/stage10/qa_report.json
            output/stage10/decode_errors.txt
            output/stage10/freezes.txt
            output/stage10/black_frames.txt
            output/stage10/silences.txt
          retention-days: 7
          if-no-files-found: error

      # =========================================================
      # APP - PUBLICAR RESULTADO NA RELEASE TEMPORARIA
      # =========================================================

      - name: App - Publicar master final
        if: ${{ success() && inputs.app_job_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_JOB_TAG: ${{ inputs.app_job_tag }}
        run: |
          set -e

          test -s output/stage10/final_master.mp4
          test -s output/stage10/qa_report.json

          gh release upload "$APP_JOB_TAG" \
            "output/stage10/final_master.mp4#final_master.mp4" \
            "output/stage10/qa_report.json#qa_report.json" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: App - Publicar marcador de falha
        if: ${{ failure() && inputs.app_job_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_JOB_TAG: ${{ inputs.app_job_tag }}
        run: |
          set +e

          mkdir -p output/app_status

          cat > output/app_status/job_failed.json <<EOF
          {
            "status": "ERRO",
            "job_tag": "${APP_JOB_TAG}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}"
          }
          EOF

          gh release upload "$APP_JOB_TAG" \
            "output/app_status/job_failed.json#job_failed.json" \
            --repo "${{ github.repository }}" \
            --clobber || true

      # =========================================================
      # VALIDAR V15
      # =========================================================

      - name: Validar V15 AI Director
        shell: bash
        run: |
          set -e

          test -s output/stage08/final_ai_director.mp4
          test -s output/stage09/final_visual_polish.mp4
          test -s output/stage10/final_master.mp4
          test -s output/stage06_ai/director_plan.json

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            output/stage10/final_master.mp4)

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            output/stage10/final_master.mp4)

          if [ "$WIDTH" != "1080" ] || [ "$HEIGHT" != "1920" ]; then
            echo "ERRO: final fora de 1080x1920."
            exit 1
          fi

          echo "========================================"
          echo "V15.21 VISION FRAME FIX VALIDADO"
          echo "Vision: OK"
          echo "Prompt opcional: OK"
          echo "Video sem narracao: suportado"
          echo "Diretor multimodal Gemini: suportado"
          echo "Plano manual sem IA: suportado"
          echo "Reuso de plano aprovado sem Gemini: suportado"
          echo "Legenda original preservada como ancora semantica: suportado"
          echo "Trilha sonora: DESATIVADA"
          echo "Acabamento visual conservador: suportado"
          echo "QA tecnico automatico: suportado"
          echo "Freeze final: removido"
          echo "========================================"

      # =========================================================
      # ARTIFACTS
      # =========================================================

      - name: Disponibilizar Stage 01
        uses: actions/upload-artifact@v4
        with:
          name: stage-01-clean-master
          path: output/clean_master.mp4
          retention-days: 7
          if-no-files-found: error

      - name: Disponibilizar Stage 03-05
        uses: actions/upload-artifact@v4
        with:
          name: stage-05-understanding
          path: |
            output/scene_report.txt
            output/edit_plan.csv
            output/stage05/transcript.txt
            output/stage05/transcript.json
            output/stage05/scene_manifest.json
            output/stage05/scene_manifest.txt
